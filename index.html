  keltern(d){
    const l=lot(d.id), frei=S.fassraum-fassBelegt();
    if(frei<=0) return meldung('Kein Fassraum frei','Kauf erst Fassraum dazu, sonst kannst du nicht keltern.','fassgang');
    if(l.liter>frei) return openSheet(`${sbild('fassgang')}<h3>Fassraum reicht nicht</h3><p>Frei sind ${num(frei)}\u00a0l, du hast ${num(l.liter)}\u00a0l Trauben. Wenn du jetzt kelterst, gehen ${num(l.liter-frei)}\u00a0l verloren.</p><div class="btns"><button class="sec" data-a="close">Erst Fassraum kaufen</button><button class="wag" data-a="kelternJa" data-id="${l.id}">Trotzdem keltern</button></div>`);
    AKT.kelternJa(d);
  },
  kelternJa(d){const l=lot(d.id);closeSheet();l.liter=Math.min(l.liter,S.fassraum-fassBelegt());l.status='fass';l.fassMonate=0;save();render()},
  kaufFass(){
    const kap=S.lagerarb*FASS_JE_LAGERARB-S.fassraum, max=Math.min(20000,kap,Math.floor(S.geld/fassPreis()/500)*500);
    if(kap<500) return leuteSheet('Zu wenige Lagerarbeiter',`<p>Ein Lagerarbeiter betreut ${num(FASS_JE_LAGERARB)}\u00a0l Fassraum. Deine Leute betreuen ${num(S.lagerarb*FASS_JE_LAGERARB)}\u00a0l, du hast schon ${num(S.fassraum)}\u00a0l.</p><p class="mut">Für mehr Fassraum stell erst beim Arbeitsamt ein.</p>`);
    if(max<500) return meldung('Zu wenig Geld',`500 l Fassraum kosten ${eur(500*fassPreis())}.`);
    mengeSheet({titel:'Fassraum kaufen',bild:'fassgang',text:`${eur2(fassPreis())} je Liter Fassraum. Deine Lagerarbeiter schaffen noch ${num(kap)}\u00a0l mehr.`,max,step:500,start:Math.min(max,2000),okText:'Kaufen',
      info:n=>`<b>${num(n)}\u00a0l</b>kostet ${eur(n*fassPreis())}`,ok:n=>{fx('stempel');zahle(n*fassPreis());S.fassraum+=n}});
  },
  kaufFlaschen(){
    const kap=S.lagerarb*FLASCHEN_JE_LAGERARB-S.flaschen, max=Math.min(30000,kap,Math.floor(S.geld/flaschePreis()/100)*100);
    if(kap<100) return leuteSheet('Zu wenige Lagerarbeiter',`<p>Ein Lagerarbeiter betreut ${num(FLASCHEN_JE_LAGERARB)} leere Flaschen. Deine Leute betreuen ${num(S.lagerarb*FLASCHEN_JE_LAGERARB)}, du hast schon ${num(S.flaschen)}.</p><p class="mut">Für mehr Flaschen stell erst beim Arbeitsamt ein, oder füll erst Wein ab.</p>`);
    if(max<100) return meldung('Zu wenig Geld',`100 Flaschen kosten ${eur(100*flaschePreis())}.`);
    mengeSheet({titel:'Leere Flaschen kaufen',text:`${eur2(flaschePreis())} je Flasche (1 Liter). Deine Lagerarbeiter schaffen noch ${num(kap)} mehr.`,max,step:100,start:Math.min(max,2000),okText:'Kaufen',
      info:n=>`<b>${num(n)} Flaschen</b>kostet ${eur(n*flaschePreis())}`,ok:n=>{fx('stempel');zahle(n*flaschePreis());S.flaschen+=n}});
  },
  anmelden(d){
    const l=lot(d.id);
    const M=mani(l);
    const zeilen=[...REIHE].reverse().concat('feder').map(st=>{const g=pruefeAnmeldung(l,st),s=STUFEN[st],ill=M&&!maniLegal(l,st);
      return `<div class="stufe"><div class="row"><b>${g.length?'✗':'✓'} ${s.name}</b>${g.length?'':`<button class="klein ${ill?'wag':''}" data-a="anmeldeJa" data-id="${l.id}" data-st="${st}">${ill?`🤫 Unter der Hand (${eur(s.geb+schmier(l,st))})`:`Anmelden${s.geb?' ('+eur(s.geb)+')':''}`}</button>`}</div>${g.length?`<div class="mut">${g.map(esc).join(' · ')}</div>`:st==='eis'?`<div class="mut">Wertstufe: Öchsle einer ${EIS_WERT[eisStufe(l.oe)].name}${eisStufe(l.oe)?`, Preis +${Math.round((EIS_WERT[eisStufe(l.oe)].f-1)*100)}\u00a0%`:''}</div>`:''}</div>`}).join('');
    openSheet(`${sbild('amt')}<h3>${esc(lotName(l))} anmelden</h3><p class="mut">${num(l.liter)}\u00a0l · ${l.oe}° Öchsle · ${LESE[l.leseart]} · Edelfäulnis ${l.edel?'ja':'nein'} · ${l.fassMonate} Monate im Fass</p>${M?`<p class="hilfe" style="margin:0 0 10px">🤫 Dieser Most ist ${maniText(l)}. Erlaubt ist das nur beim Tafelwein bis ${ZUCKER_ERLAUBT}\u00a0%. Alles andere geht nur unter der Hand gegen Schmiergeld, und der Wein gilt dann als gepanscht.</p>`:''}${zeilen}${mib('keller')}<div class="btns"><button class="sec" data-a="close">Schließen</button></div>`);
  },
  anmeldeJa(d){
    const l=lot(d.id), st=d.st, s=STUFEN[st];
    if(pruefeAnmeldung(l,st).length) return;
    // Gepanschter Most: nur unter der Hand, mit Schmiergeld und ohne Ansehen.
    const ill=mani(l)&&!maniLegal(l,st), sg=ill?schmier(l,st):0;
    if(ill&&S.geld<s.geb+sg) return meldung('Zu wenig Geld',`Der Beamte will ${eur(sg)} Schmiergeld${s.geb?`, dazu kommt die Gebühr von ${eur(s.geb)}`:''}.`);
    zahle(s.geb+sg);l.stufe=st;if(ill)l.pansch=true;
    if(st==='eis') l.eisW=eisStufe(l.oe);
    l.qp=qpFuer(l,st);
    const ans=s.ans&&!ill?ruhm(s.ans):0;closeSheet();save();render();fx('stempel');
    meldung('Angemeldet',`${lotName(l)} steht jetzt mit ${l.qp} Qualitätspunkten im Kellerbuch.`+(ill?` Der Beamte hat ${eur(sg)} eingesteckt. Bis der Wein verkauft ist, darf ihn kein Prüfer finden.`:'')+(ans?` +${ans} Ansehen.`:'')+(st==='feder'?' Federweißer muss noch diesen Monat in die Flasche.':' Jetzt darf er abgefüllt werden.'),'kellerbuch');
  },
  abfuellen(d){
    const l=lot(d.id); closeSheet();
    if(!l||!l.stufe) return;
    if(S.flaschen<l.liter) return meldung('Zu wenige Flaschen',`Abgefüllt wird immer das ganze Fass. Du brauchst ${num(l.liter)} Flaschen und hast ${num(S.flaschen)}. Es fehlen ${num(l.liter-S.flaschen)}.`);
    S.flaschen-=l.liter;l.status='flasche';l.flMonate=0;fx('korken');save();render();
  },
  sekt(d){
    const l=lot(d.id), max=Math.min(l.liter,Math.floor(S.geld/SEKT_KOSTEN));
    if(max<1) return meldung('Zu wenig Geld',`Versekten kostet ${eur2(SEKT_KOSTEN)} je Flasche.`);
    mengeSheet({titel:`${lotName(l)} zu Sekt machen`,text:`${eur2(SEKT_KOSTEN)} je Flasche. Der Sekt ruht danach 9 Monate und bringt dann deutlich mehr als der Grundwein. Der erste Sekt im Jahr bringt Ansehen.`,max,rangeStep:1,step:l.liter>2000?100:l.liter>200?10:1,start:max,okText:'Versekten',
      info:n=>`<b>${num(n)} Flaschen</b>kostet ${eur(n*SEKT_KOSTEN)}`,
      ok:n=>{fx('korken');zahle(n*SEKT_KOSTEN);S.lots.push({...l,id:S.nextId++,liter:n,sekt:true,flMonate:0,qp:l.qp+5,med:(l.med||[]).slice(),bund:false});l.liter-=n;if(l.liter<=0)S.lots=S.lots.filter(x=>x!==l);if(S.sektJahr!==S.jahr&&!l.pansch){S.sektJahr=S.jahr;ruhm(3)}}});
  },
  kredit(){
    if(S.kredit) return;
    mengeSheet({titel:'Kredit aufnehmen',bild:'bank',text:`Dein Kreditrahmen: ${eur(rahmen())}. Mindestens 5.000 €.`,max:rahmen(),step:1000,start:10000,okText:'Weiter',
      info:n=>`<b>${eur(n)}</b>Die Laufzeit wählst du im nächsten Schritt`,
      ok:n=>{
        if(n<5000) return meldung('Zu wenig','Die Bank vergibt Kredite erst ab 5.000 €.');
        openSheet(`${sbild('bank')}<h3>Laufzeit für ${eur(n)}</h3>${[12,24,36,48].map(m=>`<button class="wahl" data-a="kreditJa" data-n="${n}" data-m="${m}"><b>${m} Monate</b><br><span class="mut">erste Rate ${eur(n/m+n*ZINS/12)}, Zinsen gesamt rund ${eur(n*ZINS/12*(m+1)/2)}</span></button>`).join('')}<div class="btns"><button class="sec" data-a="close">Abbrechen</button></div>`);
      }});
  },
  kreditJa(d){const n=+d.n,m=+d.m;closeSheet();if(S.kredit)return;S.kredit={rest:n,tilgung:Math.ceil(n/m)};S.geld+=n;fx('kasse');save();render()},
  tilgen(){const k=S.kredit;if(!k)return;if(S.geld<k.rest)return meldung('Zu wenig Geld',`Zum Ablösen brauchst du ${eur(k.rest)} auf dem Konto.`,'bank');S.geld-=k.rest;S.kredit=null;fx('stempel');save();render()},
  helfer(d){
    const k=d.id, a=S.loehne[k];
    // Niemand darf festhängen: Fehlen Leute dieser Art, geht Einstellen auch ohne Geld, das Konto rutscht dann ins Minus.
    if(+d.n>0){if(S.geld<VERMITTLUNG&&!leuteFehlen()[k]) return meldung('Zu wenig Geld',`Die Vermittlung kostet ${eur(VERMITTLUNG)}.`);zahle(VERMITTLUNG);S[k]++;a.push(S.angebot[k]);a.sort((x,y)=>x-y);fx('stempel')}
    else if(S[k]>0){S[k]--;a.pop()}
    save();render();
  },
  maschKauf(){
    if(S.monat>2) return;
    if(S.geld<MASCH_PREIS) return meldung('Zu wenig Geld',`Eine Erntemaschine kostet ${eur(MASCH_PREIS)}.`);
    zahle(MASCH_PREIS);S.maschinen.push({zustand:100});fx('stempel');save();render();
  },
  maschVerkauf(d){if(S.monat>2)return;const ma=S.maschinen[+d.id];kassiere(Math.round(MASCH_PREIS*.5*ma.zustand/100));S.maschinen.splice(+d.id,1);save();render()},
  maschWarten(d){
    const ma=S.maschinen[+d.id], max=Math.min(100-ma.zustand,Math.floor(S.geld/WARTUNG));
    if(max<1) return meldung('Geht gerade nicht','Dir fehlt das Geld für die Wartung.');
    mengeSheet({titel:'Maschine warten',text:`${eur(WARTUNG)} je Prozentpunkt.`,max,rangeStep:1,step:5,start:max,okText:'Warten',
      info:n=>`<b>auf ${ma.zustand+n}\u00a0%</b>kostet ${eur(n*WARTUNG)}`,ok:n=>{fx('stempel');zahle(n*WARTUNG);ma.zustand+=n}});
  },
  verkaufen(d){
    const l=lot(d.id), w=wege(l)[0]; if(!w||l.regal) return; const p=w.p;
    mengeSheet({titel:`${lotName(l)} verkaufen`,text:`${w.flag} ${w.name}: ${eur2(p)} je Flasche. ${marktRest()?`Zum vollen Preis kauft der Großhandel diesen Monat noch für ${eur(marktRest())}, danach sinkt er.`:'Der Markt ist diesen Monat satt, der Preis ist gedrückt. Nächsten Monat zahlt der Großhandel wieder voll.'} Was du behältst, reift weiter.`,max:l.liter,rangeStep:1,step:l.liter>2000?100:l.liter>200?10:1,start:Math.min(l.liter,Math.floor(marktRest()/p)||l.liter),okText:'Verkaufen',
      info:n=>{const f=marktF(n*p);return `<b>${num(n)} Flaschen</b>bringt dir ${eur(n*p*f)}${f<.995?`<br>📉 im Schnitt ${eur2(p*f)} je Flasche, der Markt ist satt`:''}`},
      ok:n=>{kassiere(Math.round(n*p*marktF(n*p)));S.absatz=(S.absatz||0)+n*p;l.liter-=n;if(l.liter<=0)S.lots=S.lots.filter(x=>x!==l)}});
  }
};
/* ================= Titelbild und Geschichte ================= */
// Das Titelbild steht bei jedem Start vorn. Der erste Tipp darauf schaltet auch den Ton frei.
// Die Geschichte läuft vor jedem neuen Spiel Satz für Satz über das Titelbild. Ein Tipp zeigt alles auf einmal, "Überspringen" geht immer.
const GESCHICHTE=['Neun Jahre lang hast du für andere geschuftet.','Dann stand in der Zeitung eine kleine Anzeige: drei Hektar Weinberg, ein alter Gewölbekeller, günstig abzugeben.','Du hast dein Erspartes zusammengekratzt und unterschrieben, bevor dir jemand die Sache ausreden konnte.','Jetzt stehst du vor kahlen Hängen, leeren Fässern und einer Ratte, die sich im Keller wie die Hausherrin benimmt.','Im Dorf wetten sie schon, dass du keine drei Winter durchhältst, und die Winzer von nebenan warten nur auf deinen ersten Fehler.','Zeig es ihnen: Oben im Festsaal des Weinbauverbands steht ein Stuhl, und der ist noch frei.'];
const SATZ_TAKT=3.2;
function zeigeTitel(){
  // Drei Knöpfe: Weiterspielen (nur mit Spielstand), Neues Spiel, Spiel laden. Darunter klein die Version und die Nennung, die ElevenLabs im Gratis-Tarif verlangt.
  const t=$('#titel'), hat=[0,1,2].some(lies); t.className='an'; delete t.dataset.a;
  t.innerHTML=`<h1>150 Grad Öchsle</h1><div class="unter">Vom kahlen Hang in den Festsaal des Weinbauverbands</div><div class="fuss"><div class="von">Ein Spiel von Maik Dienst</div>
    <div class="tkn">${hat?'<button data-a="titelWeiter">Weiterspielen</button>':''}<button ${hat?'class="sec" ':''}data-a="titelNeu">Neues Spiel</button><button class="sec" data-a="titelLaden">Spiel laden</button><button class="sec klein" data-a="buch">📜 Spielanleitung</button></div>
    <div class="version">Version ${VERSION}<br>Bilder, Musik und Geräusche mit KI erstellt · Geräusche von ElevenLabs (elevenlabs.io)</div></div>`;
}
function zeigeGeschichte(){
  const t=$('#titel'), zeit=i=>(.4+i*SATZ_TAKT).toFixed(1); t.className='an text'; t.dataset.a='geschTipp';
  t.innerHTML=`<button class="weg" data-a="geschWeg">Überspringen ✕</button><div class="gesch">${GESCHICHTE.map((s,i)=>`<p style="animation-delay:${zeit(i)}s">${s}</p>`).join('')}</div><div class="fuss" style="animation-delay:${zeit(GESCHICHTE.length)}s"><button data-a="geschWeg">Los geht's ▶</button></div>`;
}
function titelZu(){const t=$('#titel'); t.className=''; t.innerHTML=''; delete t.dataset.a}

/* ================= Tippen und Wischen ================= */
// Wischen über das Bild wechselt zum Ort daneben, an den Enden ist Schluss. Am Laptop geht es auch mit gedrückter Maus und mit den Pfeiltasten.
let WISCH=null, WISCH_ZEIT=0;
function subNachbar(d){
  const L=SUBS[TAB]; if(!S||!L||S.pruefer) return;
  const i=L.findIndex(s=>s[0]===SUB)+d; if(i<0||i>=L.length) return;
  SUB=L[i][0]; render();
}
document.addEventListener('pointerdown',e=>{WISCH=e.target.closest('.pano')?{x:e.clientX,y:e.clientY}:null});
document.addEventListener('pointercancel',()=>{WISCH=null});
document.addEventListener('pointerup',e=>{
  if(!WISCH) return; const dx=e.clientX-WISCH.x, dy=e.clientY-WISCH.y; WISCH=null;
  if(Math.abs(dx)<40||Math.abs(dx)<Math.abs(dy)*1.5) return;
  WISCH_ZEIT=Date.now(); tonAn(); subNachbar(dx<0?1:-1);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  if($('#sheet').classList.contains('an')||$('#titel').classList.contains('an')||$('#buch').classList.contains('an')||/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  subNachbar(e.key==='ArrowLeft'?-1:1);
});
document.addEventListener('click',e=>{
  // Nach einem Wischen zählt das Loslassen nicht als Tipp.
  const b=e.target.closest('[data-a]'); if(!b||b.disabled||Date.now()-WISCH_ZEIT<350) return;
  tonAn(); if(AC&&AC.state==='suspended') AC.resume();
  const a=b.dataset.a, vorn=/^(titel|gesch)/.test(a);
  if(!vorn&&S&&S.pleite&&!['neuJa','tab','sub','close','weiter','menue','ton','infoWeiter','buch','buchZu'].includes(a)) return;
  // Solange der Weinprüfer wartet, geht nichts anderes.
  if(!vorn&&S&&S.pruefer&&!['pruefJa','pruefBestechen','slMinus','slPlus','slOk','close','ton','menue','buch','buchZu'].includes(a)) return zeigePruefer();
  const f=AKT[a]; if(f){f(b.dataset,e); fx('klick')}
});
$('#datei').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>dateiLaden(String(r.result),ZIEL); r.readAsText(f)});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&!SL)closeSheet()});
load(); render(); zeigeTitel();
// Als App: Der Helfer sw.js legt alle Dateien aufs Gerät, danach läuft das Spiel ohne Netz und holt sich neue Fassungen von selbst.
// Am Laptop (localhost) bleibt er aus, damit beim Bauen nichts Altes hängen bleibt. Zum Testen dort: ?app an die Adresse hängen.
if('serviceWorker' in navigator&&(location.protocol==='https:'||/[?&]app\b/.test(location.search))) navigator.serviceWorker.register('sw.js').catch(()=>{});
// Bittet den Browser, die Spielstände nicht von selbst wegzuräumen.
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
</body>
</html>
