<style>
/* Schrift Alegreya (Google Fonts, freie Lizenz OFL), nur lateinische Zeichen. Alegreya ist variabel: eine Datei für normal bis fett. */
@font-face{font-family:"Alegreya";font-style:normal;font-weight:400 900;font-display:swap;src:url(schrift/alegreya.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Alegreya";font-style:italic;font-weight:400;font-display:swap;src:url(schrift/alegreya-kursiv.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Alegreya SC";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/alegreya-sc.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Fraktur nur für den Zeitungskopf, die Datei enthält nur die Buchstaben von "Der Winzerbote". */
/* Version 7.3: volle Fraktur (UnifrakturMaguntia) für den Kopf des Winzerboten und die Urkunde, dazu Schreibschrift (Pinyon Script) für den Namen. Beide frei unter OFL, Lizenz in schrift/. */
@font-face{font-family:"Winzerbote Fraktur";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/fraktur-voll.woff2) format("woff2")}
@font-face{font-family:"Urkunde Fraktur";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/fraktur-voll.woff2) format("woff2")}
@font-face{font-family:"Urkunde Schreibschrift";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/pinyon.woff2) format("woff2")}
@font-face{font-family:"Alegreya SC";font-style:normal;font-weight:700;font-display:swap;src:url(schrift/alegreya-sc-fett.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Farben passend zu den Bildern: Weinlaub-Grün fürs Weingut, Pflaster-Ton für die Stadt, dunkles Holz für die Kellerei. --kopf ist die Leiste oben. */
:root{--bg:#c3d99e;--card:#edf5dc;--ink:#232a1a;--mut:#53613d;--wein:#7b1e3a;--kopf:#7b1e3a;--gruen:#44692a;--blau:#4a4f8f;--line:#a4bf7e;--rot:#b3261e;--gold:#a87908;
--schrift:"Alegreya",Georgia,"Times New Roman",serif;--knopf:"Alegreya SC","Alegreya",Georgia,"Times New Roman",serif;
--schild:url(bilder/schild-haupt.webp);--kschrift:#f8e6bf;--kschatten:0 1px 2px #3a0a16}
html.ort-stadt{--bg:#f2e2d2;--card:#fdf4ea;--ink:#2d2116;--line:#e3c8ae;--mut:#7a6453;--gruen:#58793a}
html.ort-keller{--bg:#2b1c12;--card:#3b281a;--ink:#f4e7d2;--mut:#bfa888;--wein:#cc607b;--kopf:#4a1526;--gruen:#9cbf74;--blau:#9aa0e0;--line:#5a4029;--rot:#f0766a;--gold:#e4b54a}
@media (prefers-color-scheme:dark){
:root{--bg:#13210d;--card:#1f2d17;--ink:#ecf0e2;--mut:#9aa68a;--wein:#c2516f;--kopf:#5c1830;--gruen:#8fb56a;--blau:#8d93d6;--line:#374b29;--rot:#ef6a60;--gold:#e0b84a}
html.ort-stadt{--bg:#1f1814;--card:#2e2520;--ink:#f1e8dc;--line:#48392f;--mut:#a89a8c}
html.ort-keller{--bg:#1a110a;--card:#2a1b11;--ink:#f1e8dc;--mut:#a89a8c;--wein:#c2516f;--kopf:#4a1526;--gruen:#8fb56a;--blau:#8d93d6;--line:#4a3422;--rot:#ef6a60;--gold:#e0b84a}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);transition:background-color .35s;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#top{position:sticky;top:0;z-index:5;background-color:#5c3a21;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 23px),linear-gradient(#6e4729,#4a2e18);border-bottom:2px solid #2b180c;box-shadow:0 3px 6px rgba(0,0,0,.3);color:#f5ebd6;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#top b{font-size:17px}#top small{opacity:.85;display:block;font-size:12px}
#top>div{background:rgba(43,24,12,.55);border:1px solid rgba(229,169,60,.4);border-radius:10px;padding:4px 10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
#top>div b{color:#f8e7bf;text-shadow:0 1px 1px #000}#top .geld b{color:#f3c766}#top .geld{cursor:pointer}#top .geld b::after,#top .wtr small::after{content:' ›';opacity:.6;font-weight:400}#top .wtr{cursor:pointer}
#top .geld{text-align:right;font-variant-numeric:tabular-nums}
main{padding:12px 16px calc(130px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h2{font:700 21px/1.2 var(--schrift);margin:6px 0 10px}h3{font:700 18px/1.25 var(--schrift);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.mut{color:var(--mut);font-size:14px}.rot{color:var(--rot)}.gruen{color:var(--gruen)}.gold{color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:15px}.kv span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* Knöpfe als gemalte Holzschilder (seit 7.1): Bild als Rahmen, die Enden (40 Pixel im Bild, 12 am Schirm) behalten ihre Form, die Mitte wird in die Breite gezogen.
   --schild ist das Bild, --kschrift die Schriftfarbe: Hauptknopf weinrot gebeizt mit Messingrand, zweiter Knopf (.sec) helles Holz mit Weinrot, gewagte Knöpfe (.wag) dunkles Holz mit roter Linie. Überall gleich, auch im Keller. */
button{font:700 17px/1.15 var(--knopf);font-variant-caps:small-caps;letter-spacing:.04em;color:var(--kschrift);text-shadow:var(--kschatten);background:none;border:0 solid transparent;border-image:var(--schild) 50% 40 fill/50% 12px stretch;padding:12px 22px;min-height:46px;cursor:pointer;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4));transition:transform .08s,filter .08s}
button:active{transform:translateY(2px);filter:drop-shadow(0 0 0 transparent) brightness(.92)}
button.sec{--schild:url(bilder/schild-zweit.webp);--kschrift:#4a1526;--kschatten:none;font-weight:700}
button.wag{--schild:url(bilder/schild-wag.webp);--kschrift:#f4e4d4;--kschatten:0 1px 2px #000}
button.klein{min-height:40px;padding:8px 16px;font-size:15px}
button:disabled{opacity:.45;filter:grayscale(.7)}
/* Alles, was kein Schild ist: Auswahlkarten, Aufgaben, Auswahl-Knöpfe, Reiter, Zettel, Zeilen im Kellerbuch. */
.wahl,.task,.chip,.zettel,.bzeile,#tabs button,#titel .weg{border-image:none;filter:none;font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;text-shadow:none;border-radius:12px;padding:12px 14px}
/* Version 4.0: Alle Karten sind Pergament, an jedem Ort gleich. Die Ortsfarbe bleibt nur im Hintergrund. */
.card,.task,.wahl,.bzeile{--ink:#2b2118;--mut:#6b5a45;--line:#d3bf93;--wein:#7b1e3a;--rot:#b3261e;--gruen:#4c7030;--blau:#4a4f8f;--gold:#946b06;--card:#f8f0dc;background:linear-gradient(#fbf5e6,#f3e7cc);color:var(--ink);border:1px solid #cdb68a;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(43,24,12,.2)}
.card h3{color:#4a1526}.card .card{box-shadow:none}
.task{border-left:5px solid #4c7030}.task.rot{border-left-color:#b3261e}.wahl.an{border-color:#7b1e3a;box-shadow:0 0 0 2px #7b1e3a inset}
main>h3{font-size:17px;margin:16px 0 8px;padding-left:10px;border-left:4px solid var(--wein)}
/* Version 4.1: Link ins Buch, Gebiets-Steckbrief, Fußnote im Büro */
.mib{display:block;width:max-content;margin:7px 0 0;font-size:13px;font-weight:700;color:#7b1e3a;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sb h3 small{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-top:2px}
.sb .sbz{margin:6px 0;font-size:14px;line-height:1.5}
.sterne{color:#a87908;letter-spacing:1px;white-space:nowrap}.sterne i{font-style:normal;opacity:.28}
.rolle{display:inline-block;padding:0 7px;border-radius:9px;font-size:12px;font-weight:700;line-height:1.5;background:rgba(123,30,58,.09);color:#4a1526;white-space:nowrap}
.sb .schild{display:inline-block;margin:2px 0 4px;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(123,30,58,.09);color:#4a1526}
.sb .schild.leicht{background:rgba(60,130,60,.14);color:#24521f}.sb .schild.riskant{background:rgba(170,40,30,.14);color:#6e1a12}
.sb .strat{margin:4px 0 0;padding-left:20px}.sb .strat li{margin:2px 0}
.sb .lohnt{margin-top:8px;padding:6px 10px;border-radius:8px;background:rgba(123,30,58,.09);font-weight:700;color:#4a1526;font-size:14px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.gchips .wahl{flex:1 1 30%;margin:0;padding:9px 4px;text-align:center;font-weight:600;font-size:14px}.gchips .gs{display:block;width:44px;height:44px;margin:0 auto 4px}
.fussnote{font-size:12px;color:var(--mut);margin:2px 4px 14px;text-align:center}
/* Version 11.2: vier Kacheln oben im Büro (Erfolge, Wissen, Familie, Einstellungen), die gewählte hat den weinroten Rand. */
.bkach{display:flex;gap:6px;margin:0 0 12px}.bkach .wahl{flex:1 1 0;min-width:0;min-height:58px;margin:0;padding:7px 0 6px;text-align:center;font-weight:600;font-size:11px;line-height:1.15;white-space:nowrap}
.bkach .wahl i{display:block;font-style:normal;font-size:20px;line-height:24px;margin-bottom:2px}.bkach .wahl.an{font-weight:700;color:#7b1e3a}
/* Seit der Optik 2.0 (10.5): schmaler Pergament-Rahmen wie beim aktiven Unterreiter, die gewählte Kachel hell mit weinroter Linie, die anderen etwas dunkler. */
.bkach .wahl{border-image:url(bilder/karte-neu.webp) 56 fill/9px stretch;filter:brightness(.86)}.bkach .wahl.an{filter:none;outline:2px solid #7b1e3a;outline-offset:-4px;border-radius:9px}
/* Das Buch: Vollbild im Papier-Stil wie der Winzerbote */
#buch{display:none;position:fixed;inset:0;z-index:40;flex-direction:column;background:#f3e7ca url(bilder/papier.jpg) center/cover;color:#2b2118;--ink:#2b2118;--mut:#6b5a45;--line:#d3bf93;--wein:#7b1e3a;--card:#fbf4e1}
#buch.an{display:flex}
#buch .bkopf,#buch .binnen,#buch .bfuss{width:100%;max-width:620px;margin:0 auto}
#buch .bkopf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid #b9995a}
#buch .bkopf b{font:26px/1.1 "Winzerbote Fraktur",Georgia,serif;color:#4a1526}
#buch .binnen{flex:1;overflow:auto;padding:14px 18px 22px;font-size:15px;line-height:1.5}
#buch .bfuss{display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #b9995a}
#buch .bfuss button{flex:1}
#buch .bnr{font:700 13px "Alegreya SC",Georgia,serif;color:#7b1e3a;letter-spacing:.5px}
#buch h2{font:700 23px/1.2 Georgia,serif;color:#4a1526;margin:2px 0 10px}
#buch .kurz{background:rgba(255,255,255,.5);border-left:4px solid #7b1e3a;border-radius:8px;padding:8px 12px;margin:0 0 12px}
#buch ul,#buch ol{margin:0 0 12px;padding-left:20px}#buch li{margin:0 0 6px}#buch li ul,#buch li ol{margin:6px 0 0}
#buch details{border-top:1px solid #b9995a;padding-top:8px;margin-top:4px}
#buch summary{font:700 17px Georgia,serif;color:#4a1526;cursor:pointer;margin-bottom:8px}
#buch h4{font:700 16px Georgia,serif;color:#4a1526;margin:14px 0 6px}
#buch .bv{color:#7b1e3a;font-weight:700;text-decoration:underline;cursor:pointer}
#buch .binh h3{font:700 15px "Alegreya SC",Georgia,serif;color:#7b1e3a;margin:16px 0 2px;letter-spacing:.5px}
#buch .binh .bz{display:flex;gap:8px;padding:9px 2px;border-bottom:1px dotted #b9995a;font:16px Georgia,serif;cursor:pointer}
#buch .binh .bz span{color:#7b1e3a;min-width:24px;font-weight:700}
.chip{background:#f8f0dc;color:#2b2118;border:1px solid #b9995a;font-weight:600}.chip.an{background:#7b1e3a;color:#fff;border-color:#591015}
h4.gk{font:700 15px/1.2 var(--schrift);margin:12px 0 4px;color:#4a1526}
/* 8.0.1 Dein Stand: Abschnitte und Rangleiter */
h4.gs{font:700 17px/1.2 var(--schrift);margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line);color:#4a1526}h3+h4.gs{border:0;padding-top:0;margin-top:2px}
.rleiter{margin:2px 0 10px}.rgl{display:flex;align-items:baseline;gap:8px;font-size:14px;line-height:1.35;padding:3px 6px;margin:0 -6px;white-space:nowrap;border-radius:8px}.rgl b{flex:none;width:20px;text-align:center;font-size:13px}.rgl span{flex:none}.rgl small{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rgl.ok b{color:var(--gruen)}.rgl.jetzt{background:rgba(123,30,58,.12);font-weight:700;color:var(--wein)}.rgl.zu{color:var(--mut)}.rgl.zu b{opacity:.6;font-size:11px}
.pano,.mbild,.kbild{box-shadow:0 0 0 3px #5c3a21,0 0 0 4px #2b180c,0 4px 8px rgba(0,0,0,.35)}.pano,.mbild{margin-top:4px}
/* Okay als gezeichnetes Wachssiegel in Gold (Paket 7). */
.mitte{text-align:center;margin-top:10px}
button.siegel{width:84px;height:84px;min-height:0;padding:0;border-image:none;border-radius:50%;font-size:0;color:transparent;text-shadow:none;background:url(bilder/siegel.webp) center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
button.siegel:active{transform:translateY(2px) scale(.96);filter:brightness(.92)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns button{flex:1 1 auto}
/* Version 4.0: Kauf- und Verkaufsknöpfe mit dem Preis drauf, rechts in der Karte. Links steht eine kurze Erklärung.
   Fehlt das Geld, wird der Knopf grau (.arm), bleibt aber antippbar und sagt, was fehlt. */
.kz{display:flex;align-items:center;gap:10px;margin-top:10px}.kz>div:first-child{flex:1;min-width:0;font-size:14px;color:var(--mut)}
.kzk{display:flex;flex-direction:column;align-items:stretch;gap:7px;flex:none}.kz.reihe .kzk{flex-direction:row-reverse;flex-wrap:wrap;flex:0 1 auto;gap:8px}
button.pk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:122px;min-height:62px;padding:16px 23px 18px;border-image-width:50% 15px;font-size:15px}
button.pk>b{font:800 16px/1.05 var(--knopf);font-variant-caps:normal;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
button.pk>small{font:600 10.5px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;white-space:nowrap;opacity:.85}
button.pk.arm{filter:grayscale(1) opacity(.55)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--gruen)}
.bar.w i{background:var(--wein)}.bar.g i{background:var(--gold)}
.bar.stb{position:relative;overflow:visible;height:10px;margin:6px 0 10px}.bar.stb i{border-radius:6px}.bar.stb u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--wein)}
.bar.fl{position:relative}.bar.fl i{position:absolute;left:0;top:0}.bar.fl i.hell{opacity:.35}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.weiss{background:var(--gruen)}.rotw{background:var(--blau)}
.task{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gruen);margin:0 0 8px;font-weight:500;min-height:0}
.task.rot{border-left-color:var(--rot);color:var(--ink)}.task.gelb{border-left-color:#e5a93c}.task.hin{border-left-color:#b9ad93}
details.stz{margin-top:8px}details.stz summary{cursor:pointer;font-weight:700;opacity:.8;padding:6px 0}
.hilfe{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
/* Version 4.0: alle Bedienelemente unten in der Daumenzone. Oben die Unterreiter auf Pergament, darunter die Hauptleiste aus Holz. */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;filter:drop-shadow(0 -3px 6px rgba(0,0,0,.3))}
#subs{display:flex;max-width:560px;margin:0 auto;padding:4px 6px 0;gap:3px;background:linear-gradient(#efe2c4,#e2d1b3);border-top:2px solid #5c3a21;border-radius:14px 14px 0 0}
#subs button{position:relative;flex:1;min-width:0;min-height:48px;padding:4px 1px 5px;border:0;border-image:none;border-radius:10px 10px 0 0;background:none;color:#6b5236;font:600 10.5px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;text-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background-color .2s,color .2s}
#subs button>i{font-style:normal;font-size:19px;line-height:22px;transition:transform .2s}#subs button>i img{height:20px;vertical-align:-3px}
#subs button>b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#subs button.an{background:#f8f0dc;color:#7b1e3a;box-shadow:inset 0 -3px 0 #8b1e24}#subs button.an>i{transform:scale(1.18) translateY(-1px)}#subs button.an>b{font-weight:800}
#tabs{display:flex;align-items:stretch;padding:4px 4px env(safe-area-inset-bottom);background-color:#5c3a21;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 23px),linear-gradient(#6e4729,#4a2e18);border-top:2px solid #2b180c}
#tabs button{position:relative;flex:1;background:none;color:#ead6ae;border-radius:10px;padding:6px 2px;margin:2px 2px 4px;font-size:11.5px;font-weight:600;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 1px 1px #000;transition:background-color .2s,transform .2s}

/* Version 9.0: Aufstiegs-Szene "Dein Weingut wächst" vor der Feier. Sommerbild der alten Stufe, der Rangtitel wechselt, das Sommerbild der neuen Stufe blendet über (Sommer-Regel). */
#feier .wbild{position:fixed;inset:0;background:#000 50% 50%/100% auto no-repeat}
/* Kamerafahrt (Maik 18.11.2026): Beide Bilder erst weit weg und ganz zu sehen, oben und unten Schwarz. Das alte blendet ins neue über,
   das neue wächst langsam zum Vollbild (Zoom zur rechten Seite) schwenkt zügig ganz nach links ans Ende des Bilds und zurück zur Mitte, dort bleibt es bis zum Knopf Zur Feier. --wr ist das Seitenverhältnis. */
#feier .walt{animation:sw-ein 1.2s ease-out both,wzoom 4s ease-out both}
#feier .wneu{opacity:0;transition:opacity 1.8s ease}
#feier.wachs.neu .wneu{opacity:1;animation:wfahrt var(--wfd,17s) 1.4s both}
@keyframes wzoom{from{transform:scale(.96)}to{transform:none}}
/* Getrennte Abläufe je Aufstieg (Maik 18.11.2026):
   wtor   = Torblick zu Torblick (Stufe 2 bis 4): beide Bilder füllen den Schirm, Blick durch den Torbogen, kein Zoom und kein Schwenk, nur Überblenden.
   wwende = Torblick zu Schrägblick (Stufe 5): vom Torbogen langsam rauszoomen, überblenden, dann reinzoomen, nach rechts, nach links und zur Mitte schwenken.
   ohne   = Schrägblick zu Schrägblick (Stufe 6 bis 10): Kamerafahrt wie oben (wfahrt). */
#feier.wlang .wneu{transition:opacity 3.6s ease}#feier.wachs.wlang.neu .wneu{animation-delay:2.6s}   /* Stufe 6 bis 10: längere Überblendung (Maik 18.11.2026) */
#feier.wtor .wbild{background-size:cover}
#feier.wtor .walt{animation:sw-ein 1.2s ease-out both}
#feier.wachs.wtor.neu .wneu{animation:none}
#feier.wwende .walt{animation:sw-ein 1.2s ease-out both,wraus 3.2s ease-in-out .5s both}

@keyframes wwende{0%{background-size:100% auto;background-position:50% 50%;animation-timing-function:cubic-bezier(.45,0,.35,1)}

  46%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:100% 50%;animation-timing-function:ease-in-out}
  80%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:0% 50%;animation-timing-function:ease-in-out}
  100%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:50% 50%}}
@keyframes wfahrt{0%{background-size:100% auto;background-position:50% 50%;animation-timing-function:cubic-bezier(.45,0,.35,1)}
  26%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:100% 50%;animation-timing-function:cubic-bezier(.4,0,.3,1)}
  77%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:0% 50%;animation-timing-function:cubic-bezier(.45,0,.3,1)}
  100%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:50% 50%}}

.wgbild{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#2a2018;margin:0 0 10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* ===== Version 7.1 "Optik": Papier auf Holztisch (Maiks Wahl 16.11.2026) =====
   Hinter den Karten liegt Holz je Ort, leicht abgedunkelt: Weingut hell, Stadt honigbraun, Kellerei dunkel. Die Karten sind Papier mit einer Holzlinie.
   Kopfleiste und Hauptreiter dunkles Brett, Unterreiter honigbraun mit heller Schrift, ums Hauptbild der Bilderrahmen 1.0. Steht am Ende, damit es auch im dunklen Modus gilt. */
:root{--holz:url(bilder/brett-hell.jpg);--dunkel:.2;--kopf:#3d2719}
html.ort-stadt{--holz:url(bilder/brett-honig.jpg);--dunkel:.22}
html.ort-keller{--holz:url(bilder/brett-dunkel.jpg);--dunkel:.05;--kopf:#3d2719}
html{background:linear-gradient(rgba(20,10,4,var(--dunkel)),rgba(20,10,4,var(--dunkel))),var(--holz) 0 0/100% auto repeat #4a2e18}
body{background:none}
/* Schrift direkt auf dem Holz: hell mit Schatten */
main>h2,main>h3{color:#fbf0d8;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6)}
main>h3{border-left-color:#e8c98a}
.fussnote{color:#f3e6cc;text-shadow:0 1px 2px #000}
/* Kopfleiste und Hauptreiter aus dem dunklen Brett */
#top{background:url(bilder/brett-dunkel.jpg) center/cover;border-bottom:2px solid #1e1008}
#top>div{background:rgba(30,15,6,.5)}
#tabs{background:url(bilder/brett-dunkel.jpg) center/cover;border-top:2px solid #1e1008}
/* Unterreiter aus dem honigbraunen Brett, helle Schrift, der aktive Reiter weinrot auf hellem Grund */
#subs{background:url(bilder/brett-honig.jpg) center/cover;border-top:2px solid #3a2414}
#subs button{color:#fff3dc;text-shadow:0 1px 2px #1e0e04,0 0 5px rgba(30,14,4,.75)}
#subs button.an{background:rgba(255,248,232,.92);color:#7b1e3a;text-shadow:none}
/* Karten: zarter Papierton, Holzlinie, die graue Kleinschrift etwas dunkler */
.card,.wahl,.task,.bzeile{--mut:#4e3d2a;background:#f3e7ca url(bilder/papier.jpg) center/cover;box-shadow:0 3px 8px rgba(20,10,4,.45)}
.card,.wahl,.bzeile{border:2px solid #9a6a35;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px rgba(20,10,4,.45)}
.task{border-top:2px solid #9a6a35;border-right:2px solid #9a6a35;border-bottom:2px solid #9a6a35;border-radius:10px}
.card .card,.card .wahl,.card .bzeile{box-shadow:none}
.wahl.an{border-color:#7b1e3a;box-shadow:0 0 0 2px #7b1e3a inset}
/* Was sonst direkt auf dem Holz liegt, wird auch Papier: Hinweise, Ehrungen und die Auswahl-Knöpfe */
main>.hilfe,main>.ehrung{--ink:#2b2118;--mut:#4e3d2a;--gold:#946b06;color:#2b2118;background:#f3e7ca url(bilder/papier.jpg) center/cover;border:2px solid #9a6a35;border-radius:10px;box-shadow:0 3px 8px rgba(20,10,4,.45)}
main>.ehrung{border-color:#a87908}
.chip{background:#f8f0dc;color:#2b2118;border:1px solid #9a6a35}.chip.an{background:#7b1e3a;color:#fff;border-color:#591015}
/* Bilderrahmen 1.0 ums Hauptbild: eckig, das gemalte Holz liegt als Rahmenbild obenauf */
.pano{border-radius:0;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.pano::after{content:"";position:absolute;inset:0;pointer-events:none;border:13px solid transparent;border-image:url(bilder/rahmen.webp) 39/13px stretch}
.pano .ptitel{padding-bottom:17px}
/* ===== Version 7.4 "Übersicht": ein Baustein für alle Fenster (fenster und fz im Code) =====
   Kopf mit der Überschrift in Schrift und Farbe des Hauptreiters und dem kleinen grauen i oben rechts, darunter Hinweise, Zustand und Zeilen, die Knöpfe unten rechts. */
:root{--ftitel:#7b1e3a;--fgrau:#857560}
.fen{padding:0;overflow:hidden}
.fkopf{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 3px 0 14px;background:rgba(123,30,58,.08);border-bottom:1px solid rgba(154,106,53,.5)}
.fkopf h3{flex:1;min-width:0;margin:0;padding:9px 0 8px;font:700 19px/1.15 var(--knopf);font-variant-caps:small-caps;letter-spacing:.04em;color:var(--ftitel)}
.fkopf h3 small{display:block;margin-top:1px;font:400 13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;color:var(--mut)}
button.fi{flex:none;display:grid;place-items:center;width:44px;height:44px;min-height:0;padding:0;border:0;border-image:none;background:none;filter:none;text-shadow:none;letter-spacing:0;font-variant-caps:normal}
button.fi>i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--fgrau);color:var(--fgrau);font:italic 700 15px/21px Georgia,"Times New Roman",serif;text-align:center}
button.fi.an>i{background:var(--fgrau);color:#fbf5e6}
button.fi.wort{width:auto;padding:0 11px;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fgrau);text-decoration:underline dotted;text-underline-offset:3px}
.finfo{padding:9px 14px 10px;font-size:14px;color:var(--mut);background:rgba(255,255,255,.42);border-bottom:1px solid rgba(154,106,53,.5)}
.fin{padding:10px 14px 12px}
.fin>.hilfe{margin:0 0 9px}.fin>.fstand{margin:0 0 9px;font-size:14px;color:var(--mut)}.fleer{font-size:14px;color:var(--mut)}
.fz{padding:9px 0;border-top:1px solid rgba(154,106,53,.38)}.fz:first-child{border-top:0;padding-top:0}.fz:last-child{padding-bottom:0}
.fz .kz{margin-top:5px;min-height:40px}.fz .kz button{white-space:nowrap}
.fen.zu{opacity:.88}.fen.zu .fkopf{background:none;border-bottom:0}.fen.zu h3{color:var(--mut)}.fen.zu .finfo{border-top:1px solid rgba(154,106,53,.5);border-bottom:0}
/* Antippbare Zeilen im Fenster (Kellerbuch, Großhandel, Regal): wie .fz mit Trennlinie, ohne eigene Karte. .ab setzt die Liste vom Zustand darüber ab. */
.fzl.ab{margin-top:8px;padding-top:9px;border-top:1px solid rgba(154,106,53,.38)}
.fzl>.bzeile{background:none;border:0;border-top:1px solid rgba(154,106,53,.38);border-radius:0;box-shadow:none;margin:0;padding:9px 0}
.fzl>.bzeile:first-child{border-top:0;padding-top:0}.fzl>.bzeile:last-child{padding-bottom:0}
.finfo .kv{font-size:14px;padding:2px 0}.kv.lang span:first-child{flex:none}
/* Block B: Aufgaben, Manager-Zeilen und Bilder im Fenster, der aufgeklappte Steckbrief. */
.fin>.task:last-of-type,.fin>.wahl:last-of-type{margin-bottom:0}.fin .task,.fin .wahl{box-shadow:none}
.fin>.kbild{margin:0 0 10px}.fklapp{margin-top:8px;padding-top:8px;border-top:1px solid rgba(154,106,53,.38)}
/* Version 8.1: Spielführer, Sprechblase nach Entwurf D (Maik 17.11.2026). Maße und Farben aus _entwurf_blase.html.
   Ebene 15: über Kopfleiste und Reitern, unter Dialogen (20), Titel (30) und Buch (40). Abgedunkelt wird nur bei langen Tipps. */
#fdunkel{position:fixed;inset:0;z-index:14;background:rgba(15,9,4,.55)}
#fuehrer{position:fixed;left:10px;right:10px;top:120px;z-index:15;max-width:540px;margin:0 auto;box-sizing:border-box;
  border:2.5px solid #d2a94a;border-radius:18px;background:linear-gradient(rgba(255,251,236,.42),rgba(255,251,236,.42)),#f3e7ca url(bilder/papier.jpg) center/cover;
  box-shadow:0 0 0 1.5px #5d3f18,inset 0 0 0 1px rgba(255,255,255,.55),0 10px 26px rgba(20,10,4,.75);color:#2b2118;padding:14px 16px 16px;
  font:18px/1.38 var(--schrift);animation:fplopp .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes fplopp{from{transform:scale(.8) translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#fuehrer .fname{display:block;font:700 19px/1.1 "Alegreya SC",var(--schrift);color:#7b1e3a;letter-spacing:.02em}
#fuehrer .frolle{display:block;font-size:14px;color:#857560;margin-top:2px}
#fuehrer p{margin:0 0 8px}#fuehrer p:last-child{margin-bottom:0}
#fuehrer .ftext{max-height:max(200px,calc(100vh - 300px));overflow-y:auto;padding-right:6px;-webkit-overflow-scrolling:touch}
#fuehrer .fschatten{height:22px;margin-top:-22px;position:relative;pointer-events:none;background:linear-gradient(rgba(243,231,202,0),rgba(240,228,198,.96));text-align:center;font-size:12px;color:#7b1e3a;line-height:30px}
#fuehrer .fknopf{display:flex;gap:8px;margin-top:10px}
#fuehrer .fknopf button{flex:1 1 0;white-space:nowrap}
@keyframes fkopfwink{0%,80%,100%{transform:none}88%{transform:rotate(-14deg) scale(1.15)}}

.bz3.dws{display:flex;justify-content:space-between;align-items:center}.ksg3.klein .ksg{width:13px;height:13px;margin:0 0 0 3px}
