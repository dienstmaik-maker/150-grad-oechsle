<style>
/* Schrift Alegreya (Google Fonts, freie Lizenz OFL), nur lateinische Zeichen. Alegreya ist variabel: eine Datei für normal bis fett. */
@font-face{font-family:"Alegreya";font-style:normal;font-weight:400 900;font-display:swap;src:url(schrift/alegreya.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Alegreya";font-style:italic;font-weight:400;font-display:swap;src:url(schrift/alegreya-kursiv.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Alegreya SC";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/alegreya-sc.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Fraktur nur für den Zeitungskopf, die Datei enthält nur die Buchstaben von "Der Winzerbote". */
/* Version 7.3: volle Fraktur (UnifrakturMaguntia) für den Kopf des Winzerboten und die Urkunde, dazu Schreibschrift (Pinyon Script) für den Namen. Beide frei unter OFL, Lizenz in schrift/. */
@font-face{font-family:"Winzerbote Fraktur";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/fraktur-voll.woff2) format("woff2")}
@font-face{font-family:"Urkunde Fraktur";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/fraktur-voll.woff2) format("woff2")}
@font-face{font-family:"Urkunde Schreibschrift";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/pinyon.woff2) format("woff2")}
@font-face{font-family:"Alegreya SC";font-style:normal;font-weight:700;font-display:swap;src:url(schrift/alegreya-sc-fett.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Farben passend zu den Bildern: Weinlaub-Grün fürs Weingut, Pflaster-Ton für die Stadt, dunkles Holz für die Kellerei. --kopf ist die Leiste oben. */
:root{--bg:#c3d99e;--card:#edf5dc;--ink:#232a1a;--mut:#53613d;--wein:#7b1e3a;--kopf:#7b1e3a;--gruen:#44692a;--blau:#4a4f8f;--line:#a4bf7e;--rot:#b3261e;--gold:#a87908;
--schrift:"Alegreya",Georgia,"Times New Roman",serif;--knopf:"Alegreya SC","Alegreya",Georgia,"Times New Roman",serif;
--schild:url(bilder/schild-haupt.webp);--kschrift:#f8e6bf;--kschatten:0 1px 2px #3a0a16}
html.ort-stadt{--bg:#f2e2d2;--card:#fdf4ea;--ink:#2d2116;--line:#e3c8ae;--mut:#7a6453;--gruen:#58793a}
html.ort-keller{--bg:#2b1c12;--card:#3b281a;--ink:#f4e7d2;--mut:#bfa888;--wein:#cc607b;--kopf:#4a1526;--gruen:#9cbf74;--blau:#9aa0e0;--line:#5a4029;--rot:#f0766a;--gold:#e4b54a}
@media (prefers-color-scheme:dark){
:root{--bg:#13210d;--card:#1f2d17;--ink:#ecf0e2;--mut:#9aa68a;--wein:#c2516f;--kopf:#5c1830;--gruen:#8fb56a;--blau:#8d93d6;--line:#374b29;--rot:#ef6a60;--gold:#e0b84a}
html.ort-stadt{--bg:#1f1814;--card:#2e2520;--ink:#f1e8dc;--line:#48392f;--mut:#a89a8c}
html.ort-keller{--bg:#1a110a;--card:#2a1b11;--ink:#f1e8dc;--mut:#a89a8c;--wein:#c2516f;--kopf:#4a1526;--gruen:#8fb56a;--blau:#8d93d6;--line:#4a3422;--rot:#ef6a60;--gold:#e0b84a}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);transition:background-color .35s;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#top{position:sticky;top:0;z-index:5;background-color:#5c3a21;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 23px),linear-gradient(#6e4729,#4a2e18);border-bottom:2px solid #2b180c;box-shadow:0 3px 6px rgba(0,0,0,.3);color:#f5ebd6;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#top b{font-size:17px}#top small{opacity:.85;display:block;font-size:12px}
#top>div{background:rgba(43,24,12,.55);border:1px solid rgba(229,169,60,.4);border-radius:10px;padding:4px 10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
#top>div b{color:#f8e7bf;text-shadow:0 1px 1px #000}#top .geld b{color:#f3c766}#top .geld{cursor:pointer}#top .geld b::after,#top .wtr small::after{content:' ›';opacity:.6;font-weight:400}#top .wtr{cursor:pointer}
#top .geld{text-align:right;font-variant-numeric:tabular-nums}
main{padding:12px 16px calc(130px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h2{font:700 21px/1.2 var(--schrift);margin:6px 0 10px}h3{font:700 18px/1.25 var(--schrift);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.mut{color:var(--mut);font-size:14px}.rot{color:var(--rot)}.gruen{color:var(--gruen)}.gold{color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:15px}.kv span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* Knöpfe als gemalte Holzschilder (seit 7.1): Bild als Rahmen, die Enden (40 Pixel im Bild, 12 am Schirm) behalten ihre Form, die Mitte wird in die Breite gezogen.
   --schild ist das Bild, --kschrift die Schriftfarbe: Hauptknopf weinrot gebeizt mit Messingrand, zweiter Knopf (.sec) helles Holz mit Weinrot, gewagte Knöpfe (.wag) dunkles Holz mit roter Linie. Überall gleich, auch im Keller. */
button{font:700 17px/1.15 var(--knopf);font-variant-caps:small-caps;letter-spacing:.04em;color:var(--kschrift);text-shadow:var(--kschatten);background:none;border:0 solid transparent;border-image:var(--schild) 50% 40 fill/50% 12px stretch;padding:12px 22px;min-height:46px;cursor:pointer;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4));transition:transform .08s,filter .08s}
button:active{transform:translateY(2px);filter:drop-shadow(0 0 0 transparent) brightness(.92)}
button.sec{--schild:url(bilder/schild-zweit.webp);--kschrift:#4a1526;--kschatten:none;font-weight:700}
button.wag{--schild:url(bilder/schild-wag.webp);--kschrift:#f4e4d4;--kschatten:0 1px 2px #000}
button.klein{min-height:40px;padding:8px 16px;font-size:15px}
button:disabled{opacity:.45;filter:grayscale(.7)}
/* Alles, was kein Schild ist: Auswahlkarten, Aufgaben, Auswahl-Knöpfe, Reiter, Zettel, Zeilen im Kellerbuch. */
.wahl,.task,.chip,.zettel,.bzeile,#tabs button,#titel .weg{border-image:none;filter:none;font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;text-shadow:none;border-radius:12px;padding:12px 14px}
/* Version 4.0: Alle Karten sind Pergament, an jedem Ort gleich. Die Ortsfarbe bleibt nur im Hintergrund. */
.card,.task,.wahl,.bzeile{--ink:#2b2118;--mut:#6b5a45;--line:#d3bf93;--wein:#7b1e3a;--rot:#b3261e;--gruen:#4c7030;--blau:#4a4f8f;--gold:#946b06;--card:#f8f0dc;background:linear-gradient(#fbf5e6,#f3e7cc);color:var(--ink);border:1px solid #cdb68a;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(43,24,12,.2)}
.card h3{color:#4a1526}.card .card{box-shadow:none}
.task{border-left:5px solid #4c7030}.task.rot{border-left-color:#b3261e}.wahl.an{border-color:#7b1e3a;box-shadow:0 0 0 2px #7b1e3a inset}
main>h3{font-size:17px;margin:16px 0 8px;padding-left:10px;border-left:4px solid var(--wein)}
/* Version 4.1: Link ins Buch, Gebiets-Steckbrief, Fußnote im Büro */
.mib{display:block;width:max-content;margin:7px 0 0;font-size:13px;font-weight:700;color:#7b1e3a;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sb h3 small{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-top:2px}
.sb .sbz{margin:6px 0;font-size:14px;line-height:1.5}
.sterne{color:#a87908;letter-spacing:1px;white-space:nowrap}.sterne i{font-style:normal;opacity:.28}
.rolle{display:inline-block;padding:0 7px;border-radius:9px;font-size:12px;font-weight:700;line-height:1.5;background:rgba(123,30,58,.09);color:#4a1526;white-space:nowrap}
.sb .schild{display:inline-block;margin:2px 0 4px;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(123,30,58,.09);color:#4a1526}
.sb .schild.leicht{background:rgba(60,130,60,.14);color:#24521f}.sb .schild.riskant{background:rgba(170,40,30,.14);color:#6e1a12}
.sb .strat{margin:4px 0 0;padding-left:20px}.sb .strat li{margin:2px 0}
.sb .lohnt{margin-top:8px;padding:6px 10px;border-radius:8px;background:rgba(123,30,58,.09);font-weight:700;color:#4a1526;font-size:14px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.gchips .wahl{flex:1 1 30%;margin:0;padding:9px 4px;text-align:center;font-weight:600;font-size:14px}.gchips .gs{display:block;width:44px;height:44px;margin:0 auto 4px}
.fussnote{font-size:12px;color:var(--mut);margin:2px 4px 14px;text-align:center}
/* Version 11.2: vier Kacheln oben im Büro (Erfolge, Wissen, Familie, Einstellungen), die gewählte hat den weinroten Rand. */
.bkach{display:flex;gap:6px;margin:0 0 12px}.bkach .wahl{flex:1 1 0;min-width:0;min-height:58px;margin:0;padding:7px 0 6px;text-align:center;font-weight:600;font-size:11px;line-height:1.15;white-space:nowrap}
.bkach .wahl i{display:block;font-style:normal;font-size:20px;line-height:24px;margin-bottom:2px}.bkach .wahl.an{font-weight:700;color:#7b1e3a}
/* Seit der Optik 2.0 (10.5): schmaler Pergament-Rahmen wie beim aktiven Unterreiter, die gewählte Kachel hell mit weinroter Linie, die anderen etwas dunkler. */
.bkach .wahl{border-image:url(bilder/karte-neu.webp) 56 fill/9px stretch;filter:brightness(.86)}.bkach .wahl.an{filter:none;outline:2px solid #7b1e3a;outline-offset:-4px;border-radius:9px}
/* Das Buch: Vollbild im Papier-Stil wie der Winzerbote */
#buch{display:none;position:fixed;inset:0;z-index:40;flex-direction:column;background:#f3e7ca url(bilder/papier.jpg) center/cover;color:#2b2118;--ink:#2b2118;--mut:#6b5a45;--line:#d3bf93;--wein:#7b1e3a;--card:#fbf4e1}
#buch.an{display:flex}
#buch .bkopf,#buch .binnen,#buch .bfuss{width:100%;max-width:620px;margin:0 auto}
#buch .bkopf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid #b9995a}
#buch .bkopf b{font:26px/1.1 "Winzerbote Fraktur",Georgia,serif;color:#4a1526}
#buch .binnen{flex:1;overflow:auto;padding:14px 18px 22px;font-size:15px;line-height:1.5}
#buch .bfuss{display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #b9995a}
#buch .bfuss button{flex:1}
#buch .bnr{font:700 13px "Alegreya SC",Georgia,serif;color:#7b1e3a;letter-spacing:.5px}
#buch h2{font:700 23px/1.2 Georgia,serif;color:#4a1526;margin:2px 0 10px}
#buch .kurz{background:rgba(255,255,255,.5);border-left:4px solid #7b1e3a;border-radius:8px;padding:8px 12px;margin:0 0 12px}
#buch ul,#buch ol{margin:0 0 12px;padding-left:20px}#buch li{margin:0 0 6px}#buch li ul,#buch li ol{margin:6px 0 0}
#buch details{border-top:1px solid #b9995a;padding-top:8px;margin-top:4px}
#buch summary{font:700 17px Georgia,serif;color:#4a1526;cursor:pointer;margin-bottom:8px}
#buch h4{font:700 16px Georgia,serif;color:#4a1526;margin:14px 0 6px}
#buch .bv{color:#7b1e3a;font-weight:700;text-decoration:underline;cursor:pointer}
#buch .binh h3{font:700 15px "Alegreya SC",Georgia,serif;color:#7b1e3a;margin:16px 0 2px;letter-spacing:.5px}
#buch .binh .bz{display:flex;gap:8px;padding:9px 2px;border-bottom:1px dotted #b9995a;font:16px Georgia,serif;cursor:pointer}
#buch .binh .bz span{color:#7b1e3a;min-width:24px;font-weight:700}
.chip{background:#f8f0dc;color:#2b2118;border:1px solid #b9995a;font-weight:600}.chip.an{background:#7b1e3a;color:#fff;border-color:#591015}
h4.gk{font:700 15px/1.2 var(--schrift);margin:12px 0 4px;color:#4a1526}
/* 8.0.1 Dein Stand: Abschnitte und Rangleiter */
h4.gs{font:700 17px/1.2 var(--schrift);margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line);color:#4a1526}h3+h4.gs{border:0;padding-top:0;margin-top:2px}
.rleiter{margin:2px 0 10px}.rgl{display:flex;align-items:baseline;gap:8px;font-size:14px;line-height:1.35;padding:3px 6px;margin:0 -6px;white-space:nowrap;border-radius:8px}.rgl b{flex:none;width:20px;text-align:center;font-size:13px}.rgl span{flex:none}.rgl small{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.rgl.ok b{color:var(--gruen)}.rgl.jetzt{background:rgba(123,30,58,.12);font-weight:700;color:var(--wein)}.rgl.zu{color:var(--mut)}.rgl.zu b{opacity:.6;font-size:11px}
.pano,.mbild,.kbild{box-shadow:0 0 0 3px #5c3a21,0 0 0 4px #2b180c,0 4px 8px rgba(0,0,0,.35)}.pano,.mbild{margin-top:4px}
/* Okay als gezeichnetes Wachssiegel in Gold (Paket 7). */
.mitte{text-align:center;margin-top:10px}
button.siegel{width:84px;height:84px;min-height:0;padding:0;border-image:none;border-radius:50%;font-size:0;color:transparent;text-shadow:none;background:url(bilder/siegel.webp) center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
button.siegel:active{transform:translateY(2px) scale(.96);filter:brightness(.92)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns button{flex:1 1 auto}
/* Version 4.0: Kauf- und Verkaufsknöpfe mit dem Preis drauf, rechts in der Karte. Links steht eine kurze Erklärung.
   Fehlt das Geld, wird der Knopf grau (.arm), bleibt aber antippbar und sagt, was fehlt. */
.kz{display:flex;align-items:center;gap:10px;margin-top:10px}.kz>div:first-child{flex:1;min-width:0;font-size:14px;color:var(--mut)}
.kzk{display:flex;flex-direction:column;align-items:stretch;gap:7px;flex:none}.kz.reihe .kzk{flex-direction:row-reverse;flex-wrap:wrap;flex:0 1 auto;gap:8px}
button.pk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:122px;min-height:62px;padding:16px 23px 18px;border-image-width:50% 15px;font-size:15px}
button.pk>b{font:800 16px/1.05 var(--knopf);font-variant-caps:normal;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
button.pk>small{font:600 10.5px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;white-space:nowrap;opacity:.85}
button.pk.arm{filter:grayscale(1) opacity(.55)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--gruen)}
.bar.w i{background:var(--wein)}.bar.g i{background:var(--gold)}
.bar.stb{position:relative;overflow:visible;height:10px;margin:6px 0 10px}.bar.stb i{border-radius:6px}.bar.stb u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--wein)}
.bar.fl{position:relative}.bar.fl i{position:absolute;left:0;top:0}.bar.fl i.hell{opacity:.35}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.weiss{background:var(--gruen)}.rotw{background:var(--blau)}
.task{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gruen);margin:0 0 8px;font-weight:500;min-height:0}
.task.rot{border-left-color:var(--rot);color:var(--ink)}.task.gelb{border-left-color:#e5a93c}.task.hin{border-left-color:#b9ad93}
details.stz{margin-top:8px}details.stz summary{cursor:pointer;font-weight:700;opacity:.8;padding:6px 0}
.hilfe{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
/* Version 4.0: alle Bedienelemente unten in der Daumenzone. Oben die Unterreiter auf Pergament, darunter die Hauptleiste aus Holz. */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;filter:drop-shadow(0 -3px 6px rgba(0,0,0,.3))}
#subs{display:flex;max-width:560px;margin:0 auto;padding:4px 6px 0;gap:3px;background:linear-gradient(#efe2c4,#e2d1b3);border-top:2px solid #5c3a21;border-radius:14px 14px 0 0}
#subs button{position:relative;flex:1;min-width:0;min-height:48px;padding:4px 1px 5px;border:0;border-image:none;border-radius:10px 10px 0 0;background:none;color:#6b5236;font:600 10.5px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;text-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background-color .2s,color .2s}
#subs button>i{font-style:normal;font-size:19px;line-height:22px;transition:transform .2s}#subs button>i img{height:20px;vertical-align:-3px}
#subs button>b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#subs button.an{background:#f8f0dc;color:#7b1e3a;box-shadow:inset 0 -3px 0 #8b1e24}#subs button.an>i{transform:scale(1.18) translateY(-1px)}#subs button.an>b{font-weight:800}
#tabs{display:flex;align-items:stretch;padding:4px 4px env(safe-area-inset-bottom);background-color:#5c3a21;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 23px),linear-gradient(#6e4729,#4a2e18);border-top:2px solid #2b180c}
#tabs button{position:relative;flex:1;background:none;color:#ead6ae;border-radius:10px;padding:6px 2px;margin:2px 2px 4px;font-size:11.5px;font-weight:600;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 1px 1px #000;transition:background-color .2s,transform .2s}

/* Version 9.0: Aufstiegs-Szene "Dein Weingut wächst" vor der Feier. Sommerbild der alten Stufe, der Rangtitel wechselt, das Sommerbild der neuen Stufe blendet über (Sommer-Regel). */
#feier .wbild{position:fixed;inset:0;background:#000 50% 50%/100% auto no-repeat}
/* Kamerafahrt (Maik 18.11.2026): Beide Bilder erst weit weg und ganz zu sehen, oben und unten Schwarz. Das alte blendet ins neue über,
   das neue wächst langsam zum Vollbild (Zoom zur rechten Seite) schwenkt zügig ganz nach links ans Ende des Bilds und zurück zur Mitte, dort bleibt es bis zum Knopf Zur Feier. --wr ist das Seitenverhältnis. */
#feier .walt{animation:sw-ein 1.2s ease-out both,wzoom 4s ease-out both}
#feier .wneu{opacity:0;transition:opacity 1.8s ease}
#feier.wachs.neu .wneu{opacity:1;animation:wfahrt var(--wfd,17s) 1.4s both}
@keyframes wzoom{from{transform:scale(.96)}to{transform:none}}
/* Getrennte Abläufe je Aufstieg (Maik 18.11.2026):
   wtor   = Torblick zu Torblick (Stufe 2 bis 4): beide Bilder füllen den Schirm, Blick durch den Torbogen, kein Zoom und kein Schwenk, nur Überblenden.
   wwende = Torblick zu Schrägblick (Stufe 5): vom Torbogen langsam rauszoomen, überblenden, dann reinzoomen, nach rechts, nach links und zur Mitte schwenken.
   ohne   = Schrägblick zu Schrägblick (Stufe 6 bis 10): Kamerafahrt wie oben (wfahrt). */
#feier.wlang .wneu{transition:opacity 3.6s ease}#feier.wachs.wlang.neu .wneu{animation-delay:2.6s}   /* Stufe 6 bis 10: längere Überblendung (Maik 18.11.2026) */

#feier.wwende .walt{animation:sw-ein 1.2s ease-out both,wraus 3.2s ease-in-out .5s both}

  80%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:0% 50%;animation-timing-function:ease-in-out}
  100%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:50% 50%}}
@keyframes wfahrt{0%{background-size:100% auto;background-position:50% 50%;animation-timing-function:cubic-bezier(.45,0,.35,1)}
  26%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:100% 50%;animation-timing-function:cubic-bezier(.4,0,.3,1)}
  77%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:0% 50%;animation-timing-function:cubic-bezier(.45,0,.3,1)}
  100%{background-size:max(100vw,calc(100vh*var(--wr,1.78))) auto;background-position:50% 50%}}

.card.rneu{border:2px solid #c9a227;box-shadow:0 0 0 1px rgba(201,162,39,.35),0 0 16px rgba(240,199,90,.45)}
.rneuB{display:inline-block;background:#c9a227;color:#2a1c10;font:700 11px/1.5 var(--knopf);letter-spacing:1px;text-transform:uppercase;border-radius:4px;padding:0 6px;vertical-align:2px}
.uwand{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* Version 8.2: Spenden. Runde Schilder aus Holz, Kupfer, Bronze und Silber, Messingtafel der Bank, Holzbogen mit Namenstafel. */
.spschild,.spmini{--m1:#c89a62;--m2:#8b5a2b;--m3:#5b3716;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--m1),var(--m2) 62%,var(--m3));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#2b1a0c;font-family:var(--schrift);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.spschild{position:relative;width:min(200px,58vw);aspect-ratio:1;margin:8px auto;box-shadow:inset 0 0 0 6px rgba(0,0,0,.18),inset 0 0 0 9px rgba(255,255,255,.2),0 6px 14px rgba(0,0,0,.45)}
.spschild small{font-size:12px;font-style:italic;opacity:.85}
.spschild b{font:400 clamp(20px,6vw,27px)/1.1 "Urkunde Fraktur",var(--schrift);margin:4px 12px}
.spschild i{font-style:normal;font-size:13px;opacity:.8}
.spschild.neu{animation:urkein .7s cubic-bezier(.2,.9,.3,1.1) .15s both}
.spmini{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1;width:78%;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--m1),var(--m2) 62%,var(--m3));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#2b1a0c;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),0 2px 5px rgba(0,0,0,.35)}
.uwand.spw{grid-template-columns:repeat(3,minmax(0,1fr))}.spw b{overflow-wrap:normal;hyphens:manual}.spw .umini b{font-size:10.5px}
.spmini b{font:700 10.5px/1.1 var(--schrift);padding:0 4px}.spmini small{font:400 9.5px/1.2 var(--schrift)}
.m-kupfer{--m1:#f2b38a;--m2:#b86a3c;--m3:#7a3e1c}.m-bronze{--m1:#ecd096;--m2:#a8793a;--m3:#6e4a1e}.m-silber{--m1:#ffffff;--m2:#b9bec4;--m3:#7c838b}
.spehre{margin:10px 0}.spbringt{display:grid;gap:4px;margin:8px 0 14px;font-size:15px}
.spmessing{margin:6px auto 10px;max-width:280px;padding:8px 12px;border-radius:6px;background:linear-gradient(135deg,#f6e3a1,#c9a14a 50%,#f1d98c);color:#3a2a0e;text-align:center;font:italic 14px/1.3 var(--schrift);box-shadow:inset 0 0 0 1px rgba(90,60,10,.5),0 2px 4px rgba(0,0,0,.3)}
.spbogen{height:200px;border-radius:12px;background:var(--line) center/cover no-repeat;margin:4px 0 8px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.spspruch{text-align:center;font:400 19px/1.2 "Urkunde Fraktur",var(--schrift);color:#7b1e3a;margin:4px 0 8px}.spspruch.hell{color:#f0c75a;margin-top:12px}
.sptafel{margin:6px 0 12px;padding:12px 14px;border-radius:8px;background:#5b3a1e url(bilder/brett-dunkel.jpg) center/cover;color:#f3e3c3;font:15px/1.4 var(--schrift);text-align:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),0 3px 8px rgba(0,0,0,.4);text-shadow:0 1px 1px rgba(0,0,0,.6)}
.sptafel b{display:block;font:700 20px/1.2 "Alegreya SC",var(--schrift);letter-spacing:.05em;background:linear-gradient(#fff1b8,#f2c75a 55%,#c8922c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.85)) drop-shadow(0 -1px 0 rgba(255,230,170,.25))}
.sptafel .ranke{color:#e8bd55;font-size:16px;vertical-align:2px;margin:0 5px;text-shadow:0 1px 1px #000;display:inline-block}.sptafel .ranke.r{transform:scaleX(-1)}
.sptafel .linie{height:1px;margin:6px auto 8px;width:70%;background:linear-gradient(90deg,transparent,#e8bd55,transparent)}
.sptafel .grolle{font-family:"Alegreya SC",var(--schrift);letter-spacing:.04em;color:#e8cf8f}
@media (prefers-reduced-motion:reduce){.spschild.neu{animation:none}}
.umini{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:1000/670;background:url(bilder/urkunde.webp) center/100% 100% no-repeat;border:3px solid #6b4a24;border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 0 0 1px #c9a227;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5a1426;text-align:center;padding:0 12%}
.umini b{font:700 11.5px/1.1 var(--schrift)}
.umini small{font:400 9.5px/1.2 var(--schrift);color:#6e5638}
/* Version 9.0: Fenster "Mein Weingut" im Büro. Ein großes Sommerbild, darunter die 10 Knöpfe der Stufen. Die nächste Stufe steht dunkel mit Schloss da. */
.wgbild{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#2a2018;margin:0 0 10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.wgbild .wgl{position:absolute;inset:0;background:#2a2018 center/cover no-repeat}
.wgbild .wgsch{position:absolute;inset:0;display:none;background:var(--wgz) center/cover no-repeat;filter:brightness(.1) grayscale(1) blur(1px);opacity:.9}
.wgbild.zu{background:radial-gradient(#3a3026,#14100c)}.wgbild.zu .wgl{display:none}.wgbild.zu .wgsch{display:block}
.wgbild .wgtxt{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;text-shadow:0 1px 3px #000;font-size:13px;pointer-events:none}
.wgbild .wgtxt b{display:block;font:700 17px/1.2 var(--schrift)}
.wgbild.zu .wgtxt{top:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:none;text-align:center;padding:0}
.wgbild.zu .wgtxt i{font-style:normal;font-size:30px;margin-bottom:2px}
.wgregler{margin:0 0 8px}.wgregler b{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:2px}
.wgst{display:flex;gap:3px;align-items:center}.wgst button{flex:0 0 calc((100% - 27px)/10);min-width:0;min-height:0;padding:8px 0;font-size:13px}.wgst button:disabled{opacity:.35}
.wgrest{margin-left:6px;white-space:nowrap}.wgnx{margin-top:8px}
@media (prefers-reduced-motion:reduce){#feier .fbild,#feier .ischw,#feier .konf,.urk.neu,.urk.neu .usiegel,#feier .fliste>div,#feier .fkarte,#info .zsonder.stempeln{animation:none}#feier .ischw{opacity:0}#feier.aus .ischw{opacity:1}#feier .konf{display:none}}

#info .zrolle.oben{z-index:3;pointer-events:auto;cursor:pointer}

@media (prefers-reduced-motion:reduce){#info .ibild,#info .ischw,.schnitt{animation:none}#info .ischw,.schnitt{opacity:0}#info.aus .ischw{opacity:1}}
@keyframes ein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes puls{50%{opacity:.45}}
/* Die Urkunde auf der Korkwand aus 8.1 (.wand) gibt es nicht mehr: Seit den Stationen steht ihr Text direkt auf der Anschlagtafel (.tafel bei .pano). */
@media (prefers-color-scheme:dark){.pano,.mbild,.sbild{filter:brightness(.85)}}
@media (prefers-reduced-motion:reduce){.pano *,.ehrung,#titel .tipp{animation:none;transition:none}}
/* ===== Version 7.1 "Optik": Papier auf Holztisch (Maiks Wahl 16.11.2026) =====
   Hinter den Karten liegt Holz je Ort, leicht abgedunkelt: Weingut hell, Stadt honigbraun, Kellerei dunkel. Die Karten sind Papier mit einer Holzlinie.
   Kopfleiste und Hauptreiter dunkles Brett, Unterreiter honigbraun mit heller Schrift, ums Hauptbild der Bilderrahmen 1.0. Steht am Ende, damit es auch im dunklen Modus gilt. */
:root{--holz:url(bilder/brett-hell.jpg);--dunkel:.2;--kopf:#3d2719}
html.ort-stadt{--holz:url(bilder/brett-honig.jpg);--dunkel:.22}
html.ort-keller{--holz:url(bilder/brett-dunkel.jpg);--dunkel:.05;--kopf:#3d2719}
html{background:linear-gradient(rgba(20,10,4,var(--dunkel)),rgba(20,10,4,var(--dunkel))),var(--holz) 0 0/100% auto repeat #4a2e18}
body{background:none}
/* Schrift direkt auf dem Holz: hell mit Schatten */
main>h2,main>h3{color:#fbf0d8;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6)}
main>h3{border-left-color:#e8c98a}
.fussnote{color:#f3e6cc;text-shadow:0 1px 2px #000}
/* Kopfleiste und Hauptreiter aus dem dunklen Brett */
#top{background:url(bilder/brett-dunkel.jpg) center/cover;border-bottom:2px solid #1e1008}
#top>div{background:rgba(30,15,6,.5)}
#tabs{background:url(bilder/brett-dunkel.jpg) center/cover;border-top:2px solid #1e1008}
/* Unterreiter aus dem honigbraunen Brett, helle Schrift, der aktive Reiter weinrot auf hellem Grund */
#subs{background:url(bilder/brett-honig.jpg) center/cover;border-top:2px solid #3a2414}
#subs button{color:#fff3dc;text-shadow:0 1px 2px #1e0e04,0 0 5px rgba(30,14,4,.75)}
#subs button.an{background:rgba(255,248,232,.92);color:#7b1e3a;text-shadow:none}
/* Karten: zarter Papierton, Holzlinie, die graue Kleinschrift etwas dunkler */
.card,.wahl,.task,.bzeile{--mut:#4e3d2a;background:#f3e7ca url(bilder/papier.jpg) center/cover;box-shadow:0 3px 8px rgba(20,10,4,.45)}
.card,.wahl,.bzeile{border:2px solid #9a6a35;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 3px 8px rgba(20,10,4,.45)}
.task{border-top:2px solid #9a6a35;border-right:2px solid #9a6a35;border-bottom:2px solid #9a6a35;border-radius:10px}
.card .card,.card .wahl,.card .bzeile{box-shadow:none}
.wahl.an{border-color:#7b1e3a;box-shadow:0 0 0 2px #7b1e3a inset}
/* Was sonst direkt auf dem Holz liegt, wird auch Papier: Hinweise, Ehrungen und die Auswahl-Knöpfe */
main>.hilfe,main>.ehrung{--ink:#2b2118;--mut:#4e3d2a;--gold:#946b06;color:#2b2118;background:#f3e7ca url(bilder/papier.jpg) center/cover;border:2px solid #9a6a35;border-radius:10px;box-shadow:0 3px 8px rgba(20,10,4,.45)}
main>.ehrung{border-color:#a87908}
.chip{background:#f8f0dc;color:#2b2118;border:1px solid #9a6a35}.chip.an{background:#7b1e3a;color:#fff;border-color:#591015}
/* Bilderrahmen 1.0 ums Hauptbild: eckig, das gemalte Holz liegt als Rahmenbild obenauf */
.pano{border-radius:0;box-shadow:0 4px 10px rgba(0,0,0,.45)}
.pano::after{content:"";position:absolute;inset:0;pointer-events:none;border:13px solid transparent;border-image:url(bilder/rahmen.webp) 39/13px stretch}
.pano .ptitel{padding-bottom:17px}
/* ===== Version 7.4 "Übersicht": ein Baustein für alle Fenster (fenster und fz im Code) =====
   Kopf mit der Überschrift in Schrift und Farbe des Hauptreiters und dem kleinen grauen i oben rechts, darunter Hinweise, Zustand und Zeilen, die Knöpfe unten rechts. */
:root{--ftitel:#7b1e3a;--fgrau:#857560}
.fen{padding:0;overflow:hidden}
.fkopf{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 3px 0 14px;background:rgba(123,30,58,.08);border-bottom:1px solid rgba(154,106,53,.5)}
.fkopf h3{flex:1;min-width:0;margin:0;padding:9px 0 8px;font:700 19px/1.15 var(--knopf);font-variant-caps:small-caps;letter-spacing:.04em;color:var(--ftitel)}
.fkopf h3 small{display:block;margin-top:1px;font:400 13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;color:var(--mut)}
button.fi{flex:none;display:grid;place-items:center;width:44px;height:44px;min-height:0;padding:0;border:0;border-image:none;background:none;filter:none;text-shadow:none;letter-spacing:0;font-variant-caps:normal}
button.fi>i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--fgrau);color:var(--fgrau);font:italic 700 15px/21px Georgia,"Times New Roman",serif;text-align:center}
button.fi.an>i{background:var(--fgrau);color:#fbf5e6}
button.fi.wort{width:auto;padding:0 11px;font:600 13px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fgrau);text-decoration:underline dotted;text-underline-offset:3px}
.finfo{padding:9px 14px 10px;font-size:14px;color:var(--mut);background:rgba(255,255,255,.42);border-bottom:1px solid rgba(154,106,53,.5)}
.fin{padding:10px 14px 12px}
.fin>.hilfe{margin:0 0 9px}.fin>.fstand{margin:0 0 9px;font-size:14px;color:var(--mut)}.fleer{font-size:14px;color:var(--mut)}
.fz{padding:9px 0;border-top:1px solid rgba(154,106,53,.38)}.fz:first-child{border-top:0;padding-top:0}.fz:last-child{padding-bottom:0}
.fz .kz{margin-top:5px;min-height:40px}.fz .kz button{white-space:nowrap}
.fen.zu{opacity:.88}.fen.zu .fkopf{background:none;border-bottom:0}.fen.zu h3{color:var(--mut)}.fen.zu .finfo{border-top:1px solid rgba(154,106,53,.5);border-bottom:0}
/* Antippbare Zeilen im Fenster (Kellerbuch, Großhandel, Regal): wie .fz mit Trennlinie, ohne eigene Karte. .ab setzt die Liste vom Zustand darüber ab. */
.fzl.ab{margin-top:8px;padding-top:9px;border-top:1px solid rgba(154,106,53,.38)}
.fzl>.bzeile{background:none;border:0;border-top:1px solid rgba(154,106,53,.38);border-radius:0;box-shadow:none;margin:0;padding:9px 0}
.fzl>.bzeile:first-child{border-top:0;padding-top:0}.fzl>.bzeile:last-child{padding-bottom:0}
.finfo .kv{font-size:14px;padding:2px 0}.kv.lang span:first-child{flex:none}
/* Block B: Aufgaben, Manager-Zeilen und Bilder im Fenster, der aufgeklappte Steckbrief. */
.fin>.task:last-of-type,.fin>.wahl:last-of-type{margin-bottom:0}.fin .task,.fin .wahl{box-shadow:none}
.fin>.kbild{margin:0 0 10px}.fklapp{margin-top:8px;padding-top:8px;border-top:1px solid rgba(154,106,53,.38)}
/* Version 8.1: Spielführer, Sprechblase nach Entwurf D (Maik 17.11.2026). Maße und Farben aus _entwurf_blase.html.
   Ebene 15: über Kopfleiste und Reitern, unter Dialogen (20), Titel (30) und Buch (40). Abgedunkelt wird nur bei langen Tipps. */
#fdunkel{position:fixed;inset:0;z-index:14;background:rgba(15,9,4,.55)}
#fuehrer{position:fixed;left:10px;right:10px;top:172px;z-index:15;max-width:540px;margin:0 auto;box-sizing:border-box;
  border:2.5px solid #d2a94a;border-radius:18px;background:linear-gradient(rgba(255,251,236,.42),rgba(255,251,236,.42)),#f3e7ca url(bilder/papier.jpg) center/cover;
  box-shadow:0 0 0 1.5px #5d3f18,inset 0 0 0 1px rgba(255,255,255,.55),0 10px 26px rgba(20,10,4,.75);color:#2b2118;padding:14px 16px 16px;
  font:18px/1.38 var(--schrift);animation:fplopp .28s cubic-bezier(.3,1.5,.5,1)}
@keyframes fplopp{from{transform:scale(.8) translateY(-12px);opacity:0}to{transform:none;opacity:1}}
#fuehrer .fgesicht{position:absolute;right:8px;top:-104px;width:92px;height:92px;border-radius:50%;border:3px solid #d2a94a;background:#f8f0dc;overflow:hidden;box-shadow:0 0 0 1.5px #5d3f18,0 3px 7px rgba(0,0,0,.5)}
#fuehrer .fgesicht i{display:block;width:100%;height:100%;background:center/cover no-repeat}
#fuehrer .fkopf{position:absolute;left:12px;top:-78px;margin:0;padding:6px 12px 7px;border-radius:10px;border:2px solid #d2a94a;
  background:linear-gradient(rgba(255,251,236,.42),rgba(255,251,236,.42)),#f3e7ca url(bilder/papier.jpg) center/cover;box-shadow:0 0 0 1.5px #5d3f18,0 3px 7px rgba(0,0,0,.5)}
#fuehrer .fname{display:block;font:700 19px/1.1 "Alegreya SC",var(--schrift);color:#7b1e3a;letter-spacing:.02em}
#fuehrer .frolle{display:block;font-size:14px;color:#857560;margin-top:2px}
#fuehrer .fzipfel{position:absolute;right:40px;top:-13px;width:22px;height:22px;transform:rotate(45deg) skew(8deg,8deg);
  background:#f8efd6;border-left:2.5px solid #d2a94a;border-top:2.5px solid #d2a94a;box-shadow:-1.5px -1.5px 0 0 #5d3f18;border-top-left-radius:4px}
#fuehrer p{margin:0 0 8px}#fuehrer p:last-child{margin-bottom:0}
#fuehrer .ftext{max-height:max(200px,calc(100vh - 300px));overflow-y:auto;padding-right:6px;-webkit-overflow-scrolling:touch}
#fuehrer .fschatten{height:22px;margin-top:-22px;position:relative;pointer-events:none;background:linear-gradient(rgba(243,231,202,0),rgba(240,228,198,.96));text-align:center;font-size:12px;color:#7b1e3a;line-height:30px}
#fuehrer .fknopf{display:flex;gap:8px;margin-top:10px}
#fuehrer .fknopf button{flex:1 1 0;white-space:nowrap}
/* Seit 10.2.1: Der Winzer sitzt immer oben rechts, offen wie zusammengeklappt an derselben Stelle (Maik 19.11.2026). Dort deckt er keine Knöpfe ab. */
#fuehrer.zu{display:none}
#fkopf{position:fixed;right:max(18px,calc(50vw - 262px));top:68px;z-index:15;width:92px;height:92px;box-sizing:border-box;padding:0;border-radius:50%;border:3px solid #d2a94a;background:#f8f0dc;overflow:visible;
  box-shadow:0 0 0 1.5px #5d3f18,0 3px 8px rgba(0,0,0,.55);animation:fkopfein .35s ease-out both}
#fkopf i{display:block;width:100%;height:100%;border-radius:50%;background:center/cover no-repeat}
#fkopf b{position:absolute;right:-6px;top:-6px;font-size:18px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));animation:fkopfwink 2.4s ease-in-out infinite}
@keyframes fkopfein{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes fkopfwink{0%,80%,100%{transform:none}88%{transform:rotate(-14deg) scale(1.15)}}
#fuehrer .fbuch{display:block;margin-top:10px;font-size:15px;color:#7b1e3a;text-decoration:underline;text-align:center;cursor:pointer}
.fleuchte{animation:fleucht 1s ease-in-out 4;border-radius:12px}
@keyframes fleucht{0%,100%{box-shadow:0 0 0 0 rgba(240,199,90,0)}50%{box-shadow:0 0 0 6px rgba(240,199,90,.95),0 0 22px 8px rgba(240,199,90,.7)}}
/* ===== Weinkompendium (seit 11.1): Siegel in Bronze, Silber und Gold, Einträge, Siegel-Meldung ===== */
.ksg{display:inline-block;flex:none;width:16px;height:16px;margin-left:3px;border-radius:50%;border:1.5px dashed #a8946c;box-sizing:border-box;vertical-align:-3px}
.ksg.an{border:1px solid rgba(0,0,0,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 1px 1px rgba(0,0,0,.3)}
.ksg.s1.an{background:radial-gradient(circle at 35% 30%,#e3ad7e,#a5652f 60%,#74401a)}
.ksg.s2.an{background:radial-gradient(circle at 35% 30%,#f6f6f6,#b9bcc2 60%,#7f838a)}
.ksg.s3.an{background:radial-gradient(circle at 35% 30%,#ffeaa6,#e5a93c 60%,#a87908)}
.ksg3{white-space:nowrap}
.kchips{flex-wrap:wrap;margin-top:10px}
.bzeile.kzu{border-style:dashed;background:none}.bzeile.kzu .bz1 b{color:var(--mut)}.bzeile.ksch{cursor:default}
.kalbum{margin-top:10px;text-align:center}
.kspiel{margin:8px 0 10px}.bzeile .bz1 .kpf{font-weight:400;color:var(--mut)}
.kbed{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.kbed .ksg{width:26px;height:26px;margin:2px 0 0}.kbed>div{flex:1}.kbed b{display:block}.kbed span{font-size:14px;color:var(--mut)}.kbed .bar{margin:6px 0 0}
#ksiegel{position:fixed;left:50%;bottom:calc(138px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(92vw,520px);padding:9px 16px 9px 12px;border-radius:14px;border:1px solid #b9995a;background:#f3e7ca url(bilder/papier.jpg) center/cover;color:#2b2118;box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:15px;line-height:1.3;cursor:pointer;opacity:0;pointer-events:none;transform:translate(-50%,24px);transition:opacity .3s,transform .3s}
#ksiegel.an{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#ksiegel.oben{bottom:auto;top:calc(14px + env(safe-area-inset-top))}
/* ===== Weinarchiv (seit 11.8): Siegelbrett in Zeilen (B), Ruf des Hauses mit sieben Marken (R1), Lexikon mit "Neu" (L1), Siegel an den Weinen (D1) ===== */
.fzl>.bzeile.sz{padding:9px 0}.fzl>.bzeile.sz:first-child{padding-top:0}
.sz .bz1{align-items:center}.sz .bz1 b{font-size:16px;line-height:1.2}.sz.leer .bz1 b{color:var(--mut)}
.sz .ksg3{flex:none}.sz .ksg3 .ksg{width:21px;height:21px;margin:0 0 0 4px}
.sz .bz2{font-size:13px;margin:2px 0 4px}.sz .bar{height:6px;margin:0}
.sz.gold .bz2{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#7a5a06;font-weight:700}
.getik{display:inline-block;padding:1px 9px;border:1px solid #a87908;border-radius:4px;background:linear-gradient(#ffeaa6,#e5a93c);color:#2b180c;font:700 12px/18px var(--knopf);box-shadow:inset 0 0 0 2px rgba(255,248,225,.55);white-space:nowrap}
.getik.bb{border-radius:50%/60%;padding:1px 12px}
.bar.g.stb u{background:#5c3a21}.fin>.fstand.ruf{margin:2px 0 0;font-size:13.5px}
.bz3.dws{display:flex;justify-content:space-between;align-items:center}.ksg3.klein .ksg{width:13px;height:13px;margin:0 0 0 3px}
.lneu{display:inline-block;margin-left:7px;padding:0 6px;border-radius:8px;background:#e5a93c;color:#2b180c;font-size:11px;font-weight:800;line-height:17px;vertical-align:2px}
.lpunkt{display:inline-block;width:8px;height:8px;margin-left:5px;border-radius:50%;background:#e5a93c;vertical-align:1px}
.bkach .wahl .lneu{margin-left:4px;font-size:10px;line-height:14px;padding:0 4px}
#ksiegel .ksg{width:30px;height:30px;margin:0}#ksiegel b{display:block}#ksiegel small{display:block;font-size:13px;color:#6b5a45}

.fkopf{background:none;border-bottom:1px solid rgba(120,70,30,.45)}

.ptitel{background:linear-gradient(transparent,rgba(20,8,2,.82))}

.fin>.kv{font-family:var(--schrift);font-size:16px;font-variant-numeric:lining-nums tabular-nums;padding:4px 0;border-bottom:1px solid rgba(120,80,40,.2)}

#tabs #weiter{flex:1.5;flex-direction:column;gap:2px;margin:2px 2px 4px;min-height:56px;padding:6px 2px;border-image:url(bilder/knopf-aktiv.webp) 48 fill/11px stretch;color:#7b1e3a;text-shadow:none;font:800 11.5px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;white-space:nowrap;filter:none;transform:translateY(-3px)}

#subs button.an{background:none;box-shadow:none;border:0 solid transparent;border-image:url(bilder/karte-neu.webp) 56 fill/9px stretch;border-radius:0}

<script>
'use strict';
/* ================= Daten ================= */
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const SORTEN={
  riesling:{name:'Riesling',farbe:'weiss',ertrag:4,zucker:0,preis:6,minL:18,maxL:360,q:10,reife:.12,sektStar:true},
  mueller:{name:'Müller-Thurgau',farbe:'weiss',ertrag:5.6,zucker:-4,preis:3,minL:6,maxL:96,q:3,reife:.05},
  silvaner:{name:'Silvaner',farbe:'weiss',ertrag:5,zucker:-2,preis:4,minL:6,maxL:120,q:5,reife:.07},
  spaetb:{name:'Spätburgunder',farbe:'rot',ertrag:3.8,zucker:2,preis:5.5,minL:12,maxL:180,q:8,reife:.10,sektStar:true},
  portug:{name:'Portugieser',farbe:'rot',ertrag:6,zucker:-5,preis:2.8,minL:3,maxL:48,q:2,reife:.04},
  troll:{name:'Trollinger',farbe:'rot',ertrag:5.6,zucker:-3,preis:3.2,minL:6,maxL:60,q:3,reife:.05}
};
// Version 11.4: Rebsorten in drei Rollen, nur in neuen Partien (S.rollen). Jedes Gebiet hat eine Menge-Sorte (ab Start), eine Sekt-Sorte (ab R_SORTE2)
// und eine Spitzen-Sorte (ab R_SORTE3). Die Sorten einer Rolle haben dieselben Werte und unterscheiden sich nur in Name und Farbe,
// gemessen werden also drei Profile statt 15 Sorten. Menge startet mit den Werten des alten Müller-Thurgau, Spitze mit denen des alten Rieslings,
// die Sekt-Sorte liegt dazwischen und ist als einzige Sekt-Star. Die sechs alten Sorten oben bleiben für Spielstände von vor 11.4 unberührt.
const ROLLEN={
  menge:{name:'Menge-Sorte',satz:'trägt viel und ist früh verkaufsreif',ertrag:5.6,zucker:-4,preis:3,minL:6,maxL:96,q:3,reife:.05},
  sekt:{name:'Sekt-Sorte',satz:'gibt den Regional-Sekt',ertrag:4.8,zucker:-2,preis:4.5,minL:9,maxL:144,q:6,reife:.08,sektStar:true},
  spitze:{name:'Spitzen-Sorte',satz:'trägt wenig, bringt die beste Qualität und reift lange',ertrag:4,zucker:0,preis:6,minL:18,maxL:360,q:10,reife:.12}
};
// 17 neue Kennungen für 15 Namen (Riesling und Silvaner gibt es in zwei Rollen). Kennungen nie umbenennen, sie stehen in Spielständen und ab 11.4 im Album.
const SORTEN_ROLLEN={
  me_mueller:['menge','Müller-Thurgau','weiss'],me_weissb:['menge','Weißburgunder','weiss'],me_silvaner:['menge','Silvaner','weiss'],me_dornf:['menge','Dornfelder','rot'],me_troll:['menge','Trollinger','rot'],
  se_elbling:['sekt','Elbling','weiss'],se_riesling:['sekt','Riesling','weiss'],se_graub:['sekt','Grauburgunder','weiss'],se_chard:['sekt','Chardonnay','weiss'],se_bacchus:['sekt','Bacchus','weiss'],se_schwarzr:['sekt','Schwarzriesling','rot'],
  sp_riesling:['spitze','Riesling','weiss'],sp_spaetb:['spitze','Spätburgunder','rot'],sp_scheu:['spitze','Scheurebe','weiss'],sp_gewuerz:['spitze','Gewürztraminer','weiss'],sp_silvaner:['spitze','Silvaner','weiss'],sp_lemb:['spitze','Lemberger','rot']
};
for(const [id,[rolle,name,farbe]] of Object.entries(SORTEN_ROLLEN)){const P=ROLLEN[rolle]; SORTEN[id]={name,farbe,rolle,ertrag:P.ertrag,zucker:P.zucker,preis:P.preis,minL:P.minL,maxL:P.maxL,q:P.q,reife:P.reife,...(P.sektStar?{sektStar:true}:{})}}
// Schalter für die Messung: 1 = neue Partien bekommen die Rollen. Mit 0 startet auch ein neues Spiel mit den alten Sorten (Lauf s114_alt).
const ROLLEN_NEU=1;
// Hürden in zwei Stufen: vier Gebiete mit normalen Mindestwerten, Franken und Württemberg mit niedrigeren.
// Die beiden sind dafür 10° kühler (warm), unter dem Strich also 3° hinter Mosel und Rheingau. Seit 7.0 (Schritt H) -10 statt -11:
// Mit -11 schaffte der Test-Spieler in Franken den Präsidenten nur in 4 von 9 Partien, mit -10 in 9 von 9 (Mitte Jahr 116). Sie bleiben die riskanten Gebiete.
const MIN_NORMAL={tafel:50,qba:60,kab:75,spat:85,aus:95,ba:125,tba:150}, MIN_KUEHL={tafel:45,qba:53,kab:68,spat:78,aus:88,ba:118,tba:150};
// Boni je Gebiet, ohne Eintrag gilt 1 oder 0: preisF (Faktor auf jeden Preis), wettPlus (Punkte bei Wettbewerben),
// seit 6.0 (Schritt 3) ertragF (Faktor auf die Lese-Menge) und sektPreisF (Faktor auf den Sekt-Preis). Steckbrief und Gegner rechnen sie mit (regionF).
const REGIONEN={
  mosel:{name:'Mosel',sorten:['riesling','mueller','spaetb'],warm:0,edelSpatF:.5,frost:.25,wettPlus:3,text:'Steile Schieferhänge, Riesling-Land. Steillagen-Ruf: Bei Wettbewerben zählt jeder Wein 3 Punkte mehr. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  rheingau:{name:'Rheingau',sorten:['riesling','spaetb','silvaner'],warm:0,edelSpatF:.5,frost:.25,preisF:1.1,text:'Berühmtes Riesling-Land: Jeder Wein bringt 10 % mehr Geld. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  rheinhessen:{name:'Rheinhessen',sorten:['mueller','silvaner','portug'],warm:3,edelF:1.1,frost:.12,text:'Warmes Silvaner-Land: mehr Zucker und öfter Edelfäulnis, dafür selten Frost für Eiswein. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  pfalz:{name:'Pfalz',sorten:['riesling','mueller','portug'],warm:3,edelF:1.1,frost:.10,text:'Warm mit milden Wintern: mehr Zucker und öfter Edelfäulnis, dafür kaum Frost für Eiswein. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  franken:{name:'Franken',sorten:['silvaner','mueller','spaetb'],warm:-10,edelAus:true,frost:.45,text:'Kühle Silvaner-Heimat mit kalten Wintern, Eiswein-Land. Weniger Zucker, niedrigere Hürden, Auslese ab 88°.',min:MIN_KUEHL},
  wuerttemberg:{name:'Württemberg',sorten:['troll','riesling','spaetb'],warm:-10,edelAus:true,frost:.43,text:'Kühles Rotwein-Land mit Trollinger und kalten Wintern, Eiswein-Land. Weniger Zucker, niedrigere Hürden, Auslese ab 88°.',min:MIN_KUEHL}
};
// Version 7.0 (Schritt I): Texte für den Steckbrief. stufe aus den Messungen von Schritt H (Präsident auf Mittel in der Mitte: Rheinhessen und Pfalz
// um Jahr 100, Rheingau und Mosel 108 bis 122, Franken und Württemberg 116 bis 117 mit großer Streuung und weniger Geld). Franken und Württemberg
// sind nach Maiks Wunsch die riskanten Eiswein-Gebiete für Könner. stil ist das Spielstil-Schild, sekt das Sekt-Potenzial (1 bis 3 Flaschen),

const GEBIET_TEXT={
  mosel:{stufe:'mittel',stil:'Gut planbar',sekt:3,lohnt:'Auf Wettbewerbe und Riesling-Auslese setzen, Sekt in kühlen Jahren',
    strat:['Riesling braucht lange im Keller, die ersten Jahre sind knapp. Federweißer bringt im Herbst schnelles Geld für den Notfall.','Gute Weine zum Wettbewerb: Der Steillagen-Ruf bringt jedem Wein 3 Punkte mehr.','Ab Winzer Sekt aus Riesling machen, er ist ein Sekt-Star.']},
  rheingau:{stufe:'mittel',stil:'Sehr verlässlich',sekt:3,lohnt:'Auf den Verkauf setzen, Riesling darf lange reifen',
    strat:['Riesling braucht lange im Keller, die ersten Jahre sind knapp. Nicht zu viel Land auf einmal kaufen.','Jeder Wein bringt 10 % mehr, lange Reife lohnt sich hier besonders.','Spätburgunder kommt schon als Jungwinzer, mit dem Riesling hast du zwei Sekt-Stars.']},
  rheinhessen:{stufe:'leicht',stil:'Kalkulierbar',sekt:1,lohnt:'Auf Edelfäulnis und große Mengen setzen',
    strat:['Silvaner bringt schon nach 6 Monaten Geld, der Start ist entspannt.','Im Herbst ruhig länger hängen lassen: mehr Zucker und öfter Edelfäulnis machen Auslese und Beerenauslese leicht.','Sekt nur nebenbei, hier wächst keine Sekt-Star-Sorte.']},
  pfalz:{stufe:'leicht',stil:'Flexibel',sekt:2,lohnt:'Auf Edelfäulnis pokern, Riesling als Sekt',
    strat:['Riesling braucht lange im Keller, die ersten Jahre sind knapp. Federweißer hilft im Herbst über die Runden.','Warm und sonnig: Edelfäulnis kommt oft, edelsüße Weine gelingen hier am leichtesten.','Eiswein gibt es fast nie, dafür verzeiht die Pfalz viele Wege.']},
  franken:{stufe:'riskant',stil:'Hohes Risiko',sekt:1,lohnt:'Auf Eiswein pokern',
    strat:['Die Hürden sind niedriger: Schon mit wenig Zucker wird aus Silvaner Kabinett und Spätlese.','Bei Edelfäulnis im Herbst ein Feld hängen lassen und auf Frost im Dezember hoffen. Eiswein bringt hier am meisten.','Für Könner: Franken bringt weniger Geld als die anderen Gebiete, jeder Fehler wiegt schwerer.']},
  wuerttemberg:{stufe:'riskant',stil:'Kalkuliertes Risiko',sekt:2,lohnt:'Auf Rotwein setzen, Eiswein nur gezielt',
    strat:['Trollinger trägt viel und ist nach 6 Monaten verkaufsreif, damit kommt am Anfang Geld rein.','Eiswein nur mit Riesling oder Spätburgunder versuchen, den Trollinger lieber rechtzeitig lesen.','Für Könner: Württemberg bringt weniger Geld als die warmen Gebiete, jeder Fehler wiegt schwerer.']}
};
// Version 11.4: Sorten nach Rollen je Gebiet (Menge, Sekt, Spitze, in dieser Reihenfolge kommen sie auch) und die zweite Fassung von lohnt und strat.
// REGIONEN_ROLLEN erbt alles andere vom Gebiet, eine umgestellte Zahl in REGIONEN gilt also für beide.
const GEBIET_ROLLEN={
  mosel:{sorten:['me_mueller','se_elbling','sp_riesling'],lohnt:'Auf Wettbewerbe und Riesling-Auslese setzen, Sekt vom Elbling',
    strat:['Müller-Thurgau trägt viel und ist nach 6 Monaten verkaufsreif, damit kommt am Anfang Geld rein.','Als Jungwinzer kommt der Elbling, ab Winzer wird daraus der Sekt der Mosel.','Der Riesling für die großen Weine kommt als Weingutsbesitzer. Bei Wettbewerben bringt der Steillagen-Ruf jedem Wein 3 Punkte mehr.']},
  rheingau:{sorten:['me_weissb','se_riesling','sp_spaetb'],lohnt:'Auf den Verkauf setzen, Spätburgunder darf lange reifen',

  rheinhessen:{sorten:['me_silvaner','se_graub','sp_scheu'],lohnt:'Auf Edelfäulnis und große Mengen setzen',
    strat:['Silvaner trägt viel und bringt schon nach 6 Monaten Geld, der Start ist entspannt.','Im Herbst ruhig länger hängen lassen: mehr Zucker und öfter Edelfäulnis machen Auslese und Beerenauslese leicht.','Grauburgunder gibt ab Winzer den Sekt, die Scheurebe für edelsüße Spitzenweine kommt als Weingutsbesitzer.']},
  pfalz:{sorten:['me_dornf','se_chard','sp_gewuerz'],lohnt:'Auf Edelfäulnis pokern, Chardonnay als Sekt',
    strat:['Dornfelder trägt viel und ist nach 6 Monaten verkaufsreif, damit kommt am Anfang Geld rein.','Warm und sonnig: Edelfäulnis kommt oft, edelsüße Weine gelingen hier am leichtesten. Der Gewürztraminer dafür kommt als Weingutsbesitzer.','Eiswein gibt es fast nie, dafür verzeiht die Pfalz viele Wege.']},
  franken:{sorten:['me_mueller','se_bacchus','sp_silvaner'],lohnt:'Auf Eiswein pokern',

// Musik: Beim Ortswechsel blendet das alte Stück aus und das neue ein. Jedes Stück merkt sich seine Stelle und spielt dort später weiter.
// Kurz vor dem Ende blendet ein zweiter Abspieler vom Anfang her ein, so läuft das Stück im Kreis ohne Bruch.
// Version 7.8: Musik hat drei Stellungen: 'an' (Dauermusik wie bisher), 'kurz' (Grundstellung) und 'aus'. Alte Einstellungen: an wird kurz, aus bleibt aus.
// laut und fxLaut: Lautstärke von Musik und Geräuschen in Prozent, je ein Regler (Version 7.8, vorher fest 50 und 100).
const TON={musik:'kurz',fx:true,laut:50,fxLaut:100};
try{Object.assign(TON,JSON.parse(localStorage.getItem(TON_KEY)||'{}'))}catch(e){}
if(TON.musik===true) TON.musik='kurz'; if(TON.musik===false) TON.musik='aus';

const BLENDE=1.5, KREIS=3, TAKT=50;
// Version 7.8, Stellung kurz: Beim Ortswechsel spielt das Stück KURZ Sekunden ab einer zufälligen Stelle, mit KURZ_BLENDE Sekunden Ein- und Ausblenden (Maik 17.11.2026).

const KURZ=8, KURZ_BLENDE=1;
const TOENE=['klick','menue','kasse','korken','stempel','hammer','schere','fanfare'];

let AC=null, AN=false, MORT=null, MKEY=null, SMUSIK=null, FXT=-1; const MSP={}, FXB={};

const NETZ=location.protocol!=='file:';

function tonAn(){
  if(AN) return; AN=true;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}
  setInterval(mischer,TAKT);
  if(AC&&NETZ) for(const n of TOENE) fetch('ton/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(b=>{FXB[n]=b}).catch(()=>{});
  musikStell();
}
// Startet einen Abspieler. Das Ergebnis ist false, wenn der Browser das Abspielen verweigert.
function spiel(el){try{const p=el.play(); return p&&p.catch?p.catch(()=>false):Promise.resolve()}catch(e){return Promise.resolve(false)}}
// Ein Abspieler: v ist seine Lautstärke jetzt (0 bis 1), z das Ziel, dt die Sekunden für eine volle Blende.
function stimme(name){
  const el=new Audio('ton/musik-'+MUSIK[name]+'.mp3'), s={el,g:null,v:0,z:0,dt:BLENDE};
  el.preload='auto'; el.loop=true;
  if(AC&&NETZ) try{s.g=AC.createGain(); s.g.gain.value=0; AC.createMediaElementSource(el).connect(s.g); s.g.connect(AC.destination)}catch(e){s.g=null}

function laut(s){const x=s.v*TON.laut/100; if(s.g) s.g.gain.value=x; else s.el.volume=x}
// Mischer, läuft alle TAKT ms: schiebt jede Lautstärke ein Stück auf ihr Ziel zu, hält stumme Abspieler an und blendet am Ende eines Stücks zum Anfang über.
function mischer(){
  for(const n in MSP){
    const P=MSP[n];
    for(const s of P.s) if(s){
      if(s.v!==s.z){const d=TAKT/1000/s.dt; s.v=s.z>s.v?Math.min(s.z,s.v+d):Math.max(s.z,s.v-d); laut(s)}
      if(s.v===0&&s.z===0&&!s.el.paused) s.el.pause();
    }
    const a=P.s[P.akt], el=a.el;
    if(P.ende&&performance.now()>P.ende){P.ende=0; a.z=0; a.dt=KURZ_BLENDE}
    if(n===MORT&&!P.fest&&!P.ende&&a.z===1&&el.duration&&el.currentTime>el.duration-KREIS){
      const b=P.s[1-P.akt]||(P.s[1-P.akt]=stimme(n));
      try{b.el.currentTime=0}catch(e){}
      a.z=0; b.z=1; a.dt=b.dt=KREIS; P.akt=1-P.akt;
      // Darf der zweite Abspieler nicht starten (manche iPhones), läuft der erste einfach von vorn weiter.
      spiel(b.el).then(ok=>{if(ok===false){P.fest=true; if(P.s[P.akt]===b){b.z=0; a.z=1; P.akt=1-P.akt}}});
    }
  }
}

function musikVoll(n=MORT){return !S||!!S.pleite||!!SMUSIK||TAB==='feier'||['auf','wett','pfand'].includes(n)}

// neu: Der Ort hat gewechselt. Nur dann spielt bei der Stellung kurz ein kurzes Stück, sonst bleibt es still.
function musikStell(neu){

const AUK_MONATE=[2,3,6,10], AUK_CHANCE=.22;
function auktionHa(){const r=Math.random();return r<.4?1:r<.73?2:r<.95?3:r<.995?5:10}
function neueAuktion(spitze){
  if(spitze){const B=misch(NACHBARN).slice(0,3).map(n=>({name:n,limit:rint(64,144)*5000})); S.auktion={ha:SPITZE_HA,start:SPITZE_START,schritt:10000,gebot:SPITZE_START,fuehrer:B[rint(0,2)].name,bieter:B,ende:null,text:'',phase:0,spitze:1}; return}
  const ha=auktionHa(), start=ha*8000, B=misch(NACHBARN).slice(0,rint(2,3)).map(n=>({name:n,limit:Math.round(ha*rnd(11000,30000)/500)*500}));
  for(const g of S.gegner) if(g.region===S.region){
    const t=GEGNER_TYP[g.typ];
    // Der Zufall wird immer gezogen, auch wenn der Gegner am Deckel ist und nicht mitbietet.
    const lim=Math.round(Math.min(g.geld+(g.typ==='zocker'?30000:0),ha*rnd(14000,26000)*(1+t.biet*bietF()*.6))/500)*500;
    if(g.ha+ha<=gegnerDeckel(g)) B.push({name:g.name,ki:g.id,limit:lim});
  }
  const offen=B.filter(b=>b.limit>=start);
  S.auktion={ha,start,schritt:Math.max(500,Math.round(start*.1/500)*500),gebot:start,fuehrer:offen.length?offen[rint(0,offen.length-1)].name:null,bieter:B,ende:null,text:'',phase:0};
}
function aukNaechstes(){const a=S.auktion;return a.fuehrer?a.gebot+a.schritt:a.gebot}
function aukLimit(){return S.geld+rahmen()-(S.kredit?S.kredit.rest:0)}
// Der Spieler ist raus oder hat die Auktion verpasst: Die anderen machen es unter sich aus.
function aukOhneDich(){
  const a=S.auktion, B=a.bieter.filter(b=>b.limit>=a.gebot).sort((x,y)=>y.limit-x.limit);
  if(!B.length){a.ende='niemand'; return a.text=`Für den Weinberg mit ${a.ha}\u00a0Hektar ${WO[S.region]} fand sich kein Bieter.`}
  const sieger=B[0], pr=B[1]?Math.max(a.gebot,Math.min(sieger.limit,B[1].limit+a.schritt)):a.gebot;
  a.ende=sieger.name; a.gebot=pr;
  if(sieger.ki!=null){const g=S.gegner[sieger.ki]; g.geld-=pr; g.ha+=a.ha; g.ansehen+=2*(3+Math.min(a.ha,7))*DIFF[S.schwer].ki}
  return a.text=`${sieger.name} bekommt den Zuschlag: ${a.ha}\u00a0Hektar ${WO[S.region]} für ${eur(pr)}.`;
}
// Seit 7.9 für das Rathaus: Wann kann frühestens wieder geboten werden, und wann ist der nächste Wettbewerb?
// Geboten wird im Monat nach der Ankündigung. Steht für diesen Monat nichts an, zählt erst die nächste Ankündigung.
function aukNaechst(){const m=AUK_MONATE.find(m=>m>S.monat); return m==null?`${MON[(AUK_MONATE[0]+1)%12]} ${S.jahr+1}`:`${MON[(m+1)%12]} ${S.jahr+(m===11?1:0)}`}
function wettNaechst(typ){
  if(typ==='land') return `Februar ${S.monat<1?S.jahr:S.jahr+1}`;
  if(typ==='welt') return `August ${S.monat<WELT_MONAT?S.jahr:S.jahr+1}`;
  let j=S.jahr+(S.monat>=5?1:0); while(j%3) j++; return `Juni ${j}`;
}
// Phase 0: angekündigt, nächsten Monat wird geboten. Text für "Das steht an", leer wenn nichts ansteht.
function aukInfo(){const a=S.auktion; return a&&a.phase===0&&S.rang>=R_AUKTION?`🔨 Nächsten Monat Auktion: ${a.ha}\u00a0Hektar, Start bei ${eur(a.start)}${aukDeckel(a)?', für deinen Rang zu groß':''}`:''}
// Ergebnis für den Fuß der Zeitung, im Monat nach dem Bieten.
function aukErgebnis(){
  const a=S.auktion; if(!a.ende) aukOhneDich();
  if(a.ende==='niemand') return `Für den Weinberg mit ${a.ha}\u00a0Hektar ${WO[S.region]} fand sich kein Bieter.`;
  return `Auktion ${WO[S.region]}: ${a.ende==='du'?S.name:a.ende} bekommt ${a.ha}\u00a0Hektar für ${eur(a.gebot)}.`;
}

/* ================= Ereignisse ================= */
// Rund zwei im Jahr, halb gut, halb schlecht. Nur in ruhigen Monaten: kein Wettbewerb, keine Auktion, kein Prüfer und kein großes Thema in der Zeitung.
// Je Ereignis: ok sagt, ob es gerade passen kann, los führt es aus und meldet es mit Wichtigkeit 80 in der Zeitung.
function feldHaengt(){return R().sorten.filter(id=>{const f=S.felder[id];return f.reben&&f.menge>0&&!f.gelesen})}
function kritikerWein(l){return l.status==='flasche'&&l.stufe&&STUFEN[l.stufe].rang>=3}
// Version 7.0 (Schritt I): In der langen Partie kommt der Weinskandal rund alle anderthalb Jahre, die Erbschaft alle drei.
// Damit nicht immer derselbe Text steht, wechseln die Varianten der Reihe nach durch (S.vz), ohne Zufall.
// Version 7.0 (Schritt J, Maik 16.11.2026): Nach einem Weinskandal ist SKANDAL_PAUSE Monate Ruhe (S.skAb), sonst füllt er spät die Lücke der schlechten Ereignisse.
const SKANDAL_PAUSE=48;
function monatNr(){return (S.jahr-START_JAHR)*12+S.monat}
const VARIANTEN={
  skandal:[['Weinskandal erschüttert das Land','Ein Großhändler hat Frostschutzmittel in seinen Wein gemischt, jetzt trauen die Leute keinem Winzer mehr.'],
    ['Gefälschte Etiketten aufgeflogen','Ein Abfüller hat billigen Tafelwein tausendfach als Spätlese verkauft. Jetzt schauen die Kunden jeder Flasche misstrauisch aufs Etikett.'],
    ['Fernsehbericht schockt Weinfreunde','Ein Fernsehmagazin zeigt verschimmelte Fässer in einer Großkellerei. Seitdem lassen viele Kunden den Wein im Regal stehen.'],
    ['Zucker im Most','Mehrere Kellereien haben heimlich Zucker in den Most gekippt. Die Zeitungen sind voll davon, die Kunden halten sich zurück.'],
    ['Wasser im Wein','Ein Händler hat seinen Wein mit Leitungswasser gestreckt. Der Spott ist groß, die Kauflust klein.']],
  erbschaft:['Eine entfernte Großtante hat dir {b} hinterlassen. Sie hat deinen Wein wohl heimlich gemocht.',
    'Ein alter Stammgast hat dich in seinem Testament bedacht: {b}. „Für den besten Schoppen im Ort“, steht darin.',
    'Ein Onkel aus Übersee, von dem keiner etwas wusste, hat dir {b} vermacht.',
    'Die Witwe eines Weinhändlers hinterlässt dir {b}. Ihr Mann habe immer von deinem Keller geschwärmt.',
    'Ein Schulfreund aus der Familie hat dir {b} hinterlassen, mit einem Zettel: „Mach was Gutes draus.“']
};
function variante(k){S.vz=S.vz||{}; const V=VARIANTEN[k], i=(S.vz[k]=(S.vz[k]||0)+1)-1; return V[i%V.length]}
const EREIGNIS={
  gut:{
    supersommer:{ok:()=>(S.monat===6||S.monat===7)&&feldHaengt().length,los(){const n=rint(6,9); for(const id of feldHaengt()) S.felder[id].oe=Math.min(150,S.felder[id].oe+n); S.sonne++; schlag(80,'Supersommer!',`Wochenlang Sonne satt ${WO[S.region]}. Deine Trauben legen ${n}° Öchsle zu, und der Sommer zählt als zusätzlicher Sonnenmonat.`,'supersommer',{du:1})}},
    mode:{ok:()=>!S.lage,los(){const fr=S.rollen?R().sorten.filter(sorteFrei):null, id=fr?fr[rint(0,fr.length-1)]:R().sorten.slice().sort((a,b)=>eignung(b)-eignung(a))[0], f=1+rnd(.2,.4), n=rint(4,6); S.lage={typ:'mode',f,rest:n,sorte:id}; schlag(80,`${SORTEN[id].name} ist plötzlich in Mode`,`Ein Fernsehkoch schwärmt ${fr?`von der Rebsorte ${SORTEN[id].name} ${WO[S.region]}, und plötzlich wollen alle diesen Wein`:`vom ${SORTEN[id].name} ${WO[S.region]}, und plötzlich wollen ihn alle`}. ${n} Monate lang bringt er ${Math.round((f-1)*100)}\u00a0% mehr.`,'rieslingmode',{du:1})}},
    erbschaft:{ok:()=>true,los(){const b=Math.round(rint(8,20)*1000*(1+S.rang/2)/100)*100; S.geld+=b; fx('kasse'); schlag(80,'Unverhoffte Erbschaft',`${variante('erbschaft').replace('{b}',eur(b))} Das Geld ist steuerfrei.`,'erbschaft',{du:1})}},
    kritiker:{ok:()=>S.lots.some(kritikerWein),los(){const l=S.lots.filter(kritikerWein).sort((a,b)=>b.qp-a.qp)[0], q=rint(3,5); l.qp+=q; const a=ruhm(12); schlag(80,`Kritiker lobt deinen ${lotName(l)}`,`Ein bekannter Weinkritiker hat deinen ${lotName(l)} probiert und schwärmt in seiner Kolumne. Der Wein bekommt ${q} Qualitätspunkte mehr, dazu +${a} Ansehen.`,'weinkritiker',{du:1})}}
  },
  schlecht:{
    hagel:{ok:()=>S.monat>=5&&S.monat<=8&&feldHaengt().length,los(){const p=rnd(.2,.4); for(const id of feldHaengt()){const f=S.felder[id]; f.menge=Math.round(f.menge*(1-p))} schlag(80,`Hagel ${WO[S.region]}`,`Ein Unwetter mit Hagelkörnern so groß wie Murmeln ist über deine Weinberge gezogen. Rund ${Math.round(p*100)}\u00a0% der Trauben sind hin.`,'hagel',{du:1})}},
    maschine:{ok:()=>S.maschinen.length,los(){const ma=S.maschinen[rint(0,S.maschinen.length-1)], n=rint(20,40); ma.zustand=Math.max(10,ma.zustand-n); schlag(80,'Maschinenschaden',`Dein${mTyp(ma).f?'e':''} ${mTyp(ma).name} ${MASCH_SCHADEN[ma.typ]||MASCH_SCHADEN.klein}. Der Zustand sinkt um ${n} auf ${ma.zustand}\u00a0%. ${ma.zustand<MASCH_ROT?`Unter ${MASCH_ROT}\u00a0% f\u00e4llt ${maschEr(ma)} aus, bis ${maschEr(ma)} gewartet ist.`:`Eine Wartung bringt ${maschEr(ma)==='er'?'ihn':'sie'} wieder in Schuss.`}`,'maschine',{du:1})}},
    skandal:{ok:()=>!S.lage&&monatNr()>=(S.skAb||0),los(){const f=1-rnd(.2,.35), n=rint(3,5), [t,x]=variante('skandal'); S.lage={typ:'skandal',f,rest:n}; S.skAb=monatNr()+SKANDAL_PAUSE; schlag(80,t,`${x} ${n} Monate lang bringen alle Weine ${Math.round((1-f)*100)}\u00a0% weniger.`,'weinskandal',{du:1})}},
    helferweg:{ok:()=>S.helfer>0&&S.loehne.helfer[0]<=lohnF(LOHN_BILLIG)&&S.geld>4000,los(){const b=clamp(Math.round(S.geld*rnd(.05,.1)/100)*100,2000,30000); S.loehne.helfer.shift(); S.helfer--; S.geld-=b; schlag(80,'Erntehelfer über alle Berge',`Dein billigster Erntehelfer ist über Nacht verschwunden, und mit ihm ${eur(b)} aus der Kasse. Ersatz findest du beim Arbeitsamt.`,'helferweg',{du:1})}}
  }
};
// S.erIn zählt die Monate bis zum nächsten Ereignis. Passt es gerade nicht, wartet es auf den nächsten ruhigen Monat.
function ereignisMonat(){
  if(S.erIn==null) S.erIn=rint(4,8);
  if(--S.erIn>0) return;
  if(S.wett||S.auktion||S.pruefer||(S.jahr-START_JAHR)*12+S.monat<6||TOP.some(x=>x.p>=55)) return;
  for(const s of Math.random()<.5?['gut','schlecht']:['schlecht','gut']){
    const M=Object.values(EREIGNIS[s]).filter(e=>e.ok());
    if(M.length){M[rint(0,M.length-1)].los(); S.erIn=rint(4,8); return}
  }
}

/* ================= Computer-Winzer ================= */
// Läuft einmal im Monat für jeden Gegner und liefert die Nachrichten des Monats.
// Übergabe beim Gegner: neuer Vorname aus GEGNER_ERBE, Nachname und Art bleiben. Steuer aufs Vermögen, was fehlt, wird Kredit. Gibt die Zeitungsmeldung zurück.
function gegnerErbe(g){
  const E=GEGNER_ERBE[g.typ], teile=g.name.split(' '), vor=teile.shift(), fam=teile.join(' '), alt=g.name;
  g.vornamen=(g.vornamen||[]).concat(vor);
  const frei=E.namen.filter(x=>!g.vornamen.includes(x)), vn=(frei.length?frei:E.namen)[rint(0,(frei.length?frei:E.namen).length-1)];
  const steuer=Math.max(0,Math.round(gVerm(g)*ERB_STEUER/100)*100), bar=Math.min(steuer,Math.max(0,g.geld));
  g.geld-=bar; g.kredit+=steuer-bar; g.ansehen*=ERB_ANSEHEN;
  g.name=vn+' '+fam; g.gen=(g.gen||1)+1; g.genVers=rint(1,3);
  return E.text(alt,vn,WO[g.region]);
}
function gegnerMonat(){
  const N=[], m=S.monat, st0=DIFF[S.schwer].ki, neu=(p,t)=>N.push({p,t});
  for(const g of S.gegner){
    const t=GEGNER_TYP[g.typ], wo=WO[g.region], heim=g.region===S.region;
    // Angeregte Kontrolle: Der Prüfer kommt. g.pansch zählt die Monate, in denen er gepanschten Wein finden würde.
    if(g.angeregt){
      g.angeregt=0;
      if(g.pansch>0){const st=Math.max(STRAFE_MIN,Math.round(g.geld*.15/100)*100); g.pansch=0; g.geruecht=false; g.ansehen=Math.max(0,g.ansehen-ANREG_ANS); g.geld-=st; schlag(64,`Panscherei bei ${g.name} aufgeflogen`,`Auf deinen Hinweis hin hat der Prüfer den Keller von ${g.name} ${wo} durchsucht und gepanschten Wein gefunden. Das kostet ${eur(st)} Strafe und ${ANREG_ANS} Ansehen.`,'kontrolle',{archiv:1})}
      else{ruhm(-ANREG_FEHL); schlag(64,`Kontrolle bei ${g.name} ohne Befund`,`Der Prüfer hat bei ${g.name} ${wo} nichts gefunden. Dass der Hinweis von dir kam, hat sich herumgesprochen. Das kostet dich ${ANREG_FEHL} Ansehen.`,'kontrolle',{archiv:1})}
    }
    if(g.pansch>0&&--g.pansch<=0) g.geruecht=false;
    // Auch die Gegner fangen mit kahlem Weinberg an: Jahr 1 bringt 20 %, Jahr 2 60 %, danach voll.
    if(m===0) g.jahre=(g.jahre||0)+1;
    // Schritt G 7.0: Generationswechsel ein bis drei Jahre nach deinem, nach denselben Regeln.
    if(m===0&&S.jahr-START_JAHR>=GEN_JAHRE*(g.gen||1)+(g.genVers||1)) neu(9,gegnerErbe(g));
    const auf=Math.min(1,.2+.4*((g.jahre||0)-1));
    // Aufstiegstempo: Die Gegner fangen gemütlich an und werden über die Jahre stärker.
    const st=st0*(GEGNER_START+(GEGNER_ENDE-GEGNER_START)*clamp(((g.jahre||1)-1)/GEGNER_JAHRE,0,1));
    if(m===0){
      // g.schaden: Anteil der Ernte, den eine Sabotage im Vorjahr gekostet hat.
      // Schritt 3 (6.0): Das Gebiet wirkt über regionF auf das Einkommen, wie bei dir über Preis, Lese-Menge, Sekt und Sterne.
      const gew=Math.round(g.ha*rnd(t.eink[0],t.eink[1])*st*auf*(1-(g.schaden||0))*regionF(g.region)/100)*100; g.schaden=0;
      // Auch die Gegner zahlen Steuer auf den Jahresgewinn und pflanzen nach, sobald ihr Weinberg voll trägt.
      g.geld+=gew-(gew>0?Math.round(gew*STEUER/100)*100:0)-(auf===1?g.ha*GEGNER_ABNUTZ:0);
      if(gew>0&&auf===1) g.ansehen+=4*st;
      if(gew<0) neu(3,`${g.name} hat sich verkalkuliert und schließt das Jahr mit Verlust ab.`);
      else if(auf===1&&gew>g.ha*(t.eink[0]+(t.eink[1]-t.eink[0])*.9)*st) neu(1,`${g.name} meldet ein Rekordjahr.`);
      if(g.kredit>0&&g.geld>0){const r=Math.min(g.kredit,Math.round(g.geld*.5)); g.geld-=r; g.kredit-=r; if(!g.kredit) neu(2,`${g.name} ist bei der Bank wieder schuldenfrei.`)}
    }
    // Kälteeinbruch im November: trifft, wer noch Trauben hängen hat. Die Vorsichtige hat meist schon gelesen. Hat die Vorhersage gewarnt, lesen fast alle vorher.
    if(m===10&&S.kaelte===S.jahr&&auf>.2&&(g.poker||Math.random()<(g.typ==='vorsicht'?.2:.6)*(S.kaelteWarn===S.jahr?.3:1))){g.geld-=g.ha*(g.poker?2500:1500); g.poker=false; neu(3,`Kälteeinbruch ${wo}: Bei ${g.name} ist erfroren, was noch hing.`)}
    // Gefälschtes Kellerbuch (Sabotage des Spielers): g.falsch zählt die Monate bis zur Kontrolle beim Gegner.
    if(g.falsch&&--g.falsch<=0){g.falsch=0; g.ansehen=Math.max(0,g.ansehen-40); g.geld-=Math.max(10000,Math.round(g.geld*.15)); neu(6,`Weinkontrolle bei ${g.name}: Im Kellerbuch steht gepanschter Wein. Das kostet Strafe und Ansehen.`)}
    if(m===1&&g.jahre){g.ansehen+=rnd(t.ans[0],t.ans[1])*st*auf; if(Math.random()<.5) neu(1,`${g.name} meldet im Rathaus ${t.weine[rint(0,t.weine.length-1)]} an.`)}
    if(m===2&&!heim&&auf===1&&Math.random()<t.med*st){const P=PREISE.land[rint(0,2)]; g.ansehen+=P.ans*st; neu(4,`${g.name} holt ${P.t} bei der Landesprämierung ${wo}.`)}
    if((!heim||g.ha>=gegnerDeckel(g))&&Math.random()<1/18){
      const ha=auktionHa(), pr=Math.round(ha*rnd(12000,26000)/500)*500;
      if(g.geld+(g.typ==='zocker'?30000:0)>=pr&&Math.random()<t.biet*st*bietF()){g.geld-=pr; g.ansehen+=2*(3+Math.min(ha,7))*st; const voll=g.ha+ha>gegnerDeckel(g); if(!voll) g.ha+=ha; neu(4,voll?`${g.name} baut den Keller aus.`:`${g.name} ersteigert ${ha}\u00a0Hektar ${wo}.`)}
    }
    // Panschen im Oktober: Zocker oft, die anderen selten. Mal fliegt es gleich auf, sonst bleibt es eine Weile im Keller, manchmal mit Gerücht.
    if(m===9&&Math.random()<PANSCH[g.typ]){
      if(Math.random()<.35){g.ansehen=Math.max(0,g.ansehen-40); g.geld-=Math.round(Math.max(2000,g.geld*.1)); neu(5,`Weinkontrolle bei ${g.name}: gepanschter Wein gefunden. Das kostet Strafe und Ansehen.`)}
      else{g.geld+=g.ha*(g.typ==='zocker'?2500:1000); g.pansch=rint(6,14); if(Math.random()<.4){g.geruecht=true; neu(8,`Man munkelt, bei ${g.name} werde heimlich nachgezuckert.`)}}
    }
    if(g.typ==='zocker'){
      if(!g.kredit&&Math.random()<.04){const k=12000*(g.rang+1); g.geld+=k; g.kredit=Math.round(k*1.2); neu(2,`${g.name} nimmt einen Kredit über ${eur(k)} auf.`)}
      if(m===9){
        if(S.kaelteWarn!==S.jahr&&Math.random()<.35*Math.min(1,REGIONEN[g.region].frost/.3)){g.poker=true; neu(2,`${g.name} pokert auf Eiswein und lässt alles hängen.`)}
      }
      if(m===11&&g.poker){
        g.poker=false;
        if(Math.random()<REGIONEN[g.region].frost){g.ansehen+=16*st; g.geld+=g.ha*3000; g.eisJ=S.jahr; neu(3,`Frost ${wo}: Der Eiswein-Poker von ${g.name} geht auf.`)}
        else{g.geld-=g.ha*2500; g.eisPl=S.jahr; neu(3,`Kein Frost ${wo}: ${g.name} verliert einen Teil der Ernte.`)}
      }
    }else if(m===8&&Math.random()<.3) neu(0,g.typ==='vorsicht'?`${g.name} liest früh und geht kein Risiko ein.`:`${g.name} lässt die Trauben für eine Auslese hängen.`);
    if(g.geld<0){g.kredit+=Math.round(-g.geld*1.15); g.geld=0}
    const alt=g.rang; g.rang=rangFuer(g.rang,g.ansehen,g.ha,gVerm(g));
    if(g.rang>alt){
      // Seit 10.3: Präsident heißt nur, wer auf dem Stuhl sitzt. Rang zehn macht einen Gegner zum Herausforderer, außer er ist der Erste (gegnerSieg). Gegnerinnen bekommen die weiblichen Ränge (A14).
      if(g.rang===R_MAX){if(S.sieger) neu(9,`${g.name} hat alle Hürden für den großen Stuhl geschafft und wartet jetzt auf die nächste Wahl.`)}
      else neu(9,`${g.name} steigt auf und ist jetzt ${gFrau(g)&&RAENGE[g.rang].w||RAENGE[g.rang].name}.`);
      if(alt<=S.rang&&g.rang>S.rang&&GEGNER_SPRUCH[g.typ]) neu(9,GEGNER_SPRUCH[g.typ].vorbei(g.name));
      if(g.rang===R_MAX&&!S.sieger) gegnerSieg(g,wo);
    }
  }
  N.sort((a,b)=>b.p-a.p);
  return N.filter((n,i)=>n.p>=9||i<3).map(n=>n.t);
}
function maschLeistung(){return maschEinsatz().reduce((a,m)=>a+Math.round(mTyp(m).leist*m.zustand/100),0)}
function alleinReben(){return ALLEIN_HA*HA_REBEN}
function leistung(){return alleinReben()+S.helfer*HELFER_LEISTUNG+maschLeistung()}
function leseFaktor(){const b=rebenGesamt();return b?Math.min(1,leistung()/b):1}
// Leute-Regel: Gezählt werden Köpfe. Seit 8.0 zählt eine Maschine nur im Einsatz (Fahrer da, Zustand ab MASCH_ROT), darüber bremst der Zustand nur die Ernteleistung.
// Seit 11.5 (Teil C1) wird in Reben gerechnet: helferReben sagt, für wie viele Reben die Familie, h Erntehelfer und die Maschinen im Einsatz übers Jahr reichen.
function helferReben(h){h=h==null?S.helfer:h; return alleinReben()+h*REBEN_JE_HELFER+maschHelfer(h)*HA_REBEN}
// Erntehelfer, die es ohne Maschinen braucht (nur für die Anzeige).
function helferBedarf(){return Math.max(0,Math.ceil((rebenGesamt()-alleinReben())/REBEN_JE_HELFER))}
// Seit 8.0 (Paket B): Mit der Abfüllanlage im Einsatz betreut ein Lagerarbeiter ABF_FLASCHEN leere Flaschen, sonst FLASCHEN_JE_LAGERARB.

/* ================= Wetter ================= */
function wuerfelWetter(m,u){

  else if(m===3) t=[['frost',.1],['kalt',.1],['regen',.3],['sonnig',.2],['mild',1]];
  else if(m===2||m===4) t=[['frost',.03],['kalt',.1],['regen',.3],['sonnig',.2],['mild',1]];
  else if(m<=7) t=[['sonnig',.5],['regen',.2],['mild',1]];
  else t=[['sonnig',.3],['regen',.3],['kalt',.05],['mild',1]];
  let s=0; for(const [w,p] of t){s+=p; if(r<s) return w}
  return 'mild';
}
// Kälteeinbruch im November (KAELTE): wird schon mit der Vorhersage im Oktober ausgewürfelt, damit sie davor warnen kann. Sie trifft wie sonst in 75 % der Fälle.

function neuePrognose(){

  const n=(S.monat+1)%12, jn=n===0?S.jahr+1:S.jahr; S.wetterNext=wuerfelWetter(n,fest(1,0,jn,n));
  if(n===10){S.kaelte=fest(2,0,S.jahr,10)<KAELTE?S.jahr:0; S.kaelteVor=S.jahr; if(S.kaelte) S.wetterNext='frost'}
  S.prognose=fest(3,0,jn,n)<.75?S.wetterNext:n===10&&fest(3,1,jn,n)<KAELTE?'frost':wuerfelWetter(n,fest(3,2,jn,n));

}
// Vorhersage als Text, Frost im November heißt Kälteeinbruch.
const progText=()=>(S.monat+1)%12===10&&S.prognose==='frost'?'❄️ Kälteeinbruch':WETTER[S.prognose].join(' ');
const wbonus=w=>({sonnig:5,mild:0,regen:-4,kalt:-3,frost:-3}[w]);

// S.temp merkt die gewürfelte Zahl des Monats. Fehlt sie (alte Spielstände, Spielstart), gilt der Wert ohne Streuung.
const TEMP_MONAT=[2,3,7,11,15,18,20,20,16,11,6,3], TEMP_WETTER={sonnig:4,mild:0,regen:-2,kalt:-5};
// Seit 11.6: streu darf eine feste Zahl zwischen 0 und 1 sein (fest), true würfelt wie früher.
function tempFuer(m,w,streu){

// Überreife Trauben sind fast Rosinen und geben weniger Most: 1 Liter überreife Trauben wird zu MOST_UEBER Litern (feldLiter). Bis 11.4: EDEL_UEBER 0, MOST_UEBER 1.
const EDEL_UEBER=25, MOST_UEBER=.6;
const edelBonus=()=>EDEL_PLUS[Math.min(5,S.sonne)]+(R().edelPlus||0);

/* ================= Schädlinge ================= */

// Der Befall im Monat nach der Warnung. Gespritzt bleibt vom Schaden SPRITZ_F.
function schaedBefall(b,Z){

  if(!F.length){Z.push(b.art==='kirsch'?`${T.sym} Die Kirschessigfliege war da, aber dein ${namen(mengeSorten())} war schon gelesen. Glück gehabt.`:`${T.sym} ${T.name} im Ort, bei dir hing aber nichts am Stock.`); return}
  if(b.art==='kirsch'){

  }else{
    const P=b.art==='wickler'?WICKLER_P:MEHLTAU_P, p=festR(P[0],P[1],u)*g, pz=String(Math.round(p*1000)/10).replace('.',',');
    for(const id of F){const f=S.felder[id]; f.menge=Math.round(f.menge*(1-p))}

      :`Der Falsche Mehltau hat Blätter und junge Trauben befallen. ${F.length>1?'Auf allen Feldern':`Beim ${namen(F)}`} sind ${pz}\u00a0% der Trauben hin.`;

}
// Läuft jeden Monat nach dem Wachstum: freischalten, im April planen, warnen, Befall.
function schaedMonat(Z){
  if(!schaedAn()) return;
  const m=S.monat;
  if(S.rang>=WICKLER_RANG&&!(S.schaedAb&&S.schaedAb.wickler!=null)) (S.schaedAb=S.schaedAb||{}).wickler=S.jahr+schaedSpaet();
  const D=schaedDa();
  if(D.length&&S.schaedNext==null) S.schaedNext=S.jahr+festI(1,2,fest(9,3,S.jahr,0));
  if(m===3&&S.schaedNext!=null&&S.jahr>=S.schaedNext){
    const K=D.filter(schaedKann);
    if(K.length){
      const G=S.schaedGes||{}, regen=[4,5,6].filter(n=>wuerfelWetter(n,fest(1,0,S.jahr,n))==='regen').length;
      let art=K.find(a=>!G[a]);
      if(!art){const W=K.map(a=>a==='mehltau'?1+regen:1); let u=fest(9,4,S.jahr,0)*W.reduce((a,x)=>a+x,0); art=K[K.length-1]; for(let i=0;i<K.length;i++){u-=W[i]; if(u<0){art=K[i]; break}}}
      S.schaed={j:S.jahr,art,regen};
      S.schaedNext=S.jahr+festI(SCHAED_PAUSE[0],SCHAED_PAUSE[1],fest(9,0,S.jahr,0));
    }
  }
  const b=S.schaed; if(!b||b.j!==S.jahr||b.da) return;
  const T=SCHAED[b.art];
  if(m===T.warn){
    if(!rebenGesamt()){S.schaed=null; return}
    b.warn=1; schlag(70,`Weinbauamt warnt vor ${T.dem}`,schaedWarnText(b),'amt',{du:1});
  }else if(m===T.warn+1&&b.warn) schaedBefall(b,Z);
}

function mindest(st){const m=R().min; return (st==='feder'||st==='eis')?m.tafel:m[st]}
// q = {oe, leseart, edel, eis}
function pruefeQualitaet(st,q){
  const g=[], d=STUFEN[st], min=mindest(st);
  if(q.oe<min) g.push(`es fehlen ${min-q.oe}° Öchsle (Minimum ${min}°)`);
  if(q.masch&&(st==='eis'||d.rang>STUFEN.qba.rang)) g.push('mit der Maschine gelesen gibt es höchstens Qualitätswein');
  if(st==='eis'){
    if(!q.eis) g.push('nur aus gefrorenen Trauben der Dezember-Lese');
    if(!q.edel) g.push('Edelfäulnis fehlt');
    // Wie im Handbuch: reife oder überreife Trauben, aber nicht beides zusammen.
    if(q.leseart==='alles') g.push(`Leseart muss „${LESE.reif}“ oder „${LESE.ueber}“ sein`);
  }else{
    if(d.rang>=3&&q.eis) g.push('aus der Dezember-Lese gibt es nur Tafelwein, Qualitätswein oder Eiswein');
    if(d.lese&&q.leseart!==d.lese) g.push(`Leseart muss „${LESE[d.lese]}“ sein`);
    if(d.edel===true&&!q.edel) g.push('Edelfäulnis fehlt');
    if(d.edel===false&&q.edel) g.push('Trauben mit Edelfäulnis sind dafür nicht zugelassen');
  }
  return g;
}
function pruefeAnmeldung(l,st){
  const g=pruefeQualitaet(st,l), d=STUFEN[st];
  if(l.fassMonate<1) g.push('muss mindestens einen Monat im Fass liegen');
  if(st==='feder'&&l.fassMonate>1) g.push('nur im Monat nach der Lese möglich');
  if(d.rang>=3&&d.rang<=7&&S.jahr<=l.jahrgang) g.push('frühestens im Januar nach der Lese');
  if(st==='eis'&&!(S.monat===0&&S.jahr===l.jahrgang+1)) g.push('nur im Januar nach der Lese');
  if(d.geb&&d.geb>S.geld) g.push(`Gebühr von ${eur(d.geb)} nicht bezahlbar`);
  return g;
}
const REIHE=['tafel','qba','kab','spat','aus','ba','tba','eis'];
function besteStufe(q){let b=null; for(const st of REIHE) if(!pruefeQualitaet(st,q).length) b=st; return b}
function eisStufe(oe){const m=R().min; return oe>=m.tba?2:oe>=m.ba?1:0}
const eisF=l=>l.stufe==='eis'?EIS_WERT[l.eisW||0].f:1;
// Name der Stufe für die Lese-Hilfe, beim Eiswein mit seiner Wertstufe.
const stufeText=(st,oe)=>STUFEN[st].name+(st==='eis'?` (Öchsle einer ${EIS_WERT[eisStufe(oe)].name})`:'');
// Seit 8.0 Handlese: Felder mit Edelfäulnis brauchen je HAND_REBEN Reben einen echten Erntehelfer (Köpfe, Fahrer zählen mit).
// Seit 11.5 (Teil C1) liest jeder dreimal so viel (HAND_REBEN 3000 statt 1000), und die Familie liest ihre ALLEIN_HA Hektar auch von Hand selbst.
// Seit 10.3 (B3) zählen gefrorene Trauben ohne Edelfäulnis nicht mehr, Eiswein gibt es ohne sie ohnehin nicht.
// Fehlen sie und ist eine Maschine im Einsatz, liest die Maschine (masch), daraus wird höchstens Qualitätswein. Ohne Maschine lesen die Helfer, die da sind.
const HAND_REBEN=3000;
const handFeld=f=>!!f.edel;
const handBedarf=f=>Math.max(0,Math.ceil((f.reben-alleinReben())/HAND_REBEN));
const handFehlt=f=>handFeld(f)&&S.helfer<handBedarf(f)&&maschEinsatz().length>0;
const handlese=f=>handFeld(f)&&!handFehlt(f);
function feldQ(f,la){return {oe:Math.min(150,f.oe+(la==='ueber'?5:0)),leseart:la,edel:f.edel,eis:f.gefroren,masch:handFehlt(f)?1:0}}
// Abnutzung bei der Lese (8.0): reben ist der Teil der Lese, den die Maschinen schaffen, M ihre Ernteleistung zusammen. Auslastung reben/M (höchstens 1),
// je Maschine ABNUTZ_VOLL mal Auslastung mal Pflege-Faktor nach dem Zustand vor der ersten Lese des Jahres (ma.lj, ma.lz). Bruchteile sammelt ma.abn.
function maschAbnutzung(reben,M){
  const a=Math.min(1,reben/M);
  for(const ma of maschEinsatz()){
    if(ma.lj!==S.jahr){ma.lj=S.jahr; ma.lz=ma.zustand}
    ma.abn=(ma.abn||0)+ABNUTZ_VOLL*a*pflegeF(ma.lz)*mgrAbnutzF(); const d=Math.floor(ma.abn);
    if(d){ma.abn-=d; ma.zustand=Math.max(MASCH_MIN,ma.zustand-d)}
  }
}
// Version 4.4: ungefährer Listenwert einer Lese als Flaschenwein der Stufe st, ohne Reife und Marktlage.
function leseWert(id,la,st,liter){const q=feldQ(S.felder[id],la), qp=qpFuer({sorte:id,oe:q.oe,sonne:S.sonne,boden:S.boden,laub:S.laubJahr===S.jahr},st);
