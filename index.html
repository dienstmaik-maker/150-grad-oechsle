<title>150 Grad Öchsle</title>
<style>
/* Schrift Alegreya (Google Fonts, freie Lizenz OFL), nur lateinische Zeichen. Alegreya ist variabel: eine Datei für normal bis fett. */
@font-face{font-family:"Alegreya";font-style:normal;font-weight:400 900;font-display:swap;src:url(schrift/alegreya.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Alegreya";font-style:italic;font-weight:400;font-display:swap;src:url(schrift/alegreya-kursiv.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Alegreya SC";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/alegreya-sc.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Fraktur nur für den Zeitungskopf, die Datei enthält nur die Buchstaben von "Der Winzerbote". */
@font-face{font-family:"Winzerbote Fraktur";font-style:normal;font-weight:400;font-display:swap;src:url(schrift/fraktur.woff2) format("woff2")}
@font-face{font-family:"Alegreya SC";font-style:normal;font-weight:700;font-display:swap;src:url(schrift/alegreya-sc-fett.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Farben passend zu den Bildern: Weinlaub-Grün fürs Weingut, Pflaster-Ton für die Stadt, dunkles Holz für die Kellerei. --kopf ist die Leiste oben. */
:root{--bg:#c3d99e;--card:#edf5dc;--ink:#232a1a;--mut:#53613d;--wein:#7b1e3a;--kopf:#7b1e3a;--gruen:#44692a;--blau:#4a4f8f;--line:#a4bf7e;--rot:#b3261e;--gold:#a87908;
--schrift:"Alegreya",Georgia,"Times New Roman",serif;--knopf:"Alegreya SC","Alegreya",Georgia,"Times New Roman",serif;
--schild:url(bilder/knopf-weinrot.webp);--kschrift:#f8e6bf;--kschatten:0 1px 2px #3a0a16}
html.ort-keller{--schild:url(bilder/knopf-holz.webp);--kschrift:#f5d98c;--kschatten:0 1px 2px #000}
html.ort-stadt{--bg:#f2e2d2;--card:#fdf4ea;--ink:#2d2116;--line:#e3c8ae;--mut:#7a6453;--gruen:#58793a}
html.ort-keller{--bg:#2b1c12;--card:#3b281a;--ink:#f4e7d2;--mut:#bfa888;--wein:#cc607b;--kopf:#4a1526;--gruen:#9cbf74;--blau:#9aa0e0;--line:#5a4029;--rot:#f0766a;--gold:#e4b54a}
@media (prefers-color-scheme:dark){
:root{--bg:#13210d;--card:#1f2d17;--ink:#ecf0e2;--mut:#9aa68a;--wein:#c2516f;--kopf:#5c1830;--gruen:#8fb56a;--blau:#8d93d6;--line:#374b29;--rot:#ef6a60;--gold:#e0b84a}
html.ort-stadt{--bg:#1f1814;--card:#2e2520;--ink:#f1e8dc;--line:#48392f;--mut:#a89a8c}
html.ort-keller{--bg:#1a110a;--card:#2a1b11;--ink:#f1e8dc;--mut:#a89a8c;--wein:#c2516f;--kopf:#4a1526;--gruen:#8fb56a;--blau:#8d93d6;--line:#4a3422;--rot:#ef6a60;--gold:#e0b84a}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);transition:background-color .35s;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#top{position:sticky;top:0;z-index:5;background-color:#5c3a21;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 23px),linear-gradient(#6e4729,#4a2e18);border-bottom:2px solid #2b180c;box-shadow:0 3px 6px rgba(0,0,0,.3);color:#f5ebd6;padding:calc(6px + env(safe-area-inset-top)) 8px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#top b{font-size:17px}#top small{opacity:.85;display:block;font-size:12px}
#top>div{background:rgba(43,24,12,.55);border:1px solid rgba(229,169,60,.4);border-radius:10px;padding:4px 10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
#top>div b{color:#f8e7bf;text-shadow:0 1px 1px #000}#top .geld b{color:#f3c766}#top .geld{cursor:pointer}#top .geld b::after{content:' ›';opacity:.6;font-weight:400}
#top .geld{text-align:right;font-variant-numeric:tabular-nums}
main{padding:12px 16px calc(130px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h2{font:700 21px/1.2 var(--schrift);margin:6px 0 10px}h3{font:700 18px/1.25 var(--schrift);margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.mut{color:var(--mut);font-size:14px}.rot{color:var(--rot)}.gruen{color:var(--gruen)}.gold{color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:15px}.kv span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* Knöpfe im Stil eines Weinetiketts: gezeichnete Schilder als Rahmenbild. Die Enden behalten ihre Form, die Mitte wird in die Breite gezogen.
   --schild ist das Bild, --kschrift die Schriftfarbe: Hauptknopf ganz weinrot mit Goldrand, zweiter Knopf (.sec) hell mit dünnem Rand, im Keller dunkles Holz, gewagte Knöpfe (.wag) schwarz mit roter Linie. */
button{font:700 17px/1.15 var(--knopf);font-variant-caps:small-caps;letter-spacing:.04em;color:var(--kschrift);text-shadow:var(--kschatten);background:none;border:0 solid transparent;border-image:var(--schild) 50% 48 fill/50% 15px stretch;padding:12px 20px;min-height:46px;cursor:pointer;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4));transition:transform .08s,filter .08s}
button:active{transform:translateY(2px);filter:drop-shadow(0 0 0 transparent) brightness(.92)}
button.sec{--schild:url(bilder/knopf-zweit.webp);--kschrift:#5c1226;--kschatten:none;font-weight:600}
button.wag{--schild:url(bilder/knopf-schwarz.webp);--kschrift:#f4e4d4;--kschatten:0 1px 2px #000}
button.klein{min-height:40px;padding:8px 16px;font-size:15px}
button:disabled{opacity:.45;filter:grayscale(.7)}
/* Alles, was kein Schild ist: Auswahlkarten, Aufgaben, Sortier-Knöpfe, Reiter, Zettel, Zeilen im Kellerbuch. */
.wahl,.task,.chip,.zettel,.bzeile,#tabs button,#titel .weg{border-image:none;filter:none;font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;text-shadow:none;border-radius:12px;padding:12px 14px}
/* Version 4.0: Alle Karten sind Pergament, an jedem Ort gleich. Die Ortsfarbe bleibt nur im Hintergrund. */
.card,.task,.wahl,.bzeile,.info{--ink:#2b2118;--mut:#6b5a45;--line:#d3bf93;--wein:#7b1e3a;--rot:#b3261e;--gruen:#4c7030;--blau:#4a4f8f;--gold:#946b06;--card:#f8f0dc;background:linear-gradient(#fbf5e6,#f3e7cc);color:var(--ink);border:1px solid #cdb68a;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 4px rgba(43,24,12,.2)}
.card h3,.info b{color:#4a1526}.card .card{box-shadow:none}
.task{border-left:5px solid #4c7030}.task.rot{border-left-color:#b3261e}.wahl.an{border-color:#7b1e3a;box-shadow:0 0 0 2px #7b1e3a inset}
main>h3{font-size:17px;margin:16px 0 8px;padding-left:10px;border-left:4px solid var(--wein)}
.info{position:relative;border-radius:12px;padding:9px 12px 9px 38px;margin:0 0 12px!important;font-size:14px;cursor:pointer}
.info::before{content:'ℹ️';position:absolute;left:11px;top:8px;font-size:16px}
/* Zugeklappt: Nur der Text klappt auf zwei Zeilen zu, "Mehr im Buch" bleibt darunter sichtbar. */
.info .it{display:block}.info.zu{padding-right:30px}.info.zu .it{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.info.zu::after{content:'▾';position:absolute;right:11px;bottom:7px;color:#7b1e3a;font-weight:700}
/* Version 4.1: Link ins Buch, Gebiets-Steckbrief, Fußnote im Büro */
.mib{display:block;width:max-content;margin:7px 0 0;font-size:13px;font-weight:700;color:#7b1e3a;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sb h3 small{display:block;font-weight:400;font-size:13px;color:var(--mut);margin-top:2px}
.sb .sbz{margin:6px 0;font-size:14px;line-height:1.5}
.sterne{color:#a87908;letter-spacing:1px;white-space:nowrap}.sterne i{font-style:normal;opacity:.28}
.sb .lohnt{margin-top:8px;padding:6px 10px;border-radius:8px;background:rgba(123,30,58,.09);font-weight:700;color:#4a1526;font-size:14px}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.gchips .wahl{flex:1 1 30%;margin:0;padding:9px 4px;text-align:center;font-weight:600;font-size:14px}.gchips .gs{display:block;width:44px;height:44px;margin:0 auto 4px}
.fussnote{font-size:12px;color:var(--mut);margin:2px 4px 14px;text-align:center}
/* Das Buch: Vollbild im Papier-Stil wie der Winzerbote */
#buch{display:none;position:fixed;inset:0;z-index:40;flex-direction:column;background:#f3e7ca url(bilder/papier.jpg) center/cover;color:#2b2118;--ink:#2b2118;--mut:#6b5a45;--line:#d3bf93;--wein:#7b1e3a;--card:#fbf4e1}
#buch.an{display:flex}
#buch .bkopf,#buch .binnen,#buch .bfuss{width:100%;max-width:620px;margin:0 auto}
#buch .bkopf{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid #b9995a}
#buch .bkopf b{font:26px/1.1 "Winzerbote Fraktur",Georgia,serif;color:#4a1526}
#buch .binnen{flex:1;overflow:auto;padding:14px 18px 22px;font-size:15px;line-height:1.5}
#buch .bfuss{display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #b9995a}
#buch .bfuss button{flex:1}
#buch .bnr{font:700 13px "Alegreya SC",Georgia,serif;color:#7b1e3a;letter-spacing:.5px}
#buch h2{font:700 23px/1.2 Georgia,serif;color:#4a1526;margin:2px 0 10px}
#buch .kurz{background:rgba(255,255,255,.5);border-left:4px solid #7b1e3a;border-radius:8px;padding:8px 12px;margin:0 0 12px}
#buch ul,#buch ol{margin:0 0 12px;padding-left:20px}#buch li{margin:0 0 6px}#buch li ul,#buch li ol{margin:6px 0 0}
#buch details{border-top:1px solid #b9995a;padding-top:8px;margin-top:4px}
#buch summary{font:700 17px Georgia,serif;color:#4a1526;cursor:pointer;margin-bottom:8px}
#buch .binh h3{font:700 15px "Alegreya SC",Georgia,serif;color:#7b1e3a;margin:16px 0 2px;letter-spacing:.5px}
#buch .binh .bz{display:flex;gap:8px;padding:9px 2px;border-bottom:1px dotted #b9995a;font:16px Georgia,serif;cursor:pointer}
#buch .binh .bz span{color:#7b1e3a;min-width:24px;font-weight:700}
.chip{background:#f8f0dc;color:#2b2118;border:1px solid #b9995a;font-weight:600}.chip.an{background:#7b1e3a;color:#fff;border-color:#591015}
h4.gk{font:700 15px/1.2 var(--schrift);margin:12px 0 4px;color:#4a1526}
.pano,.mbild,.kbild{box-shadow:0 0 0 3px #5c3a21,0 0 0 4px #2b180c,0 4px 8px rgba(0,0,0,.35)}.pano,.mbild{margin-top:4px}
/* Okay als gezeichnetes Wachssiegel in Gold (Paket 7). */
.mitte{text-align:center;margin-top:10px}
button.siegel{width:84px;height:84px;min-height:0;padding:0;border-image:none;border-radius:50%;font-size:0;color:transparent;text-shadow:none;background:url(bilder/siegel.webp) center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
button.siegel:active{transform:translateY(2px) scale(.96);filter:brightness(.92)}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns button{flex:1 1 auto}
/* Version 4.0: Kauf- und Verkaufsknöpfe mit dem Preis drauf, rechts in der Karte. Links steht eine kurze Erklärung.
   Fehlt das Geld, wird der Knopf grau (.arm), bleibt aber antippbar und sagt, was fehlt. */
.kz{display:flex;align-items:center;gap:10px;margin-top:10px}.kz>div:first-child{flex:1;min-width:0;font-size:14px;color:var(--mut)}
.kzk{display:flex;flex-direction:column;align-items:stretch;gap:7px;flex:none}.kz.reihe .kzk{flex-direction:row-reverse;gap:8px}
button.pk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:122px;min-height:62px;padding:19px 24px 22px;font-size:15px}
button.pk>b{font:800 16px/1.05 var(--knopf);font-variant-caps:normal;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
button.pk>small{font:600 10.5px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;white-space:nowrap;opacity:.85}
button.pk.arm{filter:grayscale(1) opacity(.55)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--gruen)}
.bar.w i{background:var(--wein)}.bar.g i{background:var(--gold)}
.bar.fl{position:relative}.bar.fl i{position:absolute;left:0;top:0}.bar.fl i.hell{opacity:.35}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.weiss{background:var(--gruen)}.rotw{background:var(--blau)}
.task{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gruen);margin:0 0 8px;font-weight:500;min-height:0}
.task.rot{border-left-color:var(--rot);color:var(--ink)}
details.stz{margin-top:8px}details.stz summary{cursor:pointer;font-weight:700;opacity:.8;padding:6px 0}
.hilfe{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
/* Version 4.0: alle Bedienelemente unten in der Daumenzone. Oben die Unterreiter auf Pergament, darunter die Hauptleiste aus Holz. */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:6;filter:drop-shadow(0 -3px 6px rgba(0,0,0,.3))}
#subs{display:flex;max-width:560px;margin:0 auto;padding:4px 6px 0;gap:3px;background:linear-gradient(#efe2c4,#e2d1b3);border-top:2px solid #5c3a21;border-radius:14px 14px 0 0}
#subs button{position:relative;flex:1;min-width:0;min-height:48px;padding:4px 1px 5px;border:0;border-image:none;border-radius:10px 10px 0 0;background:none;color:#6b5236;font:600 10.5px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-caps:normal;letter-spacing:0;text-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background-color .2s,color .2s}
#subs button>i{font-style:normal;font-size:19px;line-height:22px;transition:transform .2s}#subs button>i img{height:20px;vertical-align:-3px}
#subs button>b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#subs button.an{background:#f8f0dc;color:#7b1e3a;box-shadow:inset 0 -3px 0 #8b1e24}#subs button.an>i{transform:scale(1.18) translateY(-1px)}#subs button.an>b{font-weight:800}
#tabs{display:flex;align-items:stretch;padding:4px 4px env(safe-area-inset-bottom);background-color:#5c3a21;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.09) 0 1px,transparent 1px 23px),linear-gradient(#6e4729,#4a2e18);border-top:2px solid #2b180c}
#tabs button{position:relative;flex:1;background:none;color:#ead6ae;border-radius:10px;padding:6px 2px;margin:2px 2px 4px;font-size:11.5px;font-weight:600;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 1px 1px #000;transition:background-color .2s,transform .2s}
#tabs button span{font-size:21px}#tabs button img{height:25px;display:block;margin:3px 0 1px}#tabs button.an{background:#f5ebd6;color:#7b1e3a;text-shadow:none;font-weight:800;box-shadow:inset 0 0 0 2px #8b1e24,inset 0 0 0 4px #f5ebd6,inset 0 0 0 5px rgba(139,30,36,.45),0 2px 4px rgba(0,0,0,.45);transform:translateY(-3px)}
#tabs #weiter{flex:1.3;margin:6px 8px 6px 2px;border-radius:0;border-image:var(--schild) 50% 48 fill/50% 15px stretch;color:var(--kschrift);text-shadow:var(--kschatten);font:700 13px/1.1 var(--knopf);font-variant-caps:small-caps;letter-spacing:.03em;min-height:46px;justify-content:center;padding:5px 16px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.4))}
#tabs #weiter{flex-direction:row;gap:6px;--schild:url(bilder/knopf-weinrot.webp);--kschrift:#f8e6bf;--kschatten:0 1px 2px #3a0a16;margin:5px 4px 7px 4px}#tabs #weiter span{font-size:14px}
#tabs #weiter.zu{filter:grayscale(1) brightness(.9)}
.badge{position:absolute;top:5px;right:calc(50% - 21px);width:10px;height:10px;border-radius:50%;background:#e5a93c;box-shadow:0 0 0 2px #f5ebd6}.badge.rot{background:#c62828}#tabs .badge{top:4px;right:calc(50% - 22px);box-shadow:0 0 0 2px #4a2e18}#tabs button.an .badge{box-shadow:0 0 0 2px #f5ebd6}
/* Steht nichts mehr an, pulsiert der Knopf sanft. */
#tabs #weiter.frei{animation:wpuls 2.6s ease-in-out infinite}
@keyframes wpuls{50%{filter:drop-shadow(0 0 7px rgba(255,214,120,.95)) brightness(1.07)}}
/* Fenster: Papier vom Zeitungsblatt mit Zierlinie oben, gleitet weich von unten hoch. Die Farben gelten an jedem Ort gleich. */
#sheet{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
#sheet.an{display:flex}
#sheet>div{position:relative;background:#f3e7ca url(bilder/papier.jpg) center/cover;color:#2b2118;--card:#fbf4e1;--bg:#fffaf0;--ink:#2b2118;--mut:#6b5a45;--line:#d3bf93;--wein:#7b1e3a;--rot:#b3261e;--gruen:#4c7030;--blau:#4a4f8f;--gold:#946b06;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;border-top:1px solid #b9995a;box-shadow:0 -6px 26px rgba(0,0,0,.5);padding:24px 16px calc(18px + env(safe-area-inset-bottom));animation:hoch .32s cubic-bezier(.2,.8,.3,1)}
#sheet>div::before{content:'❦';position:absolute;top:4px;left:18px;right:18px;text-align:center;font:14px/16px Georgia,serif;color:#a8843a;background:linear-gradient(#b9995a,#b9995a) left 50%/calc(50% - 16px) 1px no-repeat,linear-gradient(#b9995a,#b9995a) right 50%/calc(50% - 16px) 1px no-repeat}
#sheet h3{font-size:21px;margin-bottom:8px}
@keyframes hoch{from{transform:translateY(56px);opacity:0}to{transform:none;opacity:1}}
input[type=range]{width:100%;height:40px;accent-color:var(--wein)}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.slval{text-align:center;font-size:15px;margin:8px 0}.slval b{font-size:24px;display:block}
.wahl{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin:0 0 8px;font-weight:500}
.wahl.an{border-color:var(--wein);box-shadow:0 0 0 2px var(--wein) inset}

.mgrinfo .mtext span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.35;color:var(--mut)}

ul.kl{margin:4px 0 0;padding-left:18px;font-size:14px}

#info .ztitel{text-align:center;white-space:nowrap;font:400 clamp(32px,9.4vw,50px)/1.05 "Winzerbote Fraktur",var(--knopf);letter-spacing:.5px;color:#3a1a0e}

#info .zstand b.lang{font-size:13px;letter-spacing:-.2px}
#info .zknopf{display:flex;justify-content:center;margin:4px 0 14px}

#info .zwetter small,#info .zzwei h4{display:block;font:700 13px/1.3 var(--knopf);font-variant-caps:small-caps;color:var(--mut);margin:0 0 2px}

#info .ifuss button{display:block;width:100%;max-width:560px;margin:0 auto;font-size:18px;min-height:54px}

@keyframes ein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.wand{position:absolute;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6%;pointer-events:none}.wand.gleit{transition:left .7s ease,top .7s ease,width .7s ease,height .7s ease}

.zettel:nth-child(even){transform:rotate(3deg)}.zettel.rot{background:#ff9a8a}

<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="titel"></div>
<div id="buch"></div>
<input type="file" id="datei" accept=".json,application/json" hidden>
<script src="anleitung.js"></script>
<script>
'use strict';
/* ================= Daten ================= */
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const SORTEN={
  riesling:{name:'Riesling',farbe:'weiss',ertrag:4,zucker:0,preis:6,minL:18,maxL:360,q:10,reife:.12,sektStar:true},
  mueller:{name:'Müller-Thurgau',farbe:'weiss',ertrag:5.6,zucker:-4,preis:3,minL:6,maxL:96,q:3,reife:.05},
  silvaner:{name:'Silvaner',farbe:'weiss',ertrag:5,zucker:-2,preis:4,minL:6,maxL:120,q:5,reife:.07},
  spaetb:{name:'Spätburgunder',farbe:'rot',ertrag:3.8,zucker:2,preis:5.5,minL:12,maxL:180,q:8,reife:.10,sektStar:true},
  portug:{name:'Portugieser',farbe:'rot',ertrag:6,zucker:-5,preis:2.8,minL:3,maxL:48,q:2,reife:.04},
  troll:{name:'Trollinger',farbe:'rot',ertrag:5.6,zucker:-3,preis:3.2,minL:6,maxL:60,q:3,reife:.05}
};
// Hürden in zwei Stufen: vier Gebiete mit normalen Mindestwerten, Franken und Württemberg mit niedrigeren.
// Die beiden sind dafür 10° kühler (warm), unter dem Strich also 3° hinter Mosel und Rheingau. Seit 7.0 (Schritt H) -10 statt -11:
// Mit -11 schaffte der Test-Spieler in Franken den Präsidenten nur in 4 von 9 Partien, mit -10 in 9 von 9 (Mitte Jahr 116). Sie bleiben die riskanten Gebiete.
const MIN_NORMAL={tafel:50,qba:60,kab:75,spat:85,aus:95,ba:125,tba:150}, MIN_KUEHL={tafel:45,qba:53,kab:68,spat:78,aus:88,ba:118,tba:150};
// Boni je Gebiet, ohne Eintrag gilt 1 oder 0: preisF (Faktor auf jeden Preis), wettPlus (Punkte bei Wettbewerben),
// seit 6.0 (Schritt 3) ertragF (Faktor auf die Lese-Menge) und sektPreisF (Faktor auf den Sekt-Preis). Steckbrief und Gegner rechnen sie mit (regionF).
const REGIONEN={
  mosel:{name:'Mosel',sorten:['riesling','mueller','spaetb'],warm:0,edelSpatF:.5,frost:.25,wettPlus:3,text:'Steile Schieferhänge, Riesling-Land. Steillagen-Ruf: Bei Wettbewerben zählt jeder Wein 3 Punkte mehr. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  rheingau:{name:'Rheingau',sorten:['riesling','spaetb','silvaner'],warm:0,edelSpatF:.5,frost:.25,preisF:1.1,text:'Berühmtes Riesling-Land: Jeder Wein bringt 10 % mehr Geld. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  rheinhessen:{name:'Rheinhessen',sorten:['mueller','silvaner','portug'],warm:3,edelF:1.1,frost:.12,text:'Warmes Silvaner-Land: mehr Zucker und öfter Edelfäulnis, dafür selten Frost für Eiswein. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  pfalz:{name:'Pfalz',sorten:['riesling','mueller','portug'],warm:3,edelF:1.1,frost:.10,text:'Warm mit milden Wintern: mehr Zucker und öfter Edelfäulnis, dafür kaum Frost für Eiswein. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  franken:{name:'Franken',sorten:['silvaner','mueller','spaetb'],warm:-10,edelAus:true,frost:.45,text:'Kühle Silvaner-Heimat mit kalten Wintern, Eiswein-Land. Weniger Zucker, niedrigere Hürden, Auslese ab 88°.',min:MIN_KUEHL},
  wuerttemberg:{name:'Württemberg',sorten:['troll','riesling','spaetb'],warm:-10,edelAus:true,frost:.43,text:'Kühles Rotwein-Land mit Trollinger und kalten Wintern, Eiswein-Land. Weniger Zucker, niedrigere Hürden, Auslese ab 88°.',min:MIN_KUEHL}
};
// Eignung der Rebsorte im Gebiet: 1 = sehr gut, .85 = gut, .7 = geht noch. Wirkt als Faktor auf die Qualitätspunkte.
const EIGNUNG={mosel:{riesling:1,mueller:.85,spaetb:.7},rheingau:{riesling:1,spaetb:.85,silvaner:.7},rheinhessen:{silvaner:1,mueller:.85,portug:.7},
  pfalz:{riesling:1,portug:.85,mueller:.7},franken:{silvaner:1,mueller:.85,spaetb:.7},wuerttemberg:{troll:1,riesling:.85,spaetb:.7}};
const eignung=(id,r)=>(EIGNUNG[r||S.region]||{})[id]||.85;
// Zucker der Sorte im Gebiet: Die beste Sorte startet überall gleich. Die anderen behalten ihren Abzug und liegen mindestens 1° darunter.
const zuckerIm=(id,r)=>eignung(id,r)>=1?0:Math.min(-1,SORTEN[id].zucker);
const eigText=e=>e>=1?'★★★ sehr gut geeignet':e>=.85?'★★ gut geeignet':'★ geht noch';
// Version 6.0 (Schritt 3): Sterne am Preis. Faktor je Stern der Sorte im Gebiet, zusätzlich zu den Qualitätspunkten, in preis, lotWert und leseWert.

  &&typeof o.name==='string'&&Number.isFinite(o.geld)&&Number.isInteger(o.jahr)&&Number.isInteger(o.monat)&&o.monat>=0&&o.monat<12

// Fremde Spielstände: spitze Klammern fliegen aus allen Texten, Bildnamen dürfen nur Buchstaben, Ziffern und Striche haben.
function saeubern(x,k){

// Sechs Musikstücke und sieben Geräusche liegen als Dateien im Ordner ton (gebaut von _medien_bauen.py). Musik und Geräusche sind getrennt abschaltbar (TON).
// Musik: Beim Ortswechsel blendet das alte Stück aus und das neue ein. Jedes Stück merkt sich seine Stelle und spielt dort später weiter.
// Kurz vor dem Ende blendet ein zweiter Abspieler vom Anfang her ein, so läuft das Stück im Kreis ohne Bruch.
const TON={musik:true,fx:true};
try{Object.assign(TON,JSON.parse(localStorage.getItem(TON_KEY)||'{}'))}catch(e){}
const MUSIK={gut:'weingut',keller:'kellerei',stadt:'stadt',wett:'wettbewerb',auf:'befoerderung',pfand:'pfaendung'};
// MUSIK_LAUT: Lautstärke der Musik (Geräusche laufen voll). BLENDE: Sekunden fürs Überblenden beim Ortswechsel, KREIS: am Ende eines Stücks. TAKT: Schritt des Mischers in ms.
const MUSIK_LAUT=.5, BLENDE=1.5, KREIS=3, TAKT=50;
const TOENE=['klick','menue','kasse','korken','stempel','hammer','schere'];
// MORT ist das Stück, das gerade laufen soll. SMUSIK ist ein Stück, das ein offenes Fenster verlangt (Wettbewerb). MSP: Abspieler je Stück, FXB: geladene Geräusche.
let AC=null, AN=false, MORT=null, SMUSIK=null, FXT=-1; const MSP={}, FXB={};
// Als Datei geöffnet (file:) laufen die Töne ohne Web Audio, weil der Browser Nachbardateien dort nicht lesen lässt.
const NETZ=location.protocol!=='file:';
// Der Ton startet erst mit dem ersten Tipp, vorher lässt ihn kein Browser zu.
function tonAn(){
  if(AN) return; AN=true;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}
  setInterval(mischer,TAKT);
  if(AC&&NETZ) for(const n of TOENE) fetch('ton/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(b=>{FXB[n]=b}).catch(()=>{});
  musikStell();
}
// Startet einen Abspieler. Das Ergebnis ist false, wenn der Browser das Abspielen verweigert.
function spiel(el){try{const p=el.play(); return p&&p.catch?p.catch(()=>false):Promise.resolve()}catch(e){return Promise.resolve(false)}}
// Ein Abspieler: v ist seine Lautstärke jetzt (0 bis 1), z das Ziel, dt die Sekunden für eine volle Blende.
function stimme(name){
  const el=new Audio('ton/musik-'+MUSIK[name]+'.mp3'), s={el,g:null,v:0,z:0,dt:BLENDE};
  el.preload='auto'; el.loop=true;
  if(AC&&NETZ) try{s.g=AC.createGain(); s.g.gain.value=0; AC.createMediaElementSource(el).connect(s.g); s.g.connect(AC.destination)}catch(e){s.g=null}
  if(!s.g) el.volume=0;
  return s;
}
function laut(s){const x=s.v*MUSIK_LAUT; if(s.g) s.g.gain.value=x; else s.el.volume=x}
// Mischer, läuft alle TAKT ms: schiebt jede Lautstärke ein Stück auf ihr Ziel zu, hält stumme Abspieler an und blendet am Ende eines Stücks zum Anfang über.
function mischer(){
  for(const n in MSP){
    const P=MSP[n];
    for(const s of P.s) if(s){
      if(s.v!==s.z){const d=TAKT/1000/s.dt; s.v=s.z>s.v?Math.min(s.z,s.v+d):Math.max(s.z,s.v-d); laut(s)}
      if(s.v===0&&s.z===0&&!s.el.paused) s.el.pause();
    }
    const a=P.s[P.akt], el=a.el;
    if(n===MORT&&!P.fest&&a.z===1&&el.duration&&el.currentTime>el.duration-KREIS){
      const b=P.s[1-P.akt]||(P.s[1-P.akt]=stimme(n));
      try{b.el.currentTime=0}catch(e){}
      a.z=0; b.z=1; a.dt=b.dt=KREIS; P.akt=1-P.akt;
      // Darf der zweite Abspieler nicht starten (manche iPhones), läuft der erste einfach von vorn weiter.
      spiel(b.el).then(ok=>{if(ok===false){P.fest=true; if(P.s[P.akt]===b){b.z=0; a.z=1; P.akt=1-P.akt}}});
    }
  }
}
function musikOrt(name){if(name!==MORT){MORT=name; musikStell()}}
// Stellt die Ziele neu: Nur das Stück des Ortes spielt, alles andere blendet aus.
function musikStell(){
  if(!AN) return;
  const an=TON.musik&&MORT&&!document.hidden;
  for(const n in MSP) if(!an||n!==MORT) for(const s of MSP[n].s) if(s){s.z=0; s.dt=BLENDE}
  if(!an) return;
  const P=MSP[MORT]||(MSP[MORT]={s:[stimme(MORT),null],akt:0}), a=P.s[P.akt];
  a.z=1; a.dt=BLENDE; spiel(a.el);
}
// Welches Stück gerade passt: Pfändung bei der Pleite, Wettbewerb im Wettbewerbs-Fenster und bei Medaillen, Beförderung beim Aufstieg, sonst das Stück des Ortes.
function musikWahl(){
  if(!S) return 'gut';
  if(S.pleite) return 'pfand';
  if(SMUSIK) return SMUSIK;
  if(TAB==='monat'){const E=(S.bericht&&S.bericht.ehr)||[]; return E.some(e=>e.a)?'auf':E.length?'wett':'gut'}
  return MUSIK[TAB]?TAB:'gut';
}
// Liegt das Spiel im Hintergrund, schweigt die Musik sofort. Beim Zurückkommen blendet sie wieder ein.
document.addEventListener('visibilitychange',()=>{
  if(!AN) return;
  if(document.hidden){for(const n in MSP) for(const s of MSP[n].s) if(s){s.v=s.z=0; laut(s); s.el.pause()}}
  else{if(AC&&AC.state==='suspended') AC.resume(); musikStell()}
});
// Kurzes Geräusch, mal-fach im Abstand von 400 ms (Auktionshammer). Der Tipp-Klick schweigt, wenn im selben Augenblick schon ein anderes Geräusch kam.
function fx(name,mal){
  if(!AN||!TON.fx) return;
  const t=performance.now(); if(name==='klick'&&t-FXT<80) return; FXT=t;
  for(let i=0;i<(mal||1);i++){
    if(AC&&FXB[name]){const q=AC.createBufferSource(); q.buffer=FXB[name]; q.connect(AC.destination); q.start(AC.currentTime+i*.4)}
    else setTimeout(()=>spiel(new Audio('ton/'+name+'.mp3')),i*400);
  }
}

// PANO_ZOOM vergrößert das Bild je Hauptreiter (std) oder je Ort, damit ein Motiv das Fenster füllt. 1 = ganze Höhe sichtbar.

// Bild oben in einem Fenster (Weinkontrolle, Auktion, Prämierung, Rathaus, Kellerbuch, Pleite).

// Bild hinter der Zeitung: die Frostnacht beim Kälteeinbruch im November, sonst die Jahreszeit. Was es zu feiern gibt, zeigt das Foto in der Zeitung.
function monatBild(){
  if(S.monat===10&&S.kaelte===S.jahr) return 'frost';

}
// Pinnwand im Weingut-Bild: je offener Aufgabe ein Zettel mit Symbol, höchstens vier, Dringendes zuerst und in Rot. Tippen führt wie in der Liste an den Ort. Leere Wand heißt: nichts steht an.
// WAND nennt die Korkfläche im Streifen als Anteile (links, rechts, oben, unten). Bei einem neuen Bild neu ausmessen.
const WAND=[.491,.533,.385,.61], WAND_SYM={amt:'🏛️',bank:'🏦',arbeit:'👷',handel:'🍷',laeden:'🍷',berg:'🍇',maschinen:'🚜',lager:'📦',keller:'🍾',stadt:'🏛️',gut:'🏡'};
function wandHtml(){
  const A=aufgaben().slice().sort((a,b)=>(b.rot?1:0)-(a.rot?1:0)).slice(0,4);
  const sym=a=>{const m=a.t.match(/^\p{Extended_Pictographic}️?/u); return m?m[0]:WAND_SYM[a.sub]||WAND_SYM[a.tab]||'📌'};
  return `<div class="wand">${A.map(a=>`<button class="zettel ${a.rot?'rot':''}" data-a="${a.akt||'tab'}" data-id="${a.tab||''}" data-sub="${a.sub||''}" aria-label="${esc(a.t)}">${sym(a)}</button>`).join('')}</div>`;
}
// Legt die Zettel-Fläche genau auf die Korkwand, passend zu Verschiebung x (Prozent) und Zoom z des Streifens.
function wandStell(el,r,x,z){
  const w=$('.wand',el); if(!w) return;
  const H=el.clientHeight, B=el.clientWidth, sw=H*r*z, ox=x/100*(sw-B), oy=(H*z-H)/2;
  w.style.left=(WAND[0]*sw-ox)+'px'; w.style.top=(WAND[2]*H*z-oy)+'px'; w.style.width=((WAND[1]-WAND[0])*sw)+'px'; w.style.height=((WAND[3]-WAND[2])*H*z)+'px'; w.style.fontSize=((WAND[3]-WAND[2])*H*z)+'px';
}
// Schiebt den Streifen so, dass das Motiv des Unterreiters in der Mitte steht. Im selben Hauptreiter gleitet er vom alten Platz dorthin.
function panoStell(){
  const p=$('.pano>i'); if(!p) return;
  const el=p.parentNode, r=parseFloat(getComputedStyle(el).getPropertyValue('--r'))||6, z=PANO_ZOOM[TAB][SUB]||PANO_ZOOM[TAB].std, f=el.clientWidth/(el.clientHeight*r*z);
  const x=f>=1?50:Math.round(clamp((PANO_MITTE[TAB][SUB]-f/2)/(1-f),0,1)*1000)/10, gr=z=>`auto ${Math.round(z*100)}%`;
  if(PANO_ALT.tab===TAB&&(PANO_ALT.x!==x||PANO_ALT.z!==z)){p.style.backgroundPositionX=PANO_ALT.x+'%'; p.style.backgroundSize=gr(PANO_ALT.z); wandStell(el,r,PANO_ALT.x,PANO_ALT.z); p.getBoundingClientRect(); p.classList.add('gleit'); const w=$('.wand',el); if(w) w.classList.add('gleit')}
  p.style.backgroundPositionX=x+'%'; p.style.backgroundSize=gr(z); wandStell(el,r,x,z); PANO_ALT={tab:TAB,x,z};
}
// Tipp ins Bild: Welches Motiv liegt dem Tipp am nächsten? fr ist die Stelle im ganzen Streifen (0 bis 1).
function panoTipp(e){
  const el=e.target.closest('.pano'); if(!el||!PANO_MITTE[TAB]) return null;
  const b=el.getBoundingClientRect(), r=parseFloat(getComputedStyle(el).getPropertyValue('--r'))||6, W=b.height*r*(PANO_ALT.z||1);
  const fr=(e.clientX-b.left+PANO_ALT.x/100*(W-b.width))/W;
  return Object.entries(PANO_MITTE[TAB]).sort((a,c)=>Math.abs(a[1]-fr)-Math.abs(c[1]-fr))[0][0];
}
// Alte Spielstände: Edelfäulnis unter dem Auslese-Wert gab es nur nach der früheren Regel. Sie fällt weg, damit Kabinett und Spätlese nicht verloren gehen.
// Seit Version 3.3 darf sie schon ab dem Spätlese-Wert kommen, deshalb läuft das nur einmal bei Spielständen ohne S.edel33.
function altEdel(){
  if(S.edel33) return; S.edel33=1;
  const a=R().min.aus;
  for(const l of S.lots) if(!l.stufe&&l.edel&&!l.eis&&l.oe<a) l.edel=false;
  for(const f of Object.values(S.felder)) if(f.edel&&!f.gefroren&&f.oe<a){f.edel=false; f.edelGeprueft=false}
}
// Legt alles an, was Etappe 3 braucht. Läuft bei neuen Spielen und bei alten Spielständen.
function etappe3(n,schwer){
  Object.assign(S,{schwer,rang:0,v3:1,sieger:null,wett:null,auktion:null,sektJahr:0,exLage:{ex:1}});
  const typen=misch(['vorsicht','qualitaet','zocker']).slice(0,n), andere=misch(Object.keys(REGIONEN).filter(r=>r!==S.region));
  S.gegner=typen.map((typ,i)=>({id:i,typ,name:GEGNER_TYP[typ].name,region:i===0&&Math.random()<.3?S.region:andere[i],ha:3,geld:40000,kredit:0,ansehen:0,rang:0,gen:1,genVers:rint(1,3)}));
  neueLaeden(); S.absatz=0;
}
function zahle(b){S.geld-=b;S.jahrAus+=b}
function kassiere(b){S.geld+=b;S.jahrEin+=b;fx('kasse')}
// Großhandel: Budget des Monats zum vollen Preis, was davon noch offen ist, und der Schnitt-Faktor auf den Preis für Wein im Listenwert von w Euro.
function marktFrei(){return Math.round(MARKT_FREI+MARKT_RANG*S.rang+MARKT_EXPORT*exportStufen()+MARKT_HA*haUeber())}
// Bepflanzte Hektar über HA_FREI: daran hängen das Budget des Großhandels und die Menge der Weinhandlungen.
function haUeber(){return Math.max(0,flaecheBep()-HA_FREI)}
function marktRest(){return Math.max(0,marktFrei()-(S.absatz||0))}
function marktF(n){n=Math.max(0,n);const Q=marktFrei(),a=S.absatz||0,f=x=>x<=Q?1:Math.max(MARKT_MIN,1-(1-MARKT_MIN)*(x-Q)/(Q*MARKT_BREIT)); if(n<=0) return f(a); let s=0; for(let i=0;i<40;i++) s+=f(a+n*(i+.5)/40); return s/40}
function R(){return REGIONEN[S.region]}
function rebenGesamt(){return R().sorten.reduce((a,id)=>a+S.felder[id].reben,0)}
// Bepflanzte Hektar mit einer Nachkommastelle. Zählt für deinen Aufstieg, gekaufte Fläche allein reicht nicht.
function flaecheBep(){return Math.round(rebenGesamt()/HA_REBEN*10)/10}
const verlustSpanne=b=>VERLUST.find(v=>b>=v[0]);
// Bodenschnitt des laufenden Jahres: die Monatsenden bisher und der heutige Stand.
function bodenSchnitt(){return Math.round(((S.bodenSum||0)+S.boden)/((S.bodenN||0)+1))}
function frostPlus(){const w=S.winterFrost||0;return (w>=3?FROST_3:w>=2?FROST_2:0)+(S.spaetFrost?SPAETFROST:0)}
function rebenPreis(id){return Math.round(SORTEN[id].preis*(S.rebenF||1)*(S.rebenAng===id?1-REBEN_ANGEBOT:1)*100)/100}
// Fassraum und Flaschen schwanken jeden Monat ein wenig, höchstens um LAGER_SCHWANK.
function fassPreis(){return Math.round(FASS_PREIS*(S.fassF||1)*100)/100}
function flaschePreis(){return Math.round(FLASCHE_PREIS*(S.flaschF||1)*100)/100}
function rebenMarktText(){const p=Math.round(((S.rebenF||1)-1)*100);return (p?`Reben kosten diesen Monat ${Math.abs(p)}\u00a0% ${p<0?'weniger':'mehr'} als üblich`:'Reben kosten diesen Monat so viel wie üblich')+(S.rebenAng?`, ${SORTEN[S.rebenAng].name} gibt es im Angebot ${Math.round(REBEN_ANGEBOT*100)}\u00a0% günstiger`:'')}
// Geschätzter Jahresgewinn und die Steuer darauf. Die Kosten, die zum Monatswechsel noch abgehen, sind schon abgezogen.
function steuerSchau(){const K=kosten(), gew=Math.round(S.jahrEin-S.jahrAus-K.basis-K.loehne-K.zins);return {gew,steuer:gew>0?Math.round(gew*STEUER):0}}
function fassBelegt(){return S.lots.filter(l=>l.status==='fass').reduce((a,l)=>a+l.liter,0)}
function lotName(l){return `${l.jahrgang} ${SORTEN[l.sorte].name}${l.stufe?' '+STUFEN[l.stufe].name:''}${l.sekt?'-Sekt':''}`}
function rahmen(){return RAENGE[S.rang].rahmen}
// Ansehen gutschreiben. Die Schwierigkeit verschiebt nur Zuwächse, Abzüge bleiben gleich.
function ruhm(n){if(n>0)n=Math.max(1,Math.round(n*DIFF[S.schwer].ans));S.ansehen=Math.max(0,S.ansehen+n);return n}
function reifeFaktor(l){const L=lager(l);return l.status==='flasche'?Math.min(4,1+Math.max(0,l.flMonate-L.min)/12*L.rate):1}
function lotWert(l){
  if(l.status==='trauben') return 0;
  if(!l.stufe) return l.liter*2;
  return l.liter*STUFEN[l.stufe].preis*eisF(l)*(1+l.qp/100)*reifeFaktor(l)*sektF(l)*sternF(l.sorte)*(l.status==='fass'?.7:1);
}
function vermoegen(){return Math.round(S.geld-(S.kredit?S.kredit.rest:0)+S.ha*LANDWERT+S.maschinen.reduce((a,m)=>a+mTyp(m).preis*.5*m.zustand/100,0)+Math.min(12*marktFrei(),WEIN_WERT*S.lots.reduce((a,l)=>a+lotWert(l),0)))}
function gVerm(g){return Math.round(g.geld-g.kredit+g.ha*LANDWERT)}
function rangFuer(ab,ans,ha,verm){let r=ab;while(r<R_MAX){const n=RAENGE[r+1];if(ans>=n.ans&&ha>=n.ha&&verm>=n.verm)r++;else break}return r}
function medHtml(l){return l.med&&l.med.length?`<div class="gold" style="font-size:14px">${l.med.map(esc).join(' · ')}</div>`:''}

/* ================= Absatzwege ================= */
// Seit 7.0 (Schritt H, Maik 16.11.2026): Federweißer nimmt der Weinhändler in jeder Menge zum vollen Inlandspreis ab.
// Er zählt nicht gegen das Budget des Großhandels (S.absatz) und drückt den Preis nicht. Exporthandel gibt es für ihn nicht.
const federHandel=l=>l.stufe==='feder'&&!l.sekt;
function wege(l){
  const p=preis(l); if(!p) return [];
  if(federHandel(l)) return [{name:'Weinhändler',flag:'🍂',p}];
  const W=[{name:'Inland',flag:'🇩🇪',p}];
  if(S.rang>=R_EXPORT) W.push({name:'Exporthandel',flag:'🌍',p:Math.round(p*EXPORT_F[exportArt(l)]*S.exLage.ex*100)/100});
  return W.sort((a,b)=>b.p-a.p);
}
// Seit 7.0 wünschen sie nur, was schon geht: eine Farbe erst mit einer freien Sorte dieser Farbe, Sekt erst ab R_SEKT.
function ladenWuensche(){const fr=R().sorten.filter(sorteFrei); return ['weiss','rot','sekt','edel'].filter(w=>w==='edel'||(w==='sekt'?sektFrei():fr.some(id=>SORTEN[id].farbe===w)))}
function neueLaeden(){S.laeden={};const W=ladenWuensche();for(const r of Object.keys(REGIONEN)) if(r!==S.region) S.laeden[r]={rest:Math.round(rint(1,LADEN_MAX)*(LADEN_MENGE+LADEN_HA*haUeber())),wunsch:W[rint(0,W.length-1)]}}
function ladenOk(l){return l.status==='flasche'&&!l.regal&&preis(l)>0&&(l.sekt||STUFEN[l.stufe].rang>=3)}
// Eigene Weinhandlung ab Weinbaurat: Weine im Regal (l.regal) verkaufen sich jeden Monat von selbst, das Teuerste zuerst, bis LADEN_EIGEN Euro Listenwert.
function regalWeine(){return S.lots.filter(l=>l.regal&&l.status==='flasche')}
// n Flaschen von l ins Regal, der Rest bleibt im Lager. Von Hand (AKT.regal) oder durch den Handels-Manager (seit 7.0, Schritt E).
function regalStellen(l,n){if(n>=l.liter) l.regal=true; else{S.lots.push({...l,id:S.nextId++,liter:n,regal:true,med:(l.med||[]).slice()}); l.liter-=n}}
function ladenMonat(Z){
  if(S.rang<R_LADEN) return;
  let rest=LADEN_EIGEN, n=0, ein=0;
  for(const l of regalWeine().filter(l=>preis(l)>0).sort((a,b)=>preis(b)-preis(a))){
    const p=preis(l), k=Math.min(l.liter,Math.floor(rest/p)); if(k<=0) continue;
    l.liter-=k; rest-=k*p; n+=k; ein+=k*p*LADEN_EIGEN_F;
  }
  S.lots=S.lots.filter(l=>l.liter>0);
  if(n){ein=Math.round(ein); kassiere(ein); Z.push(`Deine Weinhandlung hat ${num(n)} Flaschen für ${eur(ein)} verkauft.`)}
}
function ladenPasst(l,r){const w=S.laeden[r].wunsch; return ladenOk(l)&&(w==='sekt'?!!l.sekt:w==='edel'?!l.sekt&&STUFEN[l.stufe].rang>=5:!l.sekt&&SORTEN[l.sorte].farbe===w)}
function ladenPreis(l,r){return Math.round(preis(l)*LADEN_AUF*100)/100}

/* ================= Wettbewerbe ================= */
function wettRang(){return S.wett&&S.wett.typ==='bund'?R_BUND:R_LAND}
function reifeBonus(l){return Math.min(12,Math.round((reifeFaktor(l)-1)*8))}
function wettFaehig(l){
  const w=S.wett; if(!w||!l||!l.stufe||l.pansch) return false;
  if(w.typ==='land') return !l.sekt&&STUFEN[l.stufe].rang>=3&&l.jahrgang===S.jahr-1&&l.status!=='trauben';
  return l.status==='flasche'&&!l.bund&&(l.sekt||STUFEN[l.stufe].rang>=3)&&l.flMonate>=lager(l).min;
}
// Ausschreibung: Feld der anderen Weingüter. ein ist der eingereichte Wein, zufall die Tagesform der Jury (bleibt beim Tauschen gleich).
function neuerWettbewerb(typ){
  const d=DIFF[S.schwer].feld, bund=typ==='bund', F=[], namen=misch(GUETER);
  for(let i=0;i<(bund?8:9);i++) F.push({name:namen[i],p:(bund?rint(20,44):i<2?rint(20,34):rint(8,26))+d});
  for(const g of S.gegner) if(bund||g.region===S.region){const t=GEGNER_TYP[g.typ];F.push({name:g.name,ki:g.id,p:rint(t.ws[0],t.ws[1])+Math.round(g.rang*(bund?1.1:.85))+(bund?4:0)+d+(REGIONEN[g.region].wettPlus||0)})}
  S.wett={typ,feld:F,ein:null,zufall:rint(-4,4)};
}
// Punkte eines Weins im laufenden Wettbewerb. Stehen beim Einreichen fest.
function wettPunkte(l){const w=S.wett;return l.qp+(w.typ==='bund'?reifeBonus(l):0)+w.zufall+(R().wettPlus||0)}
// Wertung zu Beginn des Monatswechsels nach der Ausschreibung, das Ergebnis kommt als Thema in die Zeitung.
// Medaille und Qualitätspunkte bekommt der Wein nur, wenn er noch im Keller ist. Ansehen und Preisgeld gibt es immer.
function wettAuswerten(){
  const w=S.wett, P=PREISE[w.typ], F=w.feld.map(x=>({...x})), e=w.ein, l=e&&lot(e.id), N=[], name=WETTNAME[w.typ];
  const wo=w.typ==='land'?'bei der Landesprämierung '+WO[S.region]:'beim Bundeswettbewerb';
  if(e) F.push({name:S.name,du:1,p:e.p});
  F.sort((a,b)=>b.p-a.p||(b.du||0)-(a.du||0));
  const ich=F.findIndex(x=>x.du);
  let titel='', text='';
  F.forEach((x,i)=>{x.platz=i+1; if(i<3) x.m=P[i].m});
  F.slice(0,3).forEach((x,i)=>{
    const pr=P[i];
    if(x.du){
      const r=ruhm(pr.ans), was=`+${r} Ansehen${l?`, +${pr.qp} Qualitätspunkte`:''}${pr.geld?', '+eur(pr.geld)+' Preisgeld':''}`;
      if(l){l.qp+=pr.qp; (l.med=l.med||[]).push(`${pr.m} ${name} ${S.jahr}`); if(w.typ==='bund') l.bund=true}
      ehre(pr.m,`${pr.t} ${wo}: ${e.name}`,0,was);
      if(pr.geld) kassiere(pr.geld);
      titel=`${pr.t} für ${S.name}!`;
      text=`${e.name} holt ${pr.t} ${wo}. Das bringt ${was}.${l?'':' Der Wein ist schon verkauft, die Ehre bleibt trotzdem.'}`;
      if(i===0&&S.gegner.length){const g=S.gegner[rint(0,S.gegner.length-1)]; if(GEGNER_SPRUCH[g.typ]) text+=' '+GEGNER_SPRUCH[g.typ].erfolg(g.name)}
    }else if(x.ki!=null){
      const g=S.gegner[x.ki]; g.ansehen+=pr.ans*DIFF[S.schwer].ki; g.geld+=pr.geld;
      N.push(`${g.name} holt ${pr.t}.`);
    }
  });
  if(ich<0){titel=`${name} ${S.jahr}: ${F[0].name} vorn`; text=`${F[0].name} holt ${P[0].t} ${wo}.${N.length?' '+N.join(' '):''}`}
  else if(ich>2){titel=`${name}: Platz ${ich+1} für ${S.name}`; text=`${e.name} landet auf Platz ${ich+1} von ${F.length}. Fürs Treppchen hat es diesmal nicht gereicht.${N.length?' '+N.join(' '):''}`}
  else if(N.length) text+=' '+N.join(' ');
  // Rangliste in der Zeitung: das Treppchen, dazu du und die Gegner, wenn sie dahinter landen.
  const L=F.filter((x,i)=>i<3||x.du||x.ki!=null).map(x=>({platz:x.platz,name:x.name,p:x.p,m:x.m||'',du:x.du||0}));
  schlag(ich<0?42:ich<3?78:72,titel,text,'praemierung',{archiv:1,gold:ich>=0&&ich<3?1:0,liste:L,wett:{typ:w.typ,platz:ich}});
}

/* ================= Auktionen ================= */
// Neue Auktionen gibt es nur in diesen Monaten (0 = Januar), mit dieser Wahrscheinlichkeit, frühestens nach 6 Monaten.
const AUK_MONATE=[2,3,6,10], AUK_CHANCE=.22;
function auktionHa(){const r=Math.random();return r<.4?1:r<.73?2:r<.95?3:r<.995?5:10}
function neueAuktion(spitze){
  if(spitze){const B=misch(NACHBARN).slice(0,3).map(n=>({name:n,limit:rint(64,144)*5000})); S.auktion={ha:SPITZE_HA,start:SPITZE_START,schritt:10000,gebot:SPITZE_START,fuehrer:B[rint(0,2)].name,bieter:B,ende:null,text:'',phase:0,spitze:1}; return}
  const ha=auktionHa(), start=ha*8000, B=misch(NACHBARN).slice(0,rint(2,3)).map(n=>({name:n,limit:Math.round(ha*rnd(11000,30000)/500)*500}));
  for(const g of S.gegner) if(g.region===S.region){
    const t=GEGNER_TYP[g.typ];
    B.push({name:g.name,ki:g.id,limit:Math.round(Math.min(g.geld+(g.typ==='zocker'?30000:0),ha*rnd(14000,26000)*(1+t.biet*.6))/500)*500});
  }
  const offen=B.filter(b=>b.limit>=start);
  S.auktion={ha,start,schritt:Math.max(500,Math.round(start*.1/500)*500),gebot:start,fuehrer:offen.length?offen[rint(0,offen.length-1)].name:null,bieter:B,ende:null,text:'',phase:0};
}
function aukNaechstes(){const a=S.auktion;return a.fuehrer?a.gebot+a.schritt:a.gebot}
function aukLimit(){return S.geld+rahmen()-(S.kredit?S.kredit.rest:0)}
// Der Spieler ist raus oder hat die Auktion verpasst: Die anderen machen es unter sich aus.
function aukOhneDich(){
  const a=S.auktion, B=a.bieter.filter(b=>b.limit>=a.gebot).sort((x,y)=>y.limit-x.limit);
  if(!B.length){a.ende='niemand'; return a.text=`Für den Weinberg mit ${a.ha}\u00a0Hektar ${WO[S.region]} fand sich kein Bieter.`}
  const sieger=B[0], pr=B[1]?Math.max(a.gebot,Math.min(sieger.limit,B[1].limit+a.schritt)):a.gebot;
  a.ende=sieger.name; a.gebot=pr;
  if(sieger.ki!=null){const g=S.gegner[sieger.ki]; g.geld-=pr; g.ha+=a.ha; g.ansehen+=(3+Math.min(a.ha,7))*DIFF[S.schwer].ki}
  return a.text=`${sieger.name} bekommt den Zuschlag: ${a.ha}\u00a0Hektar ${WO[S.region]} für ${eur(pr)}.`;
}
// Phase 0: angekündigt, nächsten Monat wird geboten. Text für "Das steht an", leer wenn nichts ansteht.
function aukInfo(){const a=S.auktion; return a&&a.phase===0&&S.rang>=R_AUKTION?`🔨 Nächsten Monat Auktion: ${a.ha}\u00a0Hektar, Start bei ${eur(a.start)}`:''}
// Ergebnis für den Fuß der Zeitung, im Monat nach dem Bieten.
function aukErgebnis(){
  const a=S.auktion; if(!a.ende) aukOhneDich();
  if(a.ende==='niemand') return `Für den Weinberg mit ${a.ha}\u00a0Hektar ${WO[S.region]} fand sich kein Bieter.`;
  return `Auktion ${WO[S.region]}: ${a.ende==='du'?S.name:a.ende} bekommt ${a.ha}\u00a0Hektar für ${eur(a.gebot)}.`;
}

/* ================= Ereignisse ================= */
// Rund zwei im Jahr, halb gut, halb schlecht. Nur in ruhigen Monaten: kein Wettbewerb, keine Auktion, kein Prüfer und kein großes Thema in der Zeitung.
// Je Ereignis: ok sagt, ob es gerade passen kann, los führt es aus und meldet es mit Wichtigkeit 80 in der Zeitung.
function feldHaengt(){return R().sorten.filter(id=>{const f=S.felder[id];return f.reben&&f.menge>0&&!f.gelesen})}
function kritikerWein(l){return l.status==='flasche'&&l.stufe&&STUFEN[l.stufe].rang>=3}

    mode:{ok:()=>!S.lage,los(){const id=R().sorten.slice().sort((a,b)=>eignung(b)-eignung(a))[0], f=1+rnd(.2,.4), n=rint(4,6); S.lage={typ:'mode',f,rest:n,sorte:id}; schlag(80,`${SORTEN[id].name} ist im Ausland gefragt`,`Ein Fernsehkoch schwärmt vom ${SORTEN[id].name} ${WO[S.region]}, und plötzlich wollen ihn alle. ${n} Monate lang bringt er ${Math.round((f-1)*100)}\u00a0% mehr.`,'rieslingmode')}},
    erbschaft:{ok:()=>true,los(){const b=Math.round(rint(8,20)*1000*(1+S.rang/2)/100)*100; S.geld+=b; fx('kasse'); schlag(80,'Unverhoffte Erbschaft',`Eine entfernte Großtante hat dir ${eur(b)} hinterlassen. Sie hat deinen Wein wohl heimlich gemocht. Das Geld ist steuerfrei.`,'erbschaft')}},
    kritiker:{ok:()=>S.lots.some(kritikerWein),los(){const l=S.lots.filter(kritikerWein).sort((a,b)=>b.qp-a.qp)[0], q=rint(3,5); l.qp+=q; const a=ruhm(6); schlag(80,`Kritiker lobt deinen ${lotName(l)}`,`Ein bekannter Weinkritiker hat deinen ${lotName(l)} probiert und schwärmt in seiner Kolumne. Der Wein bekommt ${q} Qualitätspunkte mehr, dazu +${a} Ansehen.`,'weinkritiker')}}

    maschine:{ok:()=>S.maschinen.length,los(){const ma=S.maschinen[rint(0,S.maschinen.length-1)], n=rint(20,40); ma.zustand=Math.max(10,ma.zustand-n); schlag(80,'Maschinenschaden',`Dein${ma.gross?' Vollernter':'e Erntemaschine'} hat einen Felsbrocken erwischt. Der Zustand sinkt um ${n} auf ${ma.zustand}\u00a0%. Eine Wartung bringt sie wieder in Schuss.`,'maschine')}},
    skandal:{ok:()=>!S.lage,los(){const f=1-rnd(.2,.35), n=rint(3,5); S.lage={typ:'skandal',f,rest:n}; schlag(80,'Weinskandal erschüttert das Land',`Ein Großhändler hat Frostschutzmittel in seinen Wein gemischt, jetzt trauen die Leute keinem Winzer mehr. ${n} Monate lang bringen alle Weine ${Math.round((1-f)*100)}\u00a0% weniger.`,'weinskandal')}},
    helferweg:{ok:()=>S.helfer>0&&S.loehne.helfer[0]<=LOHN_BILLIG&&S.geld>4000,los(){const b=clamp(Math.round(S.geld*rnd(.05,.1)/100)*100,2000,30000); S.loehne.helfer.shift(); S.helfer--; S.geld-=b; schlag(80,'Erntehelfer über alle Berge',`Dein billigster Erntehelfer ist über Nacht verschwunden, und mit ihm ${eur(b)} aus der Kasse. Ersatz findest du beim Arbeitsamt.`,'helferweg')}}

// S.erIn zählt die Monate bis zum nächsten Ereignis. Passt es gerade nicht, wartet es auf den nächsten ruhigen Monat.
function ereignisMonat(){
  if(S.erIn==null) S.erIn=rint(4,8);
  if(--S.erIn>0) return;
  if(S.wett||S.auktion||S.pruefer||(S.jahr-START_JAHR)*12+S.monat<6||TOP.some(x=>x.p>=55)) return;
  for(const s of Math.random()<.5?['gut','schlecht']:['schlecht','gut']){
    const M=Object.values(EREIGNIS[s]).filter(e=>e.ok());
    if(M.length){M[rint(0,M.length-1)].los(); S.erIn=rint(4,8); return}
  }
}

/* ================= Computer-Winzer ================= */
// Läuft einmal im Monat für jeden Gegner und liefert die Nachrichten des Monats.
// Übergabe beim Gegner: neuer Vorname aus GEGNER_ERBE, Nachname und Art bleiben. Steuer aufs Vermögen, was fehlt, wird Kredit. Gibt die Zeitungsmeldung zurück.
function gegnerErbe(g){
  const E=GEGNER_ERBE[g.typ], teile=g.name.split(' '), vor=teile.shift(), fam=teile.join(' '), alt=g.name;
  g.vornamen=(g.vornamen||[]).concat(vor);
  const frei=E.namen.filter(x=>!g.vornamen.includes(x)), vn=(frei.length?frei:E.namen)[rint(0,(frei.length?frei:E.namen).length-1)];
  const steuer=Math.max(0,Math.round(gVerm(g)*ERB_STEUER/100)*100), bar=Math.min(steuer,Math.max(0,g.geld));
  g.geld-=bar; g.kredit+=steuer-bar; g.ansehen*=ERB_ANSEHEN;
  g.name=vn+' '+fam; g.gen=(g.gen||1)+1; g.genVers=rint(1,3);
  return E.text(alt,vn,WO[g.region]);
}
function gegnerMonat(){
  const N=[], m=S.monat, st0=DIFF[S.schwer].ki, neu=(p,t)=>N.push({p,t});
  for(const g of S.gegner){
    const t=GEGNER_TYP[g.typ], wo=WO[g.region], heim=g.region===S.region;
    // Angeregte Kontrolle: Der Prüfer kommt. g.pansch zählt die Monate, in denen er gepanschten Wein finden würde.
    if(g.angeregt){
      g.angeregt=0;
      if(g.pansch>0){const st=Math.max(STRAFE_MIN,Math.round(g.geld*.15/100)*100); g.pansch=0; g.geruecht=false; g.ansehen=Math.max(0,g.ansehen-ANREG_ANS); g.geld-=st; schlag(64,`Panscherei bei ${g.name} aufgeflogen`,`Auf deinen Hinweis hin hat der Prüfer den Keller von ${g.name} ${wo} durchsucht und gepanschten Wein gefunden. Das kostet ${eur(st)} Strafe und ${ANREG_ANS} Ansehen.`,'kontrolle',{archiv:1})}
      else{ruhm(-ANREG_FEHL); schlag(64,`Kontrolle bei ${g.name} ohne Befund`,`Der Prüfer hat bei ${g.name} ${wo} nichts gefunden. Dass der Hinweis von dir kam, hat sich herumgesprochen. Das kostet dich ${ANREG_FEHL} Ansehen.`,'kontrolle',{archiv:1})}
    }
    if(g.pansch>0&&--g.pansch<=0) g.geruecht=false;
    // Auch die Gegner fangen mit kahlem Weinberg an: Jahr 1 bringt 20 %, Jahr 2 60 %, danach voll.
    if(m===0) g.jahre=(g.jahre||0)+1;
    // Schritt G 7.0: Generationswechsel ein bis drei Jahre nach deinem, nach denselben Regeln.
    if(m===0&&S.jahr-START_JAHR>=GEN_JAHRE*(g.gen||1)+(g.genVers||1)) neu(9,gegnerErbe(g));
    const auf=Math.min(1,.2+.4*((g.jahre||0)-1));
    // Aufstiegstempo: Die Gegner fangen gemütlich an und werden über die Jahre stärker.
    const st=st0*(GEGNER_START+(GEGNER_ENDE-GEGNER_START)*clamp(((g.jahre||1)-1)/GEGNER_JAHRE,0,1));
    if(m===0){
      // g.schaden: Anteil der Ernte, den eine Sabotage im Vorjahr gekostet hat.
      // Schritt 3 (6.0): Das Gebiet wirkt über regionF auf das Einkommen, wie bei dir über Preis, Lese-Menge, Sekt und Sterne.
      const gew=Math.round(g.ha*rnd(t.eink[0],t.eink[1])*st*auf*(1-(g.schaden||0))*regionF(g.region)/100)*100; g.schaden=0;
      // Auch die Gegner zahlen Steuer auf den Jahresgewinn und pflanzen nach, sobald ihr Weinberg voll trägt.
      g.geld+=gew-(gew>0?Math.round(gew*STEUER/100)*100:0)-(auf===1?g.ha*GEGNER_ABNUTZ:0);
      if(gew>0&&auf===1) g.ansehen+=2*st;
      if(gew<0) neu(3,`${g.name} hat sich verkalkuliert und schließt das Jahr mit Verlust ab.`);
      else if(auf===1&&gew>g.ha*(t.eink[0]+(t.eink[1]-t.eink[0])*.9)*st) neu(1,`${g.name} meldet ein Rekordjahr.`);
      if(g.kredit>0&&g.geld>0){const r=Math.min(g.kredit,Math.round(g.geld*.5)); g.geld-=r; g.kredit-=r; if(!g.kredit) neu(2,`${g.name} ist bei der Bank wieder schuldenfrei.`)}
    }
    // Kälteeinbruch im November: trifft, wer noch Trauben hängen hat. Die Vorsichtige hat meist schon gelesen. Hat die Vorhersage gewarnt, lesen fast alle vorher.
    if(m===10&&S.kaelte===S.jahr&&auf>.2&&(g.poker||Math.random()<(g.typ==='vorsicht'?.2:.6)*(S.kaelteWarn===S.jahr?.3:1))){g.geld-=g.ha*(g.poker?2500:1500); g.poker=false; neu(3,`Kälteeinbruch ${wo}: Bei ${g.name} ist erfroren, was noch hing.`)}
    // Gefälschtes Kellerbuch (Sabotage des Spielers): g.falsch zählt die Monate bis zur Kontrolle beim Gegner.
    if(g.falsch&&--g.falsch<=0){g.falsch=0; g.ansehen=Math.max(0,g.ansehen-20); g.geld-=Math.max(10000,Math.round(g.geld*.15)); neu(6,`Weinkontrolle bei ${g.name}: Im Kellerbuch steht gepanschter Wein. Das kostet Strafe und Ansehen.`)}
    if(m===1&&g.jahre){g.ansehen+=rnd(t.ans[0],t.ans[1])*st*auf; if(Math.random()<.5) neu(1,`${g.name} meldet im Rathaus ${t.weine[rint(0,t.weine.length-1)]} an.`)}
    if(m===2&&!heim&&auf===1&&Math.random()<t.med*st){const P=PREISE.land[rint(0,2)]; g.ansehen+=P.ans*st; neu(4,`${g.name} holt ${P.t} bei der Landesprämierung ${wo}.`)}
    if(!heim&&Math.random()<1/18){
      const ha=auktionHa(), pr=Math.round(ha*rnd(12000,26000)/500)*500;
      if(g.geld+(g.typ==='zocker'?30000:0)>=pr&&Math.random()<t.biet*st){g.geld-=pr; g.ha+=ha; g.ansehen+=(3+Math.min(ha,7))*st; neu(4,`${g.name} ersteigert ${ha}\u00a0Hektar ${wo}.`)}
    }
    // Panschen im Oktober: Zocker oft, die anderen selten. Mal fliegt es gleich auf, sonst bleibt es eine Weile im Keller, manchmal mit Gerücht.
    if(m===9&&Math.random()<PANSCH[g.typ]){
      if(Math.random()<.35){g.ansehen=Math.max(0,g.ansehen-20); g.geld-=Math.round(Math.max(2000,g.geld*.1)); neu(5,`Weinkontrolle bei ${g.name}: gepanschter Wein gefunden. Das kostet Strafe und Ansehen.`)}
      else{g.geld+=g.ha*(g.typ==='zocker'?2500:1000); g.pansch=rint(6,14); if(Math.random()<.4){g.geruecht=true; neu(8,`Man munkelt, bei ${g.name} werde heimlich nachgezuckert.`)}}
    }
    if(g.typ==='zocker'){
      if(!g.kredit&&Math.random()<.04){const k=12000*(g.rang+1); g.geld+=k; g.kredit=Math.round(k*1.2); neu(2,`${g.name} nimmt einen Kredit über ${eur(k)} auf.`)}
      if(m===9){
        if(S.kaelteWarn!==S.jahr&&Math.random()<.35*Math.min(1,REGIONEN[g.region].frost/.3)){g.poker=true; neu(2,`${g.name} pokert auf Eiswein und lässt alles hängen.`)}
      }
      if(m===11&&g.poker){
        g.poker=false;
        if(Math.random()<REGIONEN[g.region].frost){g.ansehen+=8*st; g.geld+=g.ha*3000; neu(3,`Frost ${wo}: Der Eiswein-Poker von ${g.name} geht auf.`)}
        else{g.geld-=g.ha*2500; neu(3,`Kein Frost ${wo}: ${g.name} verliert einen Teil der Ernte.`)}
      }
    }else if(m===8&&Math.random()<.3) neu(0,g.typ==='vorsicht'?`${g.name} liest früh und geht kein Risiko ein.`:`${g.name} lässt die Trauben für eine Auslese hängen.`);
    if(g.geld<0){g.kredit+=Math.round(-g.geld*1.15); g.geld=0}
    const alt=g.rang; g.rang=rangFuer(g.rang,g.ansehen,g.ha,gVerm(g));
    if(g.rang>alt){
      neu(9,`${g.name} steigt auf und ist jetzt ${RAENGE[g.rang].name}.`);
      if(alt<=S.rang&&g.rang>S.rang&&GEGNER_SPRUCH[g.typ]) neu(9,GEGNER_SPRUCH[g.typ].vorbei(g.name));
      if(g.rang===R_MAX&&!S.sieger) gegnerSieg(g,wo);
    }
  }
  N.sort((a,b)=>b.p-a.p);
  return N.filter((n,i)=>n.p>=9||i<3).map(n=>n.t);
}
function leistung(){return S.helfer*HELFER_LEISTUNG+S.maschinen.reduce((a,m)=>a+Math.round(mTyp(m).leist*m.zustand/100),0)}
function leseFaktor(){const b=rebenGesamt();return b?Math.min(1,leistung()/b):1}
// Leute-Regel: Gezählt werden Köpfe, der Zustand einer Maschine spielt hier keine Rolle (der wirkt nur auf die Ernteleistung bei der Lese).
function helferKraft(){return S.helfer+maschHelfer()}
function helferBedarf(){return Math.ceil(rebenGesamt()/REBEN_JE_HELFER)}
function lagerBedarf(){return Math.max(Math.ceil(S.fassraum/FASS_JE_LAGERARB),Math.ceil(S.flaschen/FLASCHEN_JE_LAGERARB))}
function leuteFehlen(){return {helfer:Math.max(0,helferBedarf()-helferKraft()),lagerarb:Math.max(0,lagerBedarf()-S.lagerarb)}}
// "Es fehlen 2 Erntehelfer und 1 Lagerarbeiter" oder leer, wenn niemand fehlt.
function fehlText(){
  const f=leuteFehlen(), t=[];
  if(f.helfer) t.push(`${f.helfer} Erntehelfer`);
  if(f.lagerarb) t.push(`${f.lagerarb} Lagerarbeiter`);
  return t.length?`${f.helfer+f.lagerarb===1?'Es fehlt':'Es fehlen'} ${t.join(' und ')}`:'';
}
// Löhne: Das Arbeitsamt bietet jeden Monat einen neuen Monatslohn zwischen LOHN_MIN und LOHN_MAX, getrennt für Erntehelfer und Lagerarbeiter.
// Wer eingestellt ist, behält seinen Lohn. S.loehne merkt ihn je Kopf, aufsteigend sortiert. Entlassen wird immer der teuerste.
const LOHN_ARTEN=['helfer','lagerarb'];
function neuesLohnAngebot(){S.angebot={};for(const k of LOHN_ARTEN) S.angebot[k]=rint(LOHN_MIN/10,LOHN_MAX/10)*10}
function lohnSumme(k){return S.loehne[k].reduce((a,b)=>a+b,0)}
function lohnListe(k){const z=new Map();for(const n of S.loehne[k]) z.set(n,(z.get(n)||0)+1);return [...z].map(([n,c])=>`${c} × ${eur(n)}`).join(', ')}
const lohnLage=n=>n<=250?'günstig':n>=450?'teuer':'normal';
// Bringt die Lohnliste auf die Zahl der Angestellten. Alte Spielstände ohne Lohnliste bekommen den Startlohn.
function lohnAbgleich(){
  if(!S.loehne) S.loehne={helfer:[],lagerarb:[]};
  for(const k of LOHN_ARTEN){const a=S.loehne[k]; while(a.length<S[k]) a.push(LOHN_START); a.length=S[k]; a.sort((x,y)=>x-y)}
  if(!S.angebot) neuesLohnAngebot();
}
function kosten(){const k=S.kredit;return {basis:150+HA_KOSTEN_KLEIN*Math.min(S.ha,HA_FREI)+HA_KOSTEN*Math.max(0,S.ha-HA_FREI),loehne:lohnSumme('helfer')+lohnSumme('lagerarb')+mgrLohn(),tilgung:k?Math.min(k.rest,k.tilgung):0,zins:k?Math.round(k.rest*ZINS/12):0}}
function schulden(){return (S.kredit?S.kredit.rest:0)+Math.max(0,-S.geld)}
// Version 5.1 (Paket 10): Die SEKT_ANS Ansehen gibt es einmal im Jahr, sobald zusammen SEKT_ANS_HA Flaschen je bepflanztem Hektar versektet sind, mindestens für HA_FREI Hektar.
const SEKT_ANS=3, SEKT_ANS_HA=200;
// Version 6.0: Sekt nur aus Qualitätswein und Kabinett. Sekt bringt das 1,6-fache, Sekt-Stars (sektStar in SORTEN) dazu SEKT_STAR.
// Sekt aus höheren Stufen in alten Spielständen bleibt, wie er ist.
const SEKT_F=1.6, SEKT_STAR=1.1, SEKT_STUFEN=['qba','kab'];
// Schritt 3: dazu sektPreisF des Gebiets aus REGIONEN (ohne Eintrag 1). Der Name ist nicht sektF, weil es diese Funktion schon gibt.
function sektF(l){return l.sekt?SEKT_F*(SORTEN[l.sorte].sektStar?SEKT_STAR:1)*(R().sektPreisF||1):1}
// Schritt 3: Faktor des Gebiets auf das Jahreseinkommen der Gegner. preisF und ertragF voll, Sterne mit ★★★ (ihre beste Sorte),
// sektPreisF nur auf den Anteil GEGNER_SEKT, weil Sekt beim Test-Spieler rund 6 bis 14 % der Einnahmen bringt (Messung Schritt 2).
const GEGNER_SEKT=.1;
function regionF(id){const r=REGIONEN[id]; return (r.preisF||1)*(r.ertragF||1)*(1+GEGNER_SEKT*((r.sektPreisF||1)-1))*STERN_PREIS_3}
function sektSchwelle(){return Math.round(SEKT_ANS_HA*Math.max(HA_FREI,flaecheBep()))}
function sektMenge(){if(!S.sektMenge||S.sektMenge.j!==S.jahr) S.sektMenge={j:S.jahr,n:0}; return S.sektMenge}
function sektAnsText(){if(S.sektJahr===S.jahr) return `Die ${SEKT_ANS} Ansehen für Sekt hast du dieses Jahr schon.`; const r=sektSchwelle()-sektMenge().n; return `Ab ${num(sektSchwelle())} Flaschen Sekt im Jahr gibt es ${SEKT_ANS} Ansehen, dieses Jahr fehlen noch ${num(Math.max(0,r))}.`}
// n Flaschen aus l zu Sekt machen, von Hand (AKT.sekt) oder durch den Kellermeister (seit 7.0, Schritt E). Zählt zur Sekt-Schwelle, außer gepanscht.
function versekten(l,n){zahle(n*SEKT_KOSTEN);S.lots.push({...l,id:S.nextId++,liter:n,sekt:true,flMonate:0,qp:l.qp+5,med:(l.med||[]).slice(),bund:false});l.liter-=n;if(l.liter<=0)S.lots=S.lots.filter(x=>x!==l);if(!l.pansch){const m=sektMenge(); m.n+=n; if(S.sektJahr!==S.jahr&&m.n>=sektSchwelle()){S.sektJahr=S.jahr;ruhm(SEKT_ANS)}}}
function sektFaehig(l){return sektFrei()&&l.status==='flasche'&&!l.regal&&!l.sekt&&SEKT_STUFEN.includes(l.stufe)&&l.flMonate>=lagerBasis(l).min}
function dot(id){return `<i class="dot ${SORTEN[id].farbe==='weiss'?'weiss':'rotw'}"></i>`}

/* ================= Wetter ================= */
function wuerfelWetter(m){
  const r=Math.random(), fr=R().frost;
  let t;
  if(m===11||m<=1) t=[['frost',fr],['kalt',.4],['regen',.2],['mild',1]];
  else if(m===10) t=[['kalt',.45],['regen',.3],['mild',1]];
  else if(m===3) t=[['frost',.1],['kalt',.1],['regen',.3],['sonnig',.2],['mild',1]];
  else if(m===2||m===4) t=[['frost',.03],['kalt',.1],['regen',.3],['sonnig',.2],['mild',1]];
  else if(m<=7) t=[['sonnig',.5],['regen',.2],['mild',1]];
  else t=[['sonnig',.3],['regen',.3],['kalt',.05],['mild',1]];
  let s=0; for(const [w,p] of t){s+=p; if(r<s) return w}
  return 'mild';
}
// Kälteeinbruch im November (KAELTE): wird schon mit der Vorhersage im Oktober ausgewürfelt, damit sie davor warnen kann. Sie trifft wie sonst in 75 % der Fälle.
// S.kaelte merkt das Jahr des Kälteeinbruchs, S.kaelteVor das Jahr, in dem schon gewürfelt ist, S.kaelteWarn das Jahr mit Warnung in der Vorhersage.
function neuePrognose(){
  const n=(S.monat+1)%12; S.wetterNext=wuerfelWetter(n);
  if(n===10){S.kaelte=Math.random()<KAELTE?S.jahr:0; S.kaelteVor=S.jahr; if(S.kaelte) S.wetterNext='frost'}
  S.prognose=Math.random()<.75?S.wetterNext:n===10&&Math.random()<KAELTE?'frost':wuerfelWetter(n);
  if(n===10) S.kaelteWarn=S.prognose==='frost'?S.jahr:0;
}
// Vorhersage als Text, Frost im November heißt Kälteeinbruch.
const progText=()=>(S.monat+1)%12===10&&S.prognose==='frost'?'❄️ Kälteeinbruch':WETTER[S.prognose].join(' ');
const wbonus=w=>({sonnig:5,mild:0,regen:-4,kalt:-3,frost:-3}[w]);
// Temperatur: Gradzahl passend zu Monat und Wetter, nur zur Anzeige. Frost liegt immer unter null, alles andere bei mindestens 1 °C.
// S.temp merkt die gewürfelte Zahl des Monats. Fehlt sie (alte Spielstände, Spielstart), gilt der Wert ohne Streuung.
const TEMP_MONAT=[2,3,7,11,15,18,20,20,16,11,6,3], TEMP_WETTER={sonnig:4,mild:0,regen:-2,kalt:-5};
function tempFuer(m,w,streu){
  if(w==='frost') return (m>=2&&m<=4?-2:-4)+(streu?rint(-2,1):0);
  return Math.max(1,TEMP_MONAT[m]+TEMP_WETTER[w]+Math.round((R().warm||0)/7)+(streu?rint(-1,1):0));
}
const wetterText=()=>`${WETTER[S.wetter].join(' ')}, ${S.temp!=null?S.temp:tempFuer(S.monat,S.wetter)} °C`;

/* ================= Wachstum ================= */
// Öchsle: Startwert im Juli, Zuwachs August bis Dezember, Zuschlag je Monat mit Edelfäulnis.
// Im November trocknen die Beeren ein: Die Menge schrumpft, der Zucker steigt deshalb noch einmal kräftig.
// Edelfäulnis (seit 3.3): Ab Oktober kann sie jeden Monat kommen, sobald ein Feld den Spätlese-Wert erreicht, mit EDEL_CHANCE.spat, bei Regen oder mildem Wetter mit .feucht.
// Ab dem Auslese-Wert (auch schon im August und September) kommt sie mit .aus. Bleibt sie dort aus, kommt sie dieses Jahr nicht mehr (f.edelGeprueft).
// Die Chance gilt für die Sorte, die am besten zum Gebiet passt. Die anderen bekommen sie mal Eignung hoch zwei, warme Gebiete mit edelF öfter.
// Version 5.0 (Paket 8): In kühlen Gebieten (edelAus) kommt sie erst ab dem Auslese-Wert, in der Mitte (edelSpatF) unter dem Auslese-Wert nur mit halber Chance.
// So bleiben dort Kabinett und Spätlese öfter heil. Warme Gebiete bleiben wie seit 3.3.
// Ihr Zuschlag je Monat hängt an der Zahl der Sonnenmonate des Jahres (Juni bis Oktober), EDEL_PLUS[0] bis EDEL_PLUS[5].
// Abgestimmt 15.11.2026 mit 4000 Jahrgängen je Gebiet: Edelfäulnis bis November bei der besten Sorte in rund 75 % der Jahre (warm 85 %, kühl 68 %), bei den anderen rund 50 und 38 %.
// Beerenauslese aufwärts (beste Sorte, Lese im Oktober bei Kältewarnung, sonst im November): warm 37 %, Mitte 27 %, kühl 18 %. Eiswein möglich: warm 6 %, Mitte 16 %, kühl 27 %.
// Beste Sorte im Oktober: normales Jahr um 89°, Sonnenjahr um 100°.
const OE_START=49, OE_PLUS=[14,14,12,15,4], EDEL_PLUS=[8,11,14,19,25,30], EDEL_CHANCE={spat:.35,feucht:.5,aus:.82};
const edelBonus=()=>EDEL_PLUS[Math.min(5,S.sonne)]+(R().edelPlus||0);
function wachse(m){
  const reg=R(), L=[];
  // Kälteeinbruch: In jedem vierten November (KAELTE) erfriert alles, was noch hängt. In allen Gebieten gleich, gewürfelt schon mit der Vorhersage im Oktober (neuePrognose).
  // Alte Spielstände ohne S.kaelteVor würfeln hier. S.kaelte merkt das Jahr, damit es auch die Gegner trifft.
  if(m===10){if(S.kaelteVor!==S.jahr) S.kaelte=Math.random()<KAELTE?S.jahr:0; if(S.kaelte===S.jahr&&S.wetter!=='frost'){S.wetter='frost'; S.temp=tempFuer(10,'frost',true)}}
  const w=S.wetter;
  if(w==='sonnig'&&m>=5&&m<=9) S.sonne++;
  for(const id of reg.sorten){
    const f=S.felder[id], so=SORTEN[id]; if(!f.reben) continue;
    if((m===3||m===4)&&w==='frost'){f.frostF=.7; L.push(`Spätfrost schädigt die Blüte beim ${so.name}.`)}
    if(m===5) f.menge=Math.round((f.reben-f.jung+f.jung*.5)*so.ertrag*(reg.ertragF||1)*(.6+.4*S.boden/100)*f.frostF*rnd(.9,1.1));
    if(m===6){f.oe=OE_START+zuckerIm(id)+reg.warm+wbonus(w)+rint(-2,2)+(S.spitze?SPITZE_OE:0); f.reif=5; f.ueber=0; f.plus=0}
    if(m>=7&&f.menge>0&&!f.gelesen){
      // f.plus merkt den Öchsle-Zuwachs des Monats für die Infoseite.
      const vor=f.oe;
      f.oe=Math.min(150,f.oe+OE_PLUS[m-7]+wbonus(w)+rint(-2,2)+(f.edel?edelBonus():0)); f.plus=f.oe-vor;
      if(f.edel) f.menge=Math.round(f.menge*.8);
      f.reif=clamp([35,70,92,100,100][m-7]+(w==='sonnig'?5:w==='regen'?-5:0),0,100);
      f.ueber=clamp([0,5,20,45,70][m-7]+(w==='sonnig'?5:0),0,100);
      if(m===9&&w==='regen') f.menge=Math.round(f.menge*.9);
      if(m===10){
        if(S.kaelte===S.jahr){f.menge=0; L.push(`Kälteeinbruch! Die hängenden ${so.name}-Trauben sind erfroren.`)}
        else f.menge=Math.round(f.menge*(w==='regen'?.7:.85));
      }
      if(m===11){
        if(w==='frost'){f.gefroren=true; f.menge=Math.round(f.menge*.6); L.push(`Frost! Der ${so.name} hängt gefroren am Stock. Eiswein ist möglich.`)}
        else{f.menge=0; L.push(`Kein Frost: Die hängenden ${so.name}-Trauben sind verfault.`)}
      }
      const aus=f.oe>=reg.min.aus;
      if(f.menge>0&&!f.edel&&!f.edelGeprueft&&(aus||(!reg.edelAus&&m>=9&&f.oe>=reg.min.spat))){
        f.edel=Math.random()<Math.min(.95,(aus?EDEL_CHANCE.aus:(w==='regen'||w==='mild'?EDEL_CHANCE.feucht:EDEL_CHANCE.spat)*(reg.edelSpatF||1))*(reg.edelF||1)*eignung(id)**2);
        if(f.edel) L.push(`Edelfäulnis beim ${so.name} bei ${f.oe}° Öchsle! Der Zucker steigt jetzt ${S.sonne>=3?'kräftig':'schneller'}, die Menge schrumpft. Kabinett und Spätlese gibt es von diesem Feld nicht mehr.${aus?'':` Bis zur Auslese fehlen noch ${reg.min.aus-f.oe}°, lass die Trauben am besten noch einen Monat hängen.`}`);
        else if(aus){f.edelGeprueft=true; L.push(`Der ${so.name} hat den Auslese-Wert von ${reg.min.aus}° erreicht, aber die Edelfäulnis bleibt dieses Jahr aus.`)}
      }
    }
  }
  return L;
}
function feldReset(f){Object.assign(f,{oe:0,plus:0,menge:0,reif:0,ueber:0,edel:false,edelGeprueft:false,gelesen:false,teil:false,gefroren:false,frostF:1})}

/* ================= Weinstufen ================= */
function mindest(st){const m=R().min; return (st==='feder'||st==='eis')?m.tafel:m[st]}
// q = {oe, leseart, edel, eis}
function pruefeQualitaet(st,q){
  const g=[], d=STUFEN[st], min=mindest(st);
  if(q.oe<min) g.push(`es fehlen ${min-q.oe}° Öchsle (Minimum ${min}°)`);
  if(st==='eis'){
    if(!q.eis) g.push('nur aus gefrorenen Trauben der Dezember-Lese');
    if(!q.edel) g.push('Edelfäulnis fehlt');
    // Wie im Handbuch: reife oder überreife Trauben, aber nicht beides zusammen.
    if(q.leseart==='alles') g.push(`Leseart muss „${LESE.reif}“ oder „${LESE.ueber}“ sein`);
  }else{
    if(d.rang>=3&&q.eis) g.push('aus der Dezember-Lese gibt es nur Tafelwein, Qualitätswein oder Eiswein');
    if(d.lese&&q.leseart!==d.lese) g.push(`Leseart muss „${LESE[d.lese]}“ sein`);
    if(d.edel===true&&!q.edel) g.push('Edelfäulnis fehlt');
    if(d.edel===false&&q.edel) g.push('Trauben mit Edelfäulnis sind dafür nicht zugelassen');
  }
  return g;
}
function pruefeAnmeldung(l,st){
  const g=pruefeQualitaet(st,l), d=STUFEN[st];
  if(l.fassMonate<1) g.push('muss mindestens einen Monat im Fass liegen');
  if(st==='feder'&&l.fassMonate>1) g.push('nur im Monat nach der Lese möglich');
  if(d.rang>=3&&d.rang<=7&&S.jahr<=l.jahrgang) g.push('frühestens im Januar nach der Lese');
  if(st==='eis'&&!(S.monat===0&&S.jahr===l.jahrgang+1)) g.push('nur im Januar nach der Lese');
  if(d.geb&&d.geb>S.geld) g.push(`Gebühr von ${eur(d.geb)} nicht bezahlbar`);
  return g;
}
const REIHE=['tafel','qba','kab','spat','aus','ba','tba','eis'];
function besteStufe(q){let b=null; for(const st of REIHE) if(!pruefeQualitaet(st,q).length) b=st; return b}
function eisStufe(oe){const m=R().min; return oe>=m.tba?2:oe>=m.ba?1:0}
const eisF=l=>l.stufe==='eis'?EIS_WERT[l.eisW||0].f:1;
// Name der Stufe für die Lese-Hilfe, beim Eiswein mit seiner Wertstufe.
const stufeText=(st,oe)=>STUFEN[st].name+(st==='eis'?` (Öchsle einer ${EIS_WERT[eisStufe(oe)].name})`:'');
function feldQ(f,la){return {oe:Math.min(150,f.oe+(la==='ueber'?5:0)),leseart:la,edel:f.edel,eis:f.gefroren}}
// Version 4.4: ungefährer Listenwert einer Lese als Flaschenwein der Stufe st, ohne Reife und Marktlage.
function leseWert(id,la,st,liter){const q=feldQ(S.felder[id],la), qp=qpFuer({sorte:id,oe:q.oe,sonne:S.sonne,boden:S.boden},st);
  return Math.round(liter*STUFEN[st].preis*(st==='eis'?EIS_WERT[eisStufe(q.oe)].f:1)*(1+qp/100)*sternF(id)*(R().preisF||1)/100)*100}
function feldLiter(f,la){const r=f.reif/100,u=f.ueber/100; return Math.round(f.menge*r*(la==='reif'?1-u:la==='ueber'?u:1)*leseFaktor())}
// Ab wann ein Wein frühestens verkauft werden darf, wenn er jetzt gelesen wird.
// Gekeltert wird im Lesemonat, nach einem Monat im Fass darf er angemeldet und abgefüllt werden, ab Kabinett und beim Eiswein erst im Januar.
// Danach muss er die Mindestzeit aus lagerBasis in der Flasche liegen. n zählt die Monate ab jetzt.
// Version 5.0: Edelfäulnis-Regel des Gebiets als kurzer Text (kühl erst ab Auslese, Mitte vorher selten).
function edelRegel(){const r=R(), m=r.min; return r.edelAus?`Edelfäulnis kommt hier erst ab dem Auslese-Wert von ${m.aus}°, dann meist`:r.edelSpatF?`Edelfäulnis kann ab Oktober ab ${m.spat}° kommen, aber selten, ab ${m.aus}° meist`:`Edelfäulnis kann ab Oktober ab ${m.spat}° kommen, bei Regen oder mildem Wetter öfter, ab ${m.aus}° meist`}
const inMonaten=n=>{const t=S.monat+n; return `${MON[t%12]} ${S.jahr+Math.floor(t/12)}`};
function verkaufAb(sorte,st){
  const abf=STUFEN[st].rang>=3?12:S.monat+1, t=abf+lagerBasis({sorte,stufe:st}).min, n=t-S.monat;
  return `⏳ verkaufsfertig frühestens ${MON[t%12]} ${S.jahr+Math.floor(t/12)} (in ${n} ${n===1?'Monat':'Monaten'})`;
}
// Übersicht im Kellerbuch: was jede Stufe braucht und wie lange sie in der Flasche reifen muss, mit den Zahlen der eigenen Region.

// Was gefrorenen Trauben für Eiswein fehlt (ohne die Leseart, die wählt man beim Lesen).
function eisFehlt(f){const g=pruefeQualitaet('eis',feldQ(f,'reif')).filter(x=>!x.startsWith('Leseart')); return g.length?`<b>Kein Eiswein:</b> ${g.join(', ')}`:''}
// Wie oft es im eigenen Gebiet im Dezember friert, für Lese und Weinqualität.
const frostText=()=>`❄️ Frost im Dezember gibt es im Gebiet ${R().name} in rund ${Math.round(R().frost*100)}\u00a0% der Jahre`;
function leseHilfe(f){
  let best=null,bla=null;
  for(const la of ['alles','reif','ueber']){const b=besteStufe(feldQ(f,la)); if(b&&(!best||STUFEN[b].rang>STUFEN[best].rang)){best=b;bla=la}}
  let h=best?`<b>Jetzt möglich:</b> ${stufeText(best,feldQ(f,bla).oe)}${STUFEN[best].lese||best==='eis'?'':' (jede Leseart)'}${STUFEN[best].lese?` (Leseart: ${LESE[bla]})`:''}${best==='eis'?' (Leseart: nur reife oder nur überreife Trauben, nicht beides zusammen)':''}`:'<b>Jetzt möglich:</b> noch nichts, der Zucker reicht nicht';
  if(f.gefroren){const e=best==='eis'?'':eisFehlt(f); return h+(e?'<br>'+e:'')}
  const rang=best?STUFEN[best].rang:0;
  const ziel=['tafel','qba','kab','spat','aus','ba','tba'].find(st=>STUFEN[st].rang>rang);
  if(ziel){
    const la=STUFEN[ziel].lese||'alles', g=pruefeQualitaet(ziel,feldQ(f,la)).filter(x=>!x.startsWith('Leseart'));
    h+=`<br><b>Nächste Stufe:</b> ${STUFEN[ziel].name}`+(g.length?`. Dafür: ${g.join(', ')}`:` mit Leseart „${LESE[la]}“`);
    if(STUFEN[ziel].lese&&g.length) h+=`, Leseart „${LESE[la]}“`;
  }
  return h;
}

/* ================= Lagerung und Preis ================= */
function lager(l){const b=lagerBasis(l);return l.sekt?{min:9,max:b.max,rate:b.rate}:b}
function lagerBasis(l){
  // Seit 7.0 (Schritt E) zählt der Kellermeister auf Stufe 3 wie ein Stück Kellerausbau dazu (mgrReife, bis Schritt H neutral).
  const so=SORTEN[l.sorte], mr=mgrReife(), K=(S.keller||0)+mr.min, rf=so.reife*(1+KELLER_REIFE*(S.keller||0)+mr.rate);
  if(l.stufe==='feder') return {min:0,max:3,rate:0};
  if(l.stufe==='tafel'||l.stufe==='qba') return {min:2,max:Math.max(24,Math.round(so.maxL/3)),rate:rf/2};
  if(l.stufe==='eis') return {min:Math.max(1,Math.round(so.minL*1.5)-K),max:Infinity,rate:rf};
  return {min:Math.max(1,so.minL-K),max:so.maxL,rate:rf};
}
// Ein Weinskandal drückt alle Preise, eine Mode im Ausland hebt eine Sorte. S.lage={typ,f,rest,sorte}.
function lageF(l){const g=S.lage; return !g?1:g.typ==='mode'?(l.sorte===g.sorte?g.f:1):g.f}
function preis(l){
  if(l.status!=='flasche') return 0;
  const L=lager(l); if(l.flMonate<L.min) return 0;
  const alter=Math.min(4,1+(l.flMonate-L.min)/12*L.rate);
  return Math.round(STUFEN[l.stufe].preis*eisF(l)*(1+l.qp/100)*alter*S.markt*lageF(l)*sektF(l)*sternF(l.sorte)*(R().preisF||1)*100)/100;
}

function flauteKopf(){
  const m=S.monat, V=[[FLAUTE[m],FLAUTE_TEXT[m]],...FLAUTE_MEHR[m]];
  let i=rint(0,V.length-1); if(S.flauteZ===m*10+i) i=(i+1)%V.length; S.flauteZ=m*10+i;
  return {p:0,t:V[i][0],text:V[i][1],bild:''};
}

// Platzhalter in den Dorf- und Rubrik-Texten: {gut}, {wo}, {nachbar}, {gegner} und {er} (sie oder er, passend zum Gegner).
function fuelle(x){
  const g=S.gegner&&S.gegner.length?S.gegner[rint(0,S.gegner.length-1)]:null;
  return x.replace(/\{gut\}/g,S.name).replace(/\{wo\}/g,WO[S.region]).replace(/\{nachbar\}/g,()=>NACHBARN[rint(0,NACHBARN.length-1)])
    .replace(/\{gegner\}/g,g?g.name:'ein Nachbar').replace(/\{er\}/g,g&&g.typ==='vorsicht'?'sie':'er');
}
function dorf(k){
  S.gesch=S.gesch||{}; if(S.gesch[k]||!DORF[k]) return; S.gesch[k]=1;
  schlag(45,'🏘️ '+DORF[k][0],fuelle(DORF[k][1]));
}

// Zum Januar: Ankündigung GEN_VORAUS Jahre vorher, Erinnerung ein Jahr vorher, dann die Übergabe.
function generationMonat(Z){
  if(S.monat!==0) return;
  const j=S.jahr-START_JAHR, n=genNr();
  if(j===GEN_JAHRE*n-GEN_VORAUS) schlag(68,`In ${GEN_VORAUS} Jahren übernimmt die nächste Generation`,`Die Jahre am Hang hinterlassen Spuren. Im Januar ${genJahr(n)} übergibst du ${S.name} an dein Kind. Bleiben wird alles, was du aufgebaut hast: Fläche, Reben, Keller, Wein, Maschinen, Leute, Manager und dein Rang. Vom Ansehen nimmt die nächste Generation ${pz(ERB_ANSEHEN)} mit, und das Finanzamt verlangt ${pz(ERB_STEUER)} vom Vermögen als Erbschaftssteuer, nach heutigem Stand rund ${eur(erbSchaetzung())}. Reicht das Geld nicht, leiht die Bank den Rest, auch über den Kreditrahmen hinaus.`,GEN_BILD.uebergabe);
  else if(j===GEN_JAHRE*n-1) Z.push(`👪 Nächsten Januar übernimmt die nächste Generation. Erbschaftssteuer nach heutigem Stand rund ${eur(erbSchaetzung())}, vom Ansehen bleiben ${pz(ERB_ANSEHEN)}.`);
  else if(j===GEN_JAHRE*n) uebergabe();
}
function uebergabe(){
  const n=genNr(), v=vermoegen(), steuer=Math.max(0,Math.round(v*ERB_STEUER/100)*100), bar=Math.min(steuer,Math.max(0,S.geld)), kr=steuer-bar, ansVor=S.ansehen, alt=S.erbe||{};
  S.geld-=bar;
  if(kr>0){const k=S.kredit||(S.kredit={rest:0,tilgung:0}); k.rest+=kr; k.tilgung+=Math.ceil(kr/ERB_LAUFZEIT); k.erb=(k.erb||0)+kr}
  S.ansehen=Math.round(S.ansehen*ERB_ANSEHEN);
  (S.chronik=S.chronik||[]).push({n,name:alt.name||'',art:alt.art||'',von:genJahr(n-1),bis:S.jahr,rang:S.rang,ans:ansVor,verm:v,steuer,kredit:kr});
  S.gen=n+1;
  const wahl=a=>a[rint(0,a.length-1)];
  S.erbe={k:S.flascheAuf?'offen':n===1?'g2':n===2?'g3':'weiter',offen:1,name:'',art:Math.random()<.5?'t':'s',vt:wahl(ERB_NAMEN.t),vs:wahl(ERB_NAMEN.s),steuer,kredit:kr,verm:v,ansVor,ans:S.ansehen};
  schlag(97,`${S.name} in neuen Händen`,`Zum Jahreswechsel geht das Weingut ${WO[S.region]} an die ${n+1}. Generation. Erbschaftssteuer: ${eur(steuer)}${kr?`, davon ${eur(kr)} als Kredit bei der Bank`:''}. Vom Ansehen bleiben ${pz(ERB_ANSEHEN)}, jetzt ${S.ansehen}. Rang, Fläche, Keller, Wein und alle Leute bleiben.`,GEN_BILD.uebergabe,{gold:1,erbe:1});
  if(window.BOT) erbeBenennen(S.erbe.art==='t'?S.erbe.vt:S.erbe.vs);
}
function erbeOffen(){return !!(S&&S.erbe&&S.erbe.offen)}
function erbeVorschlag(){const e=S.erbe; return e.art==='s'?e.vs:e.vt}
// Das Schriftstück zur Übergabe: Geschichte, Zahlen, dann Tochter oder Sohn und der Vorname. Bis zum Übergeben geht nichts anderes.

  const e=S.erbe, T=GEN_TEXT[e.k]||GEN_TEXT.weiter, alt=$('#erbname'), name=alt?alt.value:e.name;

    <h3>Wer übernimmt?</h3><div class="chips">${[['t','Die Tochter'],['s','Der Sohn']].map(([k,t])=>`<button class="chip ${e.art===k?'an':''}" data-a="erbeArt" data-id="${k}">${t}</button>`).join('')}</div>

function erbeBenennen(name){
  const e=S.erbe; e.name=name; e.offen=0;
  const b=S.bericht||{}, wer=e.art==='s'?'der Sohn':'die Tochter';
  for(const x of [...TOP,b.kopf,...(b.art||[])]) if(x&&x.erbe&&!x.benannt){x.benannt=1; x.t=`${name} übernimmt ${S.name}`; x.text=`${name}, ${wer}, hat den Kellerschlüssel bekommen. `+x.text}
}

function geschichteMonat(){
  // Schritt G 7.0: Beim ersten abgefüllten Wein (ohne Sekt) kommt die Flasche ins Fach. S.gesch.flasche merkt das Jahr.
  S.gesch=S.gesch||{};
  if(!S.gesch.flasche&&S.lots.some(l=>l.status==='flasche'&&!l.sekt)){S.gesch.flasche=S.jahr; S.erz='anfang'}
  if(S.jahr===START_JAHR&&S.lots.some(l=>l.status==='fass')) dorf('most');
  if(S.monat===0&&S.jahr===START_JAHR+1) dorf('winter1');
  if(S.monat===0&&S.jahr===START_JAHR+3) dorf('wette');
}

function rubrikNeu(nr){

  if(!Array.isArray(S.rubSack)||!S.rubSack.length){

    for(let i=A.length-1;i>0;i--){const j=rint(0,i); [A[i],A[j]]=[A[j],A[i]]}
