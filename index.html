<head>

<style>
/* Farben passend zu den Bildern: Sandstein fürs Weingut, Pflaster-Ton für die Stadt, dunkles Holz für die Kellerei. --kopf ist die Leiste oben. */
:root{--bg:#f3e7cf;--card:#fdf6e6;--ink:#2d2116;--mut:#766449;--wein:#7b1e3a;--kopf:#7b1e3a;--gruen:#58793a;--blau:#4a4f8f;--line:#dfcda8;--rot:#b3261e;--gold:#a87908}
html.ort-stadt{--bg:#f2e2d2;--card:#fdf4ea;--line:#e3c8ae;--mut:#7a6453}
html.ort-keller{--bg:#2b1c12;--card:#3b281a;--ink:#f4e7d2;--mut:#bfa888;--wein:#cc607b;--kopf:#4a1526;--gruen:#9cbf74;--blau:#9aa0e0;--line:#5a4029;--rot:#f0766a;--gold:#e4b54a}
@media (prefers-color-scheme:dark){
:root{--bg:#1d1810;--card:#2b2419;--ink:#f1e8dc;--mut:#a89a8c;--wein:#c2516f;--kopf:#5c1830;--gruen:#8fb56a;--blau:#8d93d6;--line:#453a28;--rot:#ef6a60;--gold:#e0b84a}
html.ort-stadt{--bg:#1f1814;--card:#2e2520;--line:#48392f;--mut:#a89a8c}
html.ort-keller{--bg:#1a110a;--card:#2a1b11;--ink:#f1e8dc;--mut:#a89a8c;--wein:#c2516f;--kopf:#4a1526;--gruen:#8fb56a;--blau:#8d93d6;--line:#4a3422;--rot:#ef6a60;--gold:#e0b84a}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);transition:background-color .35s;color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#top{position:sticky;top:0;z-index:5;background:var(--kopf);transition:background-color .35s;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
#top b{font-size:17px}#top small{opacity:.85;display:block;font-size:12px}
#top .geld{text-align:right;font-variant-numeric:tabular-nums}
main{padding:12px 16px 96px;max-width:560px;margin:0 auto}
h2{font-size:19px;margin:6px 0 10px}h3{font-size:16px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.mut{color:var(--mut);font-size:14px}.rot{color:var(--rot)}.gruen{color:var(--gruen)}.gold{color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:15px}.kv span:last-child{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;border:0;border-radius:12px;background:var(--wein);color:#fff;padding:12px 14px;min-height:46px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--wein);border:1.5px solid var(--wein)}
button.klein{min-height:40px;padding:8px 12px;font-size:14px}
button:disabled{opacity:.4}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btns button{flex:1 1 auto}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px}.bar i{display:block;height:100%;background:var(--gruen)}
.bar.w i{background:var(--wein)}.bar.g i{background:var(--gold)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.weiss{background:var(--gruen)}.rotw{background:var(--blau)}
.task{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--gruen);margin:0 0 8px;font-weight:500;min-height:0}
.task.rot{border-left-color:var(--rot);color:var(--ink)}
.hilfe{background:color-mix(in srgb,var(--gold) 14%,transparent);border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 2px;font-size:11px;font-weight:600;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:21px}#tabs button img{height:25px;display:block;margin:3px 0 1px}#tabs button.an{color:var(--wein)}
#tabs #weiter{flex:1.25;margin:6px 8px 6px 2px;border-radius:12px;background:var(--wein);color:#fff;min-height:46px;justify-content:center}
#tabs #weiter.zu{background:var(--mut)}
#sheet{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#sheet.an{display:flex}
#sheet>div{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
input[type=range]{width:100%;height:40px;accent-color:var(--wein)}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.slval{text-align:center;font-size:15px;margin:8px 0}.slval b{font-size:24px;display:block}
.wahl{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin:0 0 8px;font-weight:500}
.wahl.an{border-color:var(--wein);box-shadow:0 0 0 2px var(--wein) inset}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 4px}
.chip{flex:none;min-height:40px;padding:6px 12px;font-size:14px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.chip.an{background:var(--wein);color:#fff;border-color:var(--wein)}
ul.kl{margin:4px 0 0;padding-left:18px;font-size:14px}
.stufe{padding:8px 0;border-top:1px solid var(--line)}.stufe:first-of-type{border-top:0}
.rl{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.rl:first-of-type{border-top:0}
.rl b{display:block;font-size:15px}.rl.du b{color:var(--wein)}.rl>span{font-weight:700;min-width:20px}
.gebot{text-align:center;margin:12px 0}.gebot b{font-size:28px;display:block;font-variant-numeric:tabular-nums}
.zwei{display:flex;gap:8px}.zwei .wahl{flex:1;text-align:center}
.ehrung{background:color-mix(in srgb,var(--gold) 16%,var(--card));border:2px solid var(--gold);border-radius:14px;padding:14px;margin:0 0 12px;text-align:center;animation:ehr .6s ease-out}
.ehrung span{font-size:40px;display:block}.ehrung b{font-size:17px;display:block}
@keyframes ehr{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.pano{position:relative;cursor:pointer;height:min(280px,40vh);border-radius:14px;overflow:hidden;margin:0 0 12px;background:var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pano>i{position:absolute;inset:0;background-repeat:no-repeat;background-size:auto 100%;background-position:0 50%}
.pano>i.gleit{transition:background-position .7s ease,background-size .7s ease}
.pano.gut{--r:6.154}.pano.gut>i{background-image:url(bilder/gut.jpg)}
.pano.keller{--r:4.931}.pano.keller>i{background-image:url(bilder/keller.jpg)}
.pano.stadt{--r:6.115}.pano.stadt>i{background-image:url(bilder/stadt.jpg)}
.ptitel{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.66));color:#fff;text-align:center;pointer-events:none}
.ptitel b{display:block;font-size:18px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.punkte{display:flex;gap:7px;justify-content:center;margin-top:6px}
.punkte span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.punkte span.an{background:#fff;transform:scale(1.3)}
img.fass{height:1.1em;vertical-align:-.18em}
.mbild{position:relative;height:min(200px,30vh);border-radius:14px;overflow:hidden;margin:0 0 12px;background:var(--line) center/cover no-repeat}
.mbild.winter,.mbild.fruehling,.mbild.sommer,.mbild.herbst{background-position:center 38%}
.sbild{height:150px;margin:-18px -16px 14px;border-radius:18px 18px 0 0;background:var(--line) center/cover no-repeat}
#titel{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;color:#fff;text-align:center;cursor:pointer;background:#1c120b url(bilder/titel.jpg) center/cover no-repeat;padding:calc(20px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom))}
#titel.an{display:flex}
#titel::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(20,10,5,.6),rgba(20,10,5,.05) 34%,rgba(20,10,5,.08) 62%,rgba(20,10,5,.82))}
#titel.text::before{background:rgba(20,10,5,.74)}
#titel>*{position:relative}
#titel h1{font:700 42px/1.05 Georgia,"Times New Roman",serif;margin:5vh 0 8px;text-shadow:0 2px 10px rgba(0,0,0,.85)}
#titel .unter{font-size:15px;text-shadow:0 1px 4px #000}
#titel .fuss{margin-top:auto}
#titel .von{font-size:15px;margin-bottom:16px;text-shadow:0 1px 4px #000}
#titel .tipp{font-size:17px;font-weight:600;text-shadow:0 1px 4px #000;animation:puls 2.2s ease-in-out infinite}
#titel .gesch{margin:auto;max-width:460px;overflow:auto;text-align:left;font:17px/1.5 Georgia,"Times New Roman",serif;padding-top:34px}
#titel .gesch p{margin:0 0 12px;opacity:0;animation:ein 1.4s ease forwards;text-shadow:0 1px 4px #000}
#titel.text .fuss{opacity:0;animation:ein 1.4s ease forwards;margin-top:10px}
#titel.alle .gesch p,#titel.alle .fuss{animation:none;opacity:1}
#titel .weg{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;background:rgba(0,0,0,.5);color:#fff;min-height:36px;padding:6px 12px;font-size:13px;font-weight:500;border-radius:18px}
@keyframes ein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes puls{50%{opacity:.45}}
.wand{position:absolute;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6%;pointer-events:none}.wand.gleit{transition:left .7s ease,top .7s ease,width .7s ease,height .7s ease}
.zettel{pointer-events:auto;position:relative;flex:none;width:40%;height:40%;min-height:0;padding:0;border:0;border-radius:2px;background:#f6e58d;box-shadow:1px 2px 3px rgba(0,0,0,.45);font-size:.34em;line-height:1;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg)}
.zettel:nth-child(even){transform:rotate(3deg)}.zettel.rot{background:#ff9a8a}
.zettel::before{content:'';position:absolute;top:-12%;left:50%;width:18%;aspect-ratio:1;margin-left:-9%;border-radius:50%;background:#b8862b;box-shadow:0 1px 1px rgba(0,0,0,.5)}.zettel.rot::before{background:#c0241c}
@media (prefers-color-scheme:dark){.pano,.mbild,.sbild{filter:brightness(.85)}}
@media (prefers-reduced-motion:reduce){.pano *,.ehrung,#titel .tipp{animation:none;transition:none}#titel .gesch p,#titel.text .fuss{animation:none;opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="titel"></div>
<input type="file" id="datei" accept=".json,application/json" hidden>
<script>
'use strict';
/* ================= Daten ================= */
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const SORTEN={
  riesling:{name:'Riesling',farbe:'weiss',ertrag:4,zucker:0,preis:6,minL:18,maxL:360,q:10,reife:.12},
  mueller:{name:'Müller-Thurgau',farbe:'weiss',ertrag:5.6,zucker:-4,preis:3,minL:6,maxL:96,q:3,reife:.05},
  silvaner:{name:'Silvaner',farbe:'weiss',ertrag:5,zucker:-2,preis:4,minL:6,maxL:120,q:5,reife:.07},
  spaetb:{name:'Spätburgunder',farbe:'rot',ertrag:3.8,zucker:2,preis:5.5,minL:12,maxL:180,q:8,reife:.10},
  portug:{name:'Portugieser',farbe:'rot',ertrag:6,zucker:-5,preis:2.8,minL:3,maxL:48,q:2,reife:.04},
  troll:{name:'Trollinger',farbe:'rot',ertrag:5.6,zucker:-3,preis:3.2,minL:6,maxL:60,q:3,reife:.05}
};
// Hürden in zwei Stufen: vier Gebiete mit normalen Mindestwerten, Franken und Württemberg mit niedrigeren.
// Die beiden sind dafür 7° kühler (warm), und ihre Edelfäulnis bringt 7° mehr je Monat (edelPlus), weil die Trockenbeerenauslese überall bei 150° liegt.
// So erreicht die beste Sorte in allen sechs Gebieten dieselbe Verteilung der Stufen. Verschieden bleibt nur der Frost im Dezember.
const MIN_NORMAL={tafel:50,qba:60,kab:75,spat:85,aus:95,ba:125,tba:150}, MIN_KUEHL={tafel:45,qba:53,kab:68,spat:78,aus:88,ba:118,tba:150};
const REGIONEN={
  mosel:{name:'Mosel',sorten:['riesling','mueller','spaetb'],warm:0,frost:.34,text:'Steile Schieferhänge, Riesling-Land. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  rheingau:{name:'Rheingau',sorten:['riesling','spaetb','silvaner'],warm:0,frost:.30,text:'Klassisches Riesling-Land. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  rheinhessen:{name:'Rheinhessen',sorten:['mueller','silvaner','portug'],warm:0,frost:.26,text:'Mildes Silvaner-Land mit viel Ertrag. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  pfalz:{name:'Pfalz',sorten:['riesling','mueller','portug'],warm:0,frost:.22,text:'Milde Winter, dafür selten Frost für Eiswein. Normale Hürden, Auslese ab 95°.',min:MIN_NORMAL},
  franken:{name:'Franken',sorten:['silvaner','mueller','spaetb'],warm:-7,edelPlus:7,frost:.40,text:'Kühle Silvaner-Heimat mit kalten Wintern, oft Frost für Eiswein. Niedrigere Hürden, Auslese ab 88°.',min:MIN_KUEHL},
  wuerttemberg:{name:'Württemberg',sorten:['troll','riesling','spaetb'],warm:-7,edelPlus:7,frost:.32,text:'Kühles Rotwein-Land mit Trollinger. Niedrigere Hürden, Auslese ab 88°.',min:MIN_KUEHL}
};
// Eignung der Rebsorte im Gebiet: 1 = sehr gut, .85 = gut, .7 = geht noch. Wirkt als Faktor auf die Qualitätspunkte.
const EIGNUNG={mosel:{riesling:1,mueller:.85,spaetb:.7},rheingau:{riesling:1,spaetb:.85,silvaner:.7},rheinhessen:{silvaner:1,mueller:.85,portug:.7},
  pfalz:{riesling:1,portug:.85,mueller:.7},franken:{silvaner:1,mueller:.85,spaetb:.7},wuerttemberg:{troll:1,riesling:.85,spaetb:.7}};
const eignung=(id,r)=>(EIGNUNG[r||S.region]||{})[id]||.85;
// Zucker der Sorte im Gebiet: Die beste Sorte startet überall gleich. Die anderen behalten ihren Abzug und liegen mindestens 1° darunter.
const zuckerIm=(id,r)=>eignung(id,r)>=1?0:Math.min(-1,SORTEN[id].zucker);
const eigText=e=>e>=1?'★★★ sehr gut geeignet':e>=.85?'★★ gut geeignet':'★ geht noch';
// Boden bei der Lese: ab 90 % sehr gut, ab 80 % gut, darunter Punktabzug.
const bodenQP=b=>b==null?0:b>=90?2:b>=80?0:b>=70?-2:b>=60?-4:-6;
const bodenText=b=>b>=90?'sehr gut (+2 Qualitätspunkte)':b>=80?'gut':`zu mager (${bodenQP(b)} Qualitätspunkte), Nachdüngen hilft`;
const STUFEN={
  feder:{name:'Federweißer',rang:0,preis:3,qp:2,geb:0,ans:1},
  tafel:{name:'Tafelwein',rang:1,preis:2.5,qp:3,geb:0,ans:0},
  qba:{name:'Qualitätswein',rang:2,preis:4.5,qp:6,geb:0,ans:1},
  kab:{name:'Kabinett',rang:3,preis:7,qp:10,geb:60,ans:2,lese:'reif',edel:false},
  spat:{name:'Spätlese',rang:4,preis:10.5,qp:14,geb:90,ans:3,lese:'reif',edel:false},
  aus:{name:'Auslese',rang:5,preis:17,qp:18,geb:130,ans:5,lese:'reif',edel:true},
  ba:{name:'Beerenauslese',rang:6,preis:38,qp:24,geb:200,ans:8,lese:'ueber',edel:true},
  tba:{name:'Trockenbeerenauslese',rang:7,preis:75,qp:30,geb:300,ans:12,lese:'ueber',edel:true},
  eis:{name:'Eiswein',rang:8,preis:60,qp:28,geb:300,ans:10}
};
// Eiswein in drei Wertstufen nach den Öchsle bei der Lese: wie Auslese, Beerenauslese oder Trockenbeerenauslese des Gebiets.
// Angemeldet wird immer als Eiswein, f ist der Faktor auf den Preis, qp der Zuschlag auf die Qualitätspunkte.
const EIS_WERT=[{name:'Auslese',f:1,qp:0},{name:'Beerenauslese',f:1.3,qp:4},{name:'Trockenbeerenauslese',f:1.7,qp:8}];
const LESE={reif:'nur reife Trauben',ueber:'nur überreife Trauben',alles:'reife und überreife'};
const WETTER={sonnig:['☀️','sonnig'],mild:['⛅','mild'],regen:['🌧️','Regen'],kalt:['🌥️','kalt'],frost:['❄️','Frost']};
// Boden: verliert jeden Monat BODEN_MONAT Punkte (in einem Regenmonat BODEN_REGEN) und mit jeder Lese 4. Einmal Düngen bringt 30, erlaubt sind drei Mal im Jahr.
const HA_REBEN=1000, FASS_PREIS=1.2, FLASCHE_PREIS=.35, DUENGER_HA=250, BODEN_MONAT=3, BODEN_REGEN=5;
// Reben-Abnutzung: Zum Jahreswechsel geht je Sorte ein Teil der Reben ein. VERLUST nennt je Stufe [ab Bodenschnitt, von Prozent, bis Prozent].
// Frost kommt obendrauf: zwei Frostmonate im Winter (Januar, Februar, Dezember) FROST_2 Punkte, drei FROST_3, Spätfrost zur Blüte SPAETFROST.
// Der Rebenpreis schwankt von Januar bis März um REBEN_SCHWANK. STEUER gilt für dich und die Gegner, GEGNER_ABNUTZ ist ihr Nachpflanzen je Hektar und Jahr.
const VERLUST=[[70,2,4],[50,4,7],[35,7,11],[0,12,18]], FROST_2=2, FROST_3=4, SPAETFROST=2, REBEN_SCHWANK=.3, STEUER=.2, GEGNER_ABNUTZ=150;
const KEYS=['rebenreich-1','rebenreich-2','rebenreich-3'], SLOT_KEY='rebenreich-slot', TON_KEY='rebenreich-ton';
const HELFER_LEISTUNG=1000, MASCH_LEISTUNG=3000, MASCH_PREIS=18000, WARTUNG=60, LOHN_MIN=200, LOHN_MAX=500, LOHN_START=350, VERMITTLUNG=300, ZINS=.06, SEKT_KOSTEN=.8;
// Leute-Regel: Je REBEN_JE_HELFER angebaute Reben braucht es das ganze Jahr einen Erntehelfer, eine Erntemaschine zählt wie MASCH_HELFER Helfer.
// Ein Lagerarbeiter betreut FASS_JE_LAGERARB Liter Fassraum und FLASCHEN_JE_LAGERARB leere Flaschen. Fehlen Leute, sperrt "Nächster Monat".
const REBEN_JE_HELFER=1000, MASCH_HELFER=3, FASS_JE_LAGERARB=10000, FLASCHEN_JE_LAGERARB=20000;
/* ---- Etappe 3: Ränge, Gegner, Auktionen, Wettbewerbe, Export ---- */
const START_JAHR=2027, LANDWERT=15000;
const WO={mosel:'an der Mosel',rheingau:'im Rheingau',rheinhessen:'in Rheinhessen',pfalz:'in der Pfalz',franken:'in Franken',wuerttemberg:'in Württemberg'};
const RAENGE=[
  {name:'Neuling',kurz:'Neuling',ans:0,ha:0,verm:0,rahmen:20000},
  {name:'Winzer',kurz:'Winzer',ans:15,ha:3,verm:100000,rahmen:40000,neu:'du darfst bei Auktionen mitbieten'},
  {name:'Winzermeister',kurz:'Winzermeister',ans:60,ha:5,verm:300000,rahmen:40000,neu:'Landesprämierung, Export in die Niederlande und nach Großbritannien'},
  {name:'Gutsherr',kurz:'Gutsherr',ans:150,ha:8,verm:750000,rahmen:160000,neu:'Bundeswettbewerb',weg:'Sabotage ist für dich ab jetzt tabu, ein Herr macht so etwas nicht.'},
  {name:'Weinbaurat',kurz:'Weinbaurat',ans:300,ha:13,verm:1800000,rahmen:300000,neu:'Export in die USA und nach Japan'},
  {name:'Präsident des Weinbauverbands',kurz:'Präsident',ans:500,ha:20,verm:4000000,rahmen:500000,neu:'der Sieg'}
];
// Was ein Aufstieg bringt: der Kreditrahmen nur, wenn er wächst, dazu die Freischaltung des Rangs.
function bringt(i){const r=RAENGE[i],T=[];if(r.rahmen>RAENGE[i-1].rahmen)T.push('Kreditrahmen '+eur(r.rahmen));T.push(r.neu);return T.join(', ')}

/* ================= Musik und Geräusche ================= */
// Sechs Musikstücke und sieben Geräusche liegen als Dateien im Ordner ton (gebaut von _medien_bauen.py). Musik und Geräusche sind getrennt abschaltbar (TON).
// Musik: Beim Ortswechsel blendet das alte Stück aus und das neue ein. Jedes Stück merkt sich seine Stelle und spielt dort später weiter.
// Kurz vor dem Ende blendet ein zweiter Abspieler vom Anfang her ein, so läuft das Stück im Kreis ohne Bruch.
const TON={musik:true,fx:true};
try{Object.assign(TON,JSON.parse(localStorage.getItem(TON_KEY)||'{}'))}catch(e){}
const MUSIK={gut:'weingut',keller:'kellerei',stadt:'stadt',wett:'wettbewerb',auf:'befoerderung',pfand:'pfaendung'};
// MUSIK_LAUT: Lautstärke der Musik (Geräusche laufen voll). BLENDE: Sekunden fürs Überblenden beim Ortswechsel, KREIS: am Ende eines Stücks. TAKT: Schritt des Mischers in ms.
const MUSIK_LAUT=.5, BLENDE=1.5, KREIS=3, TAKT=50;
const TOENE=['klick','menue','kasse','korken','stempel','hammer','schere'];
// MORT ist das Stück, das gerade laufen soll. SMUSIK ist ein Stück, das ein offenes Fenster verlangt (Wettbewerb). MSP: Abspieler je Stück, FXB: geladene Geräusche.
let AC=null, AN=false, MORT=null, SMUSIK=null, FXT=-1; const MSP={}, FXB={};
// Als Datei geöffnet (file:) laufen die Töne ohne Web Audio, weil der Browser Nachbardateien dort nicht lesen lässt.
const NETZ=location.protocol!=='file:';
// Der Ton startet erst mit dem ersten Tipp, vorher lässt ihn kein Browser zu.
function tonAn(){
  if(AN) return; AN=true;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}
  setInterval(mischer,TAKT);
  if(AC&&NETZ) for(const n of TOENE) fetch('ton/'+n+'.mp3').then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(b=>{FXB[n]=b}).catch(()=>{});
  musikStell();
}
// Startet einen Abspieler. Das Ergebnis ist false, wenn der Browser das Abspielen verweigert.
function spiel(el){try{const p=el.play(); return p&&p.catch?p.catch(()=>false):Promise.resolve()}catch(e){return Promise.resolve(false)}}
// Ein Abspieler: v ist seine Lautstärke jetzt (0 bis 1), z das Ziel, dt die Sekunden für eine volle Blende.
function stimme(name){
  const el=new Audio('ton/musik-'+MUSIK[name]+'.mp3'), s={el,g:null,v:0,z:0,dt:BLENDE};
  el.preload='auto'; el.loop=true;
  if(AC&&NETZ) try{s.g=AC.createGain(); s.g.gain.value=0; AC.createMediaElementSource(el).connect(s.g); s.g.connect(AC.destination)}catch(e){s.g=null}
  if(!s.g) el.volume=0;
  return s;
}
function laut(s){const x=s.v*MUSIK_LAUT; if(s.g) s.g.gain.value=x; else s.el.volume=x}
// Mischer, läuft alle TAKT ms: schiebt jede Lautstärke ein Stück auf ihr Ziel zu, hält stumme Abspieler an und blendet am Ende eines Stücks zum Anfang über.
function mischer(){
  for(const n in MSP){
    const P=MSP[n];
    for(const s of P.s) if(s){
      if(s.v!==s.z){const d=TAKT/1000/s.dt; s.v=s.z>s.v?Math.min(s.z,s.v+d):Math.max(s.z,s.v-d); laut(s)}
      if(s.v===0&&s.z===0&&!s.el.paused) s.el.pause();
    }
    const a=P.s[P.akt], el=a.el;
    if(n===MORT&&!P.fest&&a.z===1&&el.duration&&el.currentTime>el.duration-KREIS){
      const b=P.s[1-P.akt]||(P.s[1-P.akt]=stimme(n));
      try{b.el.currentTime=0}catch(e){}
      a.z=0; b.z=1; a.dt=b.dt=KREIS; P.akt=1-P.akt;
      // Darf der zweite Abspieler nicht starten (manche iPhones), läuft der erste einfach von vorn weiter.
      spiel(b.el).then(ok=>{if(ok===false){P.fest=true; if(P.s[P.akt]===b){b.z=0; a.z=1; P.akt=1-P.akt}}});
    }
  }
}
function musikOrt(name){if(name!==MORT){MORT=name; musikStell()}}
// Stellt die Ziele neu: Nur das Stück des Ortes spielt, alles andere blendet aus.
function musikStell(){
  if(!AN) return;
  const an=TON.musik&&MORT&&!document.hidden;
  for(const n in MSP) if(!an||n!==MORT) for(const s of MSP[n].s) if(s){s.z=0; s.dt=BLENDE}
  if(!an) return;
  const P=MSP[MORT]||(MSP[MORT]={s:[stimme(MORT),null],akt:0}), a=P.s[P.akt];
  a.z=1; a.dt=BLENDE; spiel(a.el);
}
// Welches Stück gerade passt: Pfändung bei der Pleite, Wettbewerb im Wettbewerbs-Fenster und bei Medaillen, Beförderung beim Aufstieg, sonst das Stück des Ortes.
function musikWahl(){
  if(!S) return 'gut';
  if(S.pleite) return 'pfand';
  if(SMUSIK) return SMUSIK;
  if(TAB==='monat'){const E=(S.bericht&&S.bericht.ehr)||[]; return E.some(e=>e.a)?'auf':E.length?'wett':'gut'}
  return MUSIK[TAB]?TAB:'gut';
}
// Liegt das Spiel im Hintergrund, schweigt die Musik sofort. Beim Zurückkommen blendet sie wieder ein.
document.addEventListener('visibilitychange',()=>{
  if(!AN) return;
  if(document.hidden){for(const n in MSP) for(const s of MSP[n].s) if(s){s.v=s.z=0; laut(s); s.el.pause()}}
  else{if(AC&&AC.state==='suspended') AC.resume(); musikStell()}
});
// Kurzes Geräusch, mal-fach im Abstand von 400 ms (Auktionshammer). Der Tipp-Klick schweigt, wenn im selben Augenblick schon ein anderes Geräusch kam.
function fx(name,mal){
  if(!AN||!TON.fx) return;
  const t=performance.now(); if(name==='klick'&&t-FXT<80) return; FXT=t;
  for(let i=0;i<(mal||1);i++){
    if(AC&&FXB[name]){const q=AC.createBufferSource(); q.buffer=FXB[name]; q.connect(AC.destination); q.start(AC.currentTime+i*.4)}
    else setTimeout(()=>spiel(new Audio('ton/'+name+'.mp3')),i*400);
  }
}
function tonKnoepfe(){return `<div class="card"><h3>Ton</h3><div class="btns"><button class="sec klein" data-a="ton" data-id="musik">🎵 Musik: ${TON.musik?'an':'aus'}</button><button class="sec klein" data-a="ton" data-id="fx">🔔 Geräusche: ${TON.fx?'an':'aus'}</button></div></div>`}

/* ================= Bilder ================= */
// Alle Bilder liegen als Dateien im Ordner bilder (gebaut von _medien_bauen.py).
// Panorama: ein breiter, gemalter Streifen je Hauptreiter. PANO_MITTE nennt je Ort, wo sein Motiv im Streifen liegt (0 = linker Rand, 1 = rechter Rand).
// Beim Wechsel des Ortes gleitet das Bild dorthin. Gewechselt wird durch Wischen über das Bild oder durch Tippen auf ein Motiv.
const PANO_MITTE={gut:{berg:.10,betrieb:.35,aktuell:.51,maschinen:.70,buero:.92},keller:{buch:.125,sabotage:.345,start:.60,lager:.865},stadt:{amt:.125,handel:.32,laeden:.51,bank:.70,arbeit:.895}};
// PANO_ZOOM vergrößert das Bild je Hauptreiter (std) oder je Ort, damit ein Motiv das Fenster füllt. 1 = ganze Höhe sichtbar.
const PANO_ZOOM={gut:{std:1.2},keller:{std:1},stadt:{std:1}};
let PANO_ALT={tab:null,x:0,z:1}, ORT_ALT=null;
// Je Ort eine eigene Hintergrundfarbe (Klasse am html-Element). Die Leiste des Handys ganz oben bekommt die Farbe der Kopfleiste.
function ortFarbe(tab){const h=document.documentElement; h.className='ort-'+tab; const m=$('meta[name="theme-color"]'); if(m) m.content=getComputedStyle(h).getPropertyValue('--kopf').trim()||'#7b1e3a'}
// Bild oben in einem Fenster (Weinkontrolle, Auktion, Prämierung, Rathaus, Kellerbuch, Pleite).
const sbild=n=>`<div class="sbild" style="background-image:url(bilder/${n}.jpg)"></div>`;
// Das Bild des Ortes. Unten im Bild steht, wo man ist, die Punkte darunter zeigen die Orte des Hauptreiters. Wetter-Effekte über dem Bild gibt es nicht mehr.
function ortBild(titel){
  const L=SUBS[TAB];
  return `<div class="pano ${TAB}" data-a="bild"><i></i>${TAB==='gut'?wandHtml():''}<div class="ptitel"><b>${L.find(s=>s[0]===SUB)[1]} ${esc(titel)}</b><span class="punkte">${L.map(s=>`<span class="${s[0]===SUB?'an':''}"></span>`).join('')}</span></div></div>`;
}
// Bild der Infoseite: Aufstieg, Sieg oder Prämierung, wenn es etwas zu feiern gibt, die Frostnacht beim Kälteeinbruch im November, sonst die Jahreszeit.
function monatBild(E){
  if(E.some(e=>e.a)) return E.some(e=>e.i==='👑')?'sieg':'aufstieg';
  if(E.length) return 'praemierung';
  if(S.monat===10&&S.kaelte===S.jahr) return 'frost';
  const m=S.monat; return m===11||m<=1?'winter':m<=4?'fruehling':m<=7?'sommer':'herbst';
}
// Pinnwand im Weingut-Bild: je offener Aufgabe ein Zettel mit Symbol, höchstens vier, Dringendes zuerst und in Rot. Tippen führt wie in der Liste an den Ort. Leere Wand heißt: nichts steht an.
// WAND nennt die Korkfläche im Streifen als Anteile (links, rechts, oben, unten). Bei einem neuen Bild neu ausmessen.
const WAND=[.491,.533,.385,.61], WAND_SYM={amt:'🏛️',bank:'🏦',arbeit:'👷',handel:'🍷',laeden:'🍷',berg:'🍇',maschinen:'🚜',lager:'📦',keller:'🍾',stadt:'🏛️',gut:'🏡'};
function wandHtml(){
  const A=aufgaben().slice().sort((a,b)=>(b.rot?1:0)-(a.rot?1:0)).slice(0,4);
  const sym=a=>{const m=a.t.match(/^\p{Extended_Pictographic}️?/u); return m?m[0]:WAND_SYM[a.sub]||WAND_SYM[a.tab]||'📌'};
  return `<div class="wand">${A.map(a=>`<button class="zettel ${a.rot?'rot':''}" data-a="${a.akt||'tab'}" data-id="${a.tab||''}" data-sub="${a.sub||''}" aria-label="${esc(a.t)}">${sym(a)}</button>`).join('')}</div>`;
}
// Legt die Zettel-Fläche genau auf die Korkwand, passend zu Verschiebung x (Prozent) und Zoom z des Streifens.
function wandStell(el,r,x,z){
  const w=$('.wand',el); if(!w) return;
  const H=el.clientHeight, B=el.clientWidth, sw=H*r*z, ox=x/100*(sw-B), oy=(H*z-H)/2;
  w.style.left=(WAND[0]*sw-ox)+'px'; w.style.top=(WAND[2]*H*z-oy)+'px'; w.style.width=((WAND[1]-WAND[0])*sw)+'px'; w.style.height=((WAND[3]-WAND[2])*H*z)+'px'; w.style.fontSize=((WAND[3]-WAND[2])*H*z)+'px';
}
// Schiebt den Streifen so, dass das Motiv des Unterreiters in der Mitte steht. Im selben Hauptreiter gleitet er vom alten Platz dorthin.
function panoStell(){
  const p=$('.pano>i'); if(!p) return;
  const el=p.parentNode, r=parseFloat(getComputedStyle(el).getPropertyValue('--r'))||6, z=PANO_ZOOM[TAB][SUB]||PANO_ZOOM[TAB].std, f=el.clientWidth/(el.clientHeight*r*z);
  const x=f>=1?50:Math.round(clamp((PANO_MITTE[TAB][SUB]-f/2)/(1-f),0,1)*1000)/10, gr=z=>`auto ${Math.round(z*100)}%`;
  if(PANO_ALT.tab===TAB&&(PANO_ALT.x!==x||PANO_ALT.z!==z)){p.style.backgroundPositionX=PANO_ALT.x+'%'; p.style.backgroundSize=gr(PANO_ALT.z); wandStell(el,r,PANO_ALT.x,PANO_ALT.z); p.getBoundingClientRect(); p.classList.add('gleit'); const w=$('.wand',el); if(w) w.classList.add('gleit')}
  p.style.backgroundPositionX=x+'%'; p.style.backgroundSize=gr(z); wandStell(el,r,x,z); PANO_ALT={tab:TAB,x,z};
}
// Tipp ins Bild: Welches Motiv liegt dem Tipp am nächsten? fr ist die Stelle im ganzen Streifen (0 bis 1).
function panoTipp(e){
  const el=e.target.closest('.pano'); if(!el||!PANO_MITTE[TAB]) return null;
  const b=el.getBoundingClientRect(), r=parseFloat(getComputedStyle(el).getPropertyValue('--r'))||6, W=b.height*r*(PANO_ALT.z||1);
  const fr=(e.clientX-b.left+PANO_ALT.x/100*(W-b.width))/W;
  return Object.entries(PANO_MITTE[TAB]).sort((a,c)=>Math.abs(a[1]-fr)-Math.abs(c[1]-fr))[0][0];
}
// Alte Spielstände: Edelfäulnis unter dem Auslese-Wert gab es nur nach der früheren Regel. Sie fällt weg, damit Kabinett und Spätlese nicht verloren gehen.
function altEdel(){
  const a=R().min.aus;
  for(const l of S.lots) if(!l.stufe&&l.edel&&!l.eis&&l.oe<a) l.edel=false;
  for(const f of Object.values(S.felder)) if(f.edel&&!f.gefroren&&f.oe<a){f.edel=false; f.edelGeprueft=false}
}
// Legt alles an, was Etappe 3 braucht. Läuft bei neuen Spielen und bei alten Spielständen.
function etappe3(n,schwer){
  Object.assign(S,{schwer,rang:0,sieger:null,wett:null,auktion:null,sektJahr:0,exLage:{nl:1,gb:1,us:1,jp:1}});
  const typen=misch(['vorsicht','qualitaet','zocker']).slice(0,n), andere=misch(Object.keys(REGIONEN).filter(r=>r!==S.region));
  S.gegner=typen.map((typ,i)=>({id:i,typ,name:GEGNER_TYP[typ].name,region:i===0&&Math.random()<.3?S.region:andere[i],ha:3,geld:40000,kredit:0,ansehen:0,rang:0}));
  neueLaeden();
}
function zahle(b){S.geld-=b;S.jahrAus+=b}
function kassiere(b){S.geld+=b;S.jahrEin+=b;fx('kasse')}
function R(){return REGIONEN[S.region]}
function rebenGesamt(){return R().sorten.reduce((a,id)=>a+S.felder[id].reben,0)}
const verlustSpanne=b=>VERLUST.find(v=>b>=v[0]);
// Bodenschnitt des laufenden Jahres: die Monatsenden bisher und der heutige Stand.
function bodenSchnitt(){return Math.round(((S.bodenSum||0)+S.boden)/((S.bodenN||0)+1))}
function frostPlus(){const w=S.winterFrost||0;return (w>=3?FROST_3:w>=2?FROST_2:0)+(S.spaetFrost?SPAETFROST:0)}
function rebenPreis(id){return Math.round(SORTEN[id].preis*(S.rebenF||1)*100)/100}
function rebenMarktText(){const p=Math.round(((S.rebenF||1)-1)*100);return p?`Reben kosten diesen Monat ${Math.abs(p)} % ${p<0?'weniger':'mehr'} als üblich`:'Reben kosten diesen Monat so viel wie üblich'}
// Geschätzter Jahresgewinn und die Steuer darauf. Die Kosten, die zum Monatswechsel noch abgehen, sind schon abgezogen.
function steuerSchau(){const K=kosten(), gew=Math.round(S.jahrEin-S.jahrAus-K.basis-K.loehne-K.zins);return {gew,steuer:gew>0?Math.round(gew*STEUER):0}}
function fassBelegt(){return S.lots.filter(l=>l.status==='fass').reduce((a,l)=>a+l.liter,0)}
function lotName(l){return `${l.jahrgang} ${SORTEN[l.sorte].name}${l.stufe?' '+STUFEN[l.stufe].name:''}${l.sekt?'-Sekt':''}`}
function rahmen(){return RAENGE[S.rang].rahmen}
// Ansehen gutschreiben. Die Schwierigkeit verschiebt nur Zuwächse, Abzüge bleiben gleich.
function ruhm(n){if(n>0)n=Math.max(1,Math.round(n*DIFF[S.schwer].ans));S.ansehen=Math.max(0,S.ansehen+n);return n}
function reifeFaktor(l){const L=lager(l);return l.status==='flasche'?Math.min(4,1+Math.max(0,l.flMonate-L.min)/12*L.rate):1}
function lotWert(l){
  if(l.status==='trauben') return 0;
  if(!l.stufe) return l.liter*2;
  return l.liter*STUFEN[l.stufe].preis*eisF(l)*(1+l.qp/100)*reifeFaktor(l)*(l.sekt?1.6:1)*(l.status==='fass'?.7:1);
}
function vermoegen(){return Math.round(S.geld-(S.kredit?S.kredit.rest:0)+S.ha*LANDWERT+S.maschinen.reduce((a,m)=>a+MASCH_PREIS*.5*m.zustand/100,0)+S.lots.reduce((a,l)=>a+lotWert(l),0))}
function gVerm(g){return Math.round(g.geld-g.kredit+g.ha*LANDWERT)}
function rangFuer(ab,ans,ha,verm){let r=ab;while(r<5){const n=RAENGE[r+1];if(ans>=n.ans&&ha>=n.ha&&verm>=n.verm)r++;else break}return r}
function medHtml(l){return l.med&&l.med.length?`<div class="gold" style="font-size:14px">${l.med.map(esc).join(' · ')}</div>`:''}

/* ================= Absatzwege ================= */
function wege(l){
  const p=preis(l); if(!p) return [];
  const W=[{name:'Inland',flag:'🇩🇪',p}];
  for(const e of EXPORT) if(S.rang>=e.rang) W.push({name:e.name,flag:e.flag,p:Math.round(p*e.f(l)*S.exLage[e.id]*100)/100});
  return W.sort((a,b)=>b.p-a.p);
}
function neueLaeden(){S.laeden={};for(const r of Object.keys(REGIONEN)) if(r!==S.region) S.laeden[r]={rest:rint(1,4)*100,wunsch:['weiss','rot','sekt','edel'][rint(0,3)]}}
function ladenOk(l){return l.status==='flasche'&&preis(l)>0&&(l.sekt||STUFEN[l.stufe].rang>=3)}
function ladenPreis(l,r){
  const w=S.laeden[r].wunsch, passt=w==='sekt'?!!l.sekt:w==='edel'?STUFEN[l.stufe].rang>=5:!l.sekt&&SORTEN[l.sorte].farbe===w;
  return Math.round(preis(l)*(passt?1.45:1.25)*100)/100;
}

/* ================= Wettbewerbe ================= */
function wettRang(){return S.wett&&S.wett.typ==='bund'?3:2}
function reifeBonus(l){return Math.min(12,Math.round((reifeFaktor(l)-1)*8))}
function wettFaehig(l){
  const w=S.wett; if(!w||!l||!l.stufe||l.pansch) return false;
  if(w.typ==='land') return !l.sekt&&STUFEN[l.stufe].rang>=3&&l.jahrgang===S.jahr-1&&l.status!=='trauben';
  return l.status==='flasche'&&!l.bund&&(l.sekt||STUFEN[l.stufe].rang>=3)&&l.flMonate>=lager(l).min;
}
function neuerWettbewerb(typ){
  const d=DIFF[S.schwer].feld, bund=typ==='bund', F=[], namen=misch(GUETER);
  for(let i=0;i<(bund?8:9);i++) F.push({name:namen[i],p:(bund?rint(20,44):i<2?rint(20,34):rint(8,26))+d});
  for(const g of S.gegner) if(bund||g.region===S.region){const t=GEGNER_TYP[g.typ];F.push({name:g.name,ki:g.id,p:rint(t.ws[0],t.ws[1])+Math.round(g.rang*(bund?2:1.5))+(bund?4:0)+d})}
  S.wett={typ,feld:F,fertig:false};
}
// l ist der eingereichte Wein oder null, wenn der Spieler nicht mitmacht. Verteilt die Preise.
function wettAuswerten(l){
  const w=S.wett, P=PREISE[w.typ], F=w.feld.map(x=>({...x})), N=[], wo=w.typ==='land'?'bei der Landesprämierung '+WO[S.region]:'beim Bundeswettbewerb';
  if(l) F.push({name:S.name,du:1,p:l.qp+(w.typ==='bund'?reifeBonus(l):0)+rint(-4,4)});
  F.sort((a,b)=>b.p-a.p||(b.du||0)-(a.du||0));
  w.text=l?`Platz ${F.findIndex(x=>x.du)+1} von ${F.length}. Diesmal reicht es nicht fürs Treppchen.`:'';
  F.slice(0,3).forEach((x,i)=>{
    const pr=P[i];
    if(x.du){
      const r=ruhm(pr.ans); l.qp+=pr.qp; (l.med=l.med||[]).push(`${pr.m} ${WETTNAME[w.typ]} ${S.jahr}`);
      ehre(pr.m,`${pr.t} ${wo}: ${lotName(l)}`,0,`+${r} Ansehen, +${pr.qp} Qualitätspunkte${pr.geld?', '+eur(pr.geld)+' Preisgeld':''}`);
      if(w.typ==='bund') l.bund=true;
      if(pr.geld) kassiere(pr.geld);
      w.text=`${lotName(l)} holt ${pr.t}! +${r} Ansehen, +${pr.qp} Qualitätspunkte${pr.geld?', '+eur(pr.geld)+' Preisgeld':''}.`;
    }else if(x.ki!=null){
      const g=S.gegner[x.ki]; g.ansehen+=pr.ans*DIFF[S.schwer].ki; g.geld+=pr.geld;
      N.push(`${g.name} holt ${pr.t} ${wo}.`);
    }
  });
  w.fertig=true; w.liste=F; w.news=N;
}

/* ================= Auktionen ================= */
function auktionHa(){const r=Math.random();return r<.4?1:r<.73?2:r<.95?3:r<.995?5:10}
function neueAuktion(){
  const ha=auktionHa(), start=ha*8000, B=misch(NACHBARN).slice(0,rint(2,3)).map(n=>({name:n,limit:Math.round(ha*rnd(11000,30000)/500)*500}));
  for(const g of S.gegner) if(g.region===S.region){
    const t=GEGNER_TYP[g.typ];
    B.push({name:g.name,ki:g.id,limit:Math.round(Math.min(g.geld+(g.typ==='zocker'?30000:0),ha*rnd(14000,26000)*(1+t.biet*.6))/500)*500});
  }
  const offen=B.filter(b=>b.limit>=start);
  S.auktion={ha,start,schritt:Math.max(500,Math.round(start*.1/500)*500),gebot:start,fuehrer:offen.length?offen[rint(0,offen.length-1)].name:null,bieter:B,ende:null,text:''};
}
function aukNaechstes(){const a=S.auktion;return a.fuehrer?a.gebot+a.schritt:a.gebot}
function aukLimit(){return S.geld+rahmen()-(S.kredit?S.kredit.rest:0)}
// Der Spieler ist raus oder hat die Auktion verpasst: Die anderen machen es unter sich aus.
function aukOhneDich(){
  const a=S.auktion, B=a.bieter.filter(b=>b.limit>=a.gebot).sort((x,y)=>y.limit-x.limit);
  if(!B.length){a.ende='niemand'; return a.text=`Für den Weinberg mit ${a.ha} Hektar ${WO[S.region]} fand sich kein Bieter.`}
  const sieger=B[0], pr=B[1]?Math.max(a.gebot,Math.min(sieger.limit,B[1].limit+a.schritt)):a.gebot;
  a.ende=sieger.name; a.gebot=pr;
  if(sieger.ki!=null){const g=S.gegner[sieger.ki]; g.geld-=pr; g.ha+=a.ha; g.ansehen+=(3+Math.min(a.ha,7))*DIFF[S.schwer].ki}
  return a.text=`${sieger.name} bekommt den Zuschlag: ${a.ha} Hektar ${WO[S.region]} für ${eur(pr)}.`;
}

/* ================= Computer-Winzer ================= */
// Läuft einmal im Monat für jeden Gegner und liefert die Nachrichten des Monats.
function gegnerMonat(){
  const N=[], m=S.monat, st=DIFF[S.schwer].ki, neu=(p,t)=>N.push({p,t});
  for(const g of S.gegner){
    const t=GEGNER_TYP[g.typ], wo=WO[g.region], heim=g.region===S.region;
    // Auch die Gegner fangen mit kahlem Weinberg an: Jahr 1 bringt 20 %, Jahr 2 60 %, danach voll.
    if(m===0) g.jahre=(g.jahre||0)+1;
    const auf=Math.min(1,.2+.4*((g.jahre||0)-1));
    if(m===0){
      // g.schaden: Anteil der Ernte, den eine Sabotage im Vorjahr gekostet hat.
      const gew=Math.round(g.ha*rnd(t.eink[0],t.eink[1])*st*auf*(1-(g.schaden||0))/100)*100; g.schaden=0;
      // Auch die Gegner zahlen Steuer auf den Jahresgewinn und pflanzen nach, sobald ihr Weinberg voll trägt.
      g.geld+=gew-(gew>0?Math.round(gew*STEUER/100)*100:0)-(auf===1?g.ha*GEGNER_ABNUTZ:0);
      if(gew>0&&auf===1) g.ansehen+=2*st;
      if(gew<0) neu(3,`${g.name} hat sich verkalkuliert und schließt das Jahr mit Verlust ab.`);
      else if(auf===1&&gew>g.ha*(t.eink[0]+(t.eink[1]-t.eink[0])*.9)*st) neu(1,`${g.name} meldet ein Rekordjahr.`);
      if(g.kredit>0&&g.geld>0){const r=Math.min(g.kredit,Math.round(g.geld*.5)); g.geld-=r; g.kredit-=r; if(!g.kredit) neu(2,`${g.name} ist bei der Bank wieder schuldenfrei.`)}
    }
    // Kälteeinbruch im November: trifft, wer noch Trauben hängen hat. Die Vorsichtige hat meist schon gelesen.
    if(m===10&&S.kaelte===S.jahr&&auf>.2&&(g.poker||Math.random()<(g.typ==='vorsicht'?.2:.6))){g.geld-=g.ha*(g.poker?2500:1500); g.poker=false; neu(3,`Kälteeinbruch ${wo}: Bei ${g.name} ist erfroren, was noch hing.`)}
    // Gefälschtes Kellerbuch (Sabotage des Spielers): g.falsch zählt die Monate bis zur Kontrolle beim Gegner.
    if(g.falsch&&--g.falsch<=0){g.falsch=0; g.ansehen=Math.max(0,g.ansehen-20); g.geld-=Math.max(10000,Math.round(g.geld*.15)); neu(6,`Weinkontrolle bei ${g.name}: Im Kellerbuch steht gepanschter Wein. Das kostet Strafe und Ansehen.`)}
    if(m===1&&g.jahre){g.ansehen+=rnd(t.ans[0],t.ans[1])*st*auf; if(Math.random()<.5) neu(1,`${g.name} meldet im Rathaus${t.weine[rint(0,t.weine.length-1)]} an.`)}
    if(m===2&&!heim&&auf===1&&Math.random()<t.med*st){const P=PREISE.land[rint(0,2)]; g.ansehen+=P.ans*st; neu(4,`${g.name} holt ${P.t} bei der Landesprämierung ${wo}.`)}
    if(!heim&&Math.random()<1/18){
      const ha=auktionHa(), pr=Math.round(ha*rnd(12000,26000)/500)*500;
      if(g.geld+(g.typ==='zocker'?30000:0)>=pr&&Math.random()<t.biet*st){g.geld-=pr; g.ha+=ha; g.ansehen+=(3+Math.min(ha,7))*st; neu(4,`${g.name} ersteigert ${ha} Hektar ${wo}.`)}
    }
    if(g.typ==='zocker'){
      if(!g.kredit&&Math.random()<.04){const k=20000*(g.rang+1); g.geld+=k; g.kredit=Math.round(k*1.2); neu(2,`${g.name} nimmt einen Kredit über ${eur(k)} auf.`)}
      if(m===9){
        if(Math.random()<.4){
          if(Math.random()<.35){g.ansehen=Math.max(0,g.ansehen-20); g.geld-=Math.round(Math.max(2000,g.geld*.1)); neu(5,`Weinkontrolle bei ${g.name}: gepanschter Wein gefunden. Das kostet Strafe und Ansehen.`)}
          else{g.geld+=g.ha*2500; if(Math.random()<.4) neu(1,`Man munkelt, bei ${g.name} werde heimlich nachgezuckert.`)}
        }
        if(Math.random()<.35){g.poker=true; neu(2,`${g.name} pokert auf Eiswein und lässt alles hängen.`)}
      }
      if(m===11&&g.poker){
        g.poker=false;
        if(Math.random()<REGIONEN[g.region].frost){g.ansehen+=8*st; g.geld+=g.ha*3000; neu(3,`Frost ${wo}: Der Eiswein-Poker von ${g.name} geht auf.`)}
        else{g.geld-=g.ha*2500; neu(3,`Kein Frost ${wo}: ${g.name} verliert einen Teil der Ernte.`)}
      }
    }else if(m===8&&Math.random()<.3) neu(0,g.typ==='vorsicht'?`${g.name} liest früh und geht kein Risiko ein.`:`${g.name} lässt die Trauben für eine Auslese hängen.`);
    if(g.geld<0){g.kredit+=Math.round(-g.geld*1.15); g.geld=0}
    const alt=g.rang; g.rang=rangFuer(g.rang,g.ansehen,g.ha,gVerm(g));
    if(g.rang>alt){
      neu(9,`${g.name} steigt auf und ist jetzt ${RAENGE[g.rang].name}.`);
      if(g.rang===5&&!S.sieger){S.sieger=g.name; neu(10,`🏆 ${g.name} gewinnt die Partie. Du kannst weiterspielen und deinen eigenen Aufstieg vollenden.`)}
    }
  }
  N.sort((a,b)=>b.p-a.p);
  return N.filter((n,i)=>n.p>=9||i<3).map(n=>n.t);
}
function leistung(){return S.helfer*HELFER_LEISTUNG+S.maschinen.reduce((a,m)=>a+Math.round(MASCH_LEISTUNG*m.zustand/100),0)}
function leseFaktor(){const b=rebenGesamt();return b?Math.min(1,leistung()/b):1}
// Leute-Regel: Gezählt werden Köpfe, der Zustand einer Maschine spielt hier keine Rolle (der wirkt nur auf die Ernteleistung bei der Lese).
function helferKraft(){return S.helfer+MASCH_HELFER*S.maschinen.length}
function helferBedarf(){return Math.ceil(rebenGesamt()/REBEN_JE_HELFER)}
function lagerBedarf(){return Math.max(Math.ceil(S.fassraum/FASS_JE_LAGERARB),Math.ceil(S.flaschen/FLASCHEN_JE_LAGERARB))}
function leuteFehlen(){return {helfer:Math.max(0,helferBedarf()-helferKraft()),lagerarb:Math.max(0,lagerBedarf()-S.lagerarb)}}
// "Es fehlen 2 Erntehelfer und 1 Lagerarbeiter" oder leer, wenn niemand fehlt.
function fehlText(){
  const f=leuteFehlen(), t=[];
  if(f.helfer) t.push(`${f.helfer} Erntehelfer`);
  if(f.lagerarb) t.push(`${f.lagerarb} Lagerarbeiter`);
  return t.length?`${f.helfer+f.lagerarb===1?'Es fehlt':'Es fehlen'} ${t.join(' und ')}`:'';
}
// Löhne: Das Arbeitsamt bietet jeden Monat einen neuen Monatslohn zwischen LOHN_MIN und LOHN_MAX, getrennt für Erntehelfer und Lagerarbeiter.
// Wer eingestellt ist, behält seinen Lohn. S.loehne merkt ihn je Kopf, aufsteigend sortiert. Entlassen wird immer der teuerste.
const LOHN_ARTEN=['helfer','lagerarb'];
function neuesLohnAngebot(){S.angebot={};for(const k of LOHN_ARTEN) S.angebot[k]=rint(LOHN_MIN/10,LOHN_MAX/10)*10}
function lohnSumme(k){return S.loehne[k].reduce((a,b)=>a+b,0)}
function lohnListe(k){const z=new Map();for(const n of S.loehne[k]) z.set(n,(z.get(n)||0)+1);return [...z].map(([n,c])=>`${c} × ${eur(n)}`).join(', ')}
const lohnLage=n=>n<=250?'günstig':n>=450?'teuer':'normal';
// Bringt die Lohnliste auf die Zahl der Angestellten. Alte Spielstände ohne Lohnliste bekommen den Startlohn.
function lohnAbgleich(){
  if(!S.loehne) S.loehne={helfer:[],lagerarb:[]};
  for(const k of LOHN_ARTEN){const a=S.loehne[k]; while(a.length<S[k]) a.push(LOHN_START); a.length=S[k]; a.sort((x,y)=>x-y)}
  if(!S.angebot) neuesLohnAngebot();
}
function kosten(){const k=S.kredit;return {basis:150+50*S.ha,loehne:lohnSumme('helfer')+lohnSumme('lagerarb'),tilgung:k?Math.min(k.rest,k.tilgung):0,zins:k?Math.round(k.rest*ZINS/12):0}}
function schulden(){return (S.kredit?S.kredit.rest:0)+Math.max(0,-S.geld)}
function sektFaehig(l){return l.status==='flasche'&&!l.sekt&&l.stufe!=='feder'&&l.flMonate>=lagerBasis(l).min}
function dot(id){return `<i class="dot ${SORTEN[id].farbe==='weiss'?'weiss':'rotw'}"></i>`}

/* ================= Wetter ================= */
function wuerfelWetter(m){
  const r=Math.random(), fr=R().frost;
  let t;
  if(m===11||m<=1) t=[['frost',fr],['kalt',.4],['regen',.2],['mild',1]];
  else if(m===10) t=[['kalt',.45],['regen',.3],['mild',1]];
  else if(m===3) t=[['frost',.1],['kalt',.1],['regen',.3],['sonnig',.2],['mild',1]];
  else if(m===2||m===4) t=[['frost',.03],['kalt',.1],['regen',.3],['sonnig',.2],['mild',1]];
  else if(m<=7) t=[['sonnig',.5],['regen',.2],['mild',1]];
  else t=[['sonnig',.3],['regen',.3],['kalt',.05],['mild',1]];
  let s=0; for(const [w,p] of t){s+=p; if(r<s) return w}
  return 'mild';
}
function neuePrognose(){
  const n=(S.monat+1)%12; S.wetterNext=wuerfelWetter(n);
  S.prognose=Math.random()<.75?S.wetterNext:wuerfelWetter(n);
}
const wbonus=w=>({sonnig:5,mild:0,regen:-4,kalt:-3,frost:-3}[w]);
// Temperatur: Gradzahl passend zu Monat und Wetter, nur zur Anzeige. Frost liegt immer unter null, alles andere bei mindestens 1 °C.
// S.temp merkt die gewürfelte Zahl des Monats. Fehlt sie (alte Spielstände, Spielstart), gilt der Wert ohne Streuung.
const TEMP_MONAT=[2,3,7,11,15,18,20,20,16,11,6,3], TEMP_WETTER={sonnig:4,mild:0,regen:-2,kalt:-5};
function tempFuer(m,w,streu){
  if(w==='frost') return (m>=2&&m<=4?-2:-4)+(streu?rint(-2,1):0);
  return Math.max(1,TEMP_MONAT[m]+TEMP_WETTER[w]+Math.round((R().warm||0)/7)+(streu?rint(-1,1):0));
}
const wetterText=()=>`${WETTER[S.wetter].join(' ')}, ${S.temp!=null?S.temp:tempFuer(S.monat,S.wetter)} °C`;

/* ================= Wachstum ================= */
// Öchsle: Startwert im Juli, Zuwachs August bis Dezember, Zuschlag je Monat mit Edelfäulnis.
// Im November trocknen die Beeren ein: Die Menge schrumpft, der Zucker steigt deshalb noch einmal kräftig.
// Edelfäulnis: kommt, sobald ein Feld den Auslese-Wert des Gebiets erreicht, und bleibt in 18 % der Fälle aus.
// Ihr Zuschlag je Monat hängt an der Zahl der Sonnenmonate des Jahres (Juni bis Oktober), EDEL_PLUS[0] bis EDEL_PLUS[5].
// Ziel für die beste Sorte je Feld und Jahr, wenn man bis November hängen lässt: Trockenbeerenauslese um 14 %, Beerenauslese um 20 %, Auslese um 40 %.
// Auslese gibt es, wenn der Auslese-Wert erst im November fällt. Fällt er schon im Oktober, reicht ein Monat Edelfäulnis für mehr.
// Beste Sorte im Oktober: normales Jahr um 89°, Sonnenjahr um 100°.
const OE_START=49, OE_PLUS=[14,14,12,15,4], EDEL_PLUS=[14,18,23,32,42,50];
const edelBonus=()=>EDEL_PLUS[Math.min(5,S.sonne)]+(R().edelPlus||0);
function wachse(m){
  const reg=R(), L=[];
  // Kälteeinbruch: In jedem vierten November (KAELTE) erfriert alles, was noch hängt. In allen Gebieten gleich, ohne Vorwarnung.
  // S.kaelte merkt das Jahr, damit es auch die Gegner trifft.
  if(m===10){S.kaelte=Math.random()<KAELTE?S.jahr:0; if(S.kaelte){S.wetter='frost'; S.temp=tempFuer(10,'frost',true)}}
  const w=S.wetter;
  if(w==='sonnig'&&m>=5&&m<=9) S.sonne++;
  for(const id of reg.sorten){
    const f=S.felder[id], so=SORTEN[id]; if(!f.reben) continue;
    if((m===3||m===4)&&w==='frost'){f.frostF=.7; L.push(`Spätfrost schädigt die Blüte beim ${so.name}.`)}
    if(m===5) f.menge=Math.round((f.reben-f.jung+f.jung*.5)*so.ertrag*(.6+.4*S.boden/100)*f.frostF*rnd(.9,1.1));
    if(m===6){f.oe=OE_START+zuckerIm(id)+reg.warm+wbonus(w)+rint(-2,2); f.reif=5; f.ueber=0; f.plus=0}
    if(m>=7&&f.menge>0&&!f.gelesen){
      // f.plus merkt den Öchsle-Zuwachs des Monats für die Infoseite.
      const vor=f.oe;
      f.oe=Math.min(150,f.oe+OE_PLUS[m-7]+wbonus(w)+rint(-2,2)+(f.edel?edelBonus():0)); f.plus=f.oe-vor;
      if(f.edel) f.menge=Math.round(f.menge*.8);
      f.reif=clamp([35,70,92,100,100][m-7]+(w==='sonnig'?5:w==='regen'?-5:0),0,100);
      f.ueber=clamp([0,5,20,45,70][m-7]+(w==='sonnig'?5:0),0,100);
      if(m===9&&w==='regen') f.menge=Math.round(f.menge*.9);
      if(m===10){
        if(S.kaelte){f.menge=0; L.push(`Kälteeinbruch! Die hängenden ${so.name}-Trauben sind erfroren.`)}
        else f.menge=Math.round(f.menge*(w==='regen'?.7:.85));
      }
      if(m===11){
        if(w==='frost'){f.gefroren=true; f.menge=Math.round(f.menge*.6); L.push(`Frost! Der ${so.name} hängt gefroren am Stock. Eiswein ist möglich.`)}
        else{f.menge=0; L.push(`Kein Frost: Die hängenden ${so.name}-Trauben sind verfault.`)}
      }
      if(f.menge>0&&!f.edelGeprueft&&f.oe>=reg.min.aus){
        f.edelGeprueft=true; f.edel=Math.random()<.82;
        L.push(f.edel?`Edelfäulnis beim ${so.name}: Der Auslese-Wert von ${reg.min.aus}° ist erreicht. Der Zucker steigt jetzt ${S.sonne>=3?'kräftig':'schneller'}, die Menge schrumpft. Kabinett und Spätlese gibt es von diesem Feld nicht mehr.`:`Der ${so.name} hat den Auslese-Wert von ${reg.min.aus}° erreicht, aber die Edelfäulnis bleibt dieses Jahr aus.`);
      }
    }
  }
  return L;
}
function feldReset(f){Object.assign(f,{oe:0,plus:0,menge:0,reif:0,ueber:0,edel:false,edelGeprueft:false,gelesen:false,teil:false,gefroren:false,frostF:1})}

/* ================= Weinstufen ================= */
function mindest(st){const m=R().min; return (st==='feder'||st==='eis')?m.tafel:m[st]}
// q = {oe, leseart, edel, eis}
function pruefeQualitaet(st,q){
  const g=[], d=STUFEN[st], min=mindest(st);
  if(q.oe<min) g.push(`es fehlen ${min-q.oe}° Öchsle (Minimum ${min}°)`);
  if(st==='eis'){
    if(!q.eis) g.push('nur aus gefrorenen Trauben der Dezember-Lese');
    if(!q.edel) g.push('Edelfäulnis fehlt');
    // Wie im Handbuch: reife oder überreife Trauben, aber nicht beides zusammen.
    if(q.leseart==='alles') g.push(`Leseart muss „${LESE.reif}“ oder „${LESE.ueber}“ sein`);
  }else{
    if(d.rang>=3&&q.eis) g.push('aus der Dezember-Lese gibt es nur Tafelwein, Qualitätswein oder Eiswein');
    if(d.lese&&q.leseart!==d.lese) g.push(`Leseart muss „${LESE[d.lese]}“ sein`);
    if(d.edel===true&&!q.edel) g.push('Edelfäulnis fehlt');
    if(d.edel===false&&q.edel) g.push('Trauben mit Edelfäulnis sind dafür nicht zugelassen');
  }
  return g;
}
function pruefeAnmeldung(l,st){
  const g=pruefeQualitaet(st,l), d=STUFEN[st];
  if(l.fassMonate<1) g.push('muss mindestens einen Monat im Fass liegen');
  if(st==='feder'&&l.fassMonate>1) g.push('nur im Monat nach der Lese möglich');
  if(d.rang>=3&&d.rang<=7&&S.jahr<=l.jahrgang) g.push('frühestens im Januar nach der Lese');
  if(st==='eis'&&!(S.monat===0&&S.jahr===l.jahrgang+1)) g.push('nur im Januar nach der Lese');
  if(d.geb&&d.geb>S.geld) g.push(`Gebühr von ${eur(d.geb)} nicht bezahlbar`);
  return g;
}
const REIHE=['tafel','qba','kab','spat','aus','ba','tba','eis'];
function besteStufe(q){let b=null; for(const st of REIHE) if(!pruefeQualitaet(st,q).length) b=st; return b}
function eisStufe(oe){const m=R().min; return oe>=m.tba?2:oe>=m.ba?1:0}
const eisF=l=>l.stufe==='eis'?EIS_WERT[l.eisW||0].f:1;
// Name der Stufe für die Lese-Hilfe, beim Eiswein mit seiner Wertstufe.
const stufeText=(st,oe)=>STUFEN[st].name+(st==='eis'?` (Öchsle einer ${EIS_WERT[eisStufe(oe)].name})`:'');
function feldQ(f,la){return {oe:Math.min(150,f.oe+(la==='ueber'?5:0)),leseart:la,edel:f.edel,eis:f.gefroren}}
function feldLiter(f,la){const r=f.reif/100,u=f.ueber/100; return Math.round(f.menge*r*(la==='reif'?1-u:la==='ueber'?u:1)*leseFaktor())}
function leseHilfe(f){
  let best=null,bla=null;
  for(const la of ['alles','reif','ueber']){const b=besteStufe(feldQ(f,la)); if(b&&(!best||STUFEN[b].rang>STUFEN[best].rang)){best=b;bla=la}}
  let h=best?`<b>Jetzt möglich:</b> ${stufeText(best,feldQ(f,bla).oe)}${STUFEN[best].lese||best==='eis'?'':' (jede Leseart)'}${STUFEN[best].lese?` (Leseart: ${LESE[bla]})`:''}${best==='eis'?' (Leseart: nur reife oder nur überreife Trauben, nicht beides zusammen)':''}`:'<b>Jetzt möglich:</b> noch nichts, der Zucker reicht nicht';
  if(f.gefroren) return h;
  const rang=best?STUFEN[best].rang:0;
  const ziel=['tafel','qba','kab','spat','aus','ba','tba'].find(st=>STUFEN[st].rang>rang);
  if(ziel){
    const la=STUFEN[ziel].lese||'alles', g=pruefeQualitaet(ziel,feldQ(f,la)).filter(x=>!x.startsWith('Leseart'));
    h+=`<br><b>Nächste Stufe:</b> ${STUFEN[ziel].name}`+(g.length?`. Dafür: ${g.join(', ')}`:` mit Leseart „${LESE[la]}“`);
    if(STUFEN[ziel].lese&&g.length) h+=`, Leseart „${LESE[la]}“`;
  }
  return h;
}

/* ================= Lagerung und Preis ================= */
function lager(l){const b=lagerBasis(l);return l.sekt?{min:9,max:b.max,rate:b.rate}:b}
function lagerBasis(l){
  const so=SORTEN[l.sorte];
  if(l.stufe==='feder') return {min:0,max:2,rate:0};
  if(l.stufe==='tafel'||l.stufe==='qba') return {min:2,max:Math.max(24,Math.round(so.maxL/3)),rate:so.reife/2};
  if(l.stufe==='eis') return {min:Math.round(so.minL*1.5),max:Infinity,rate:so.reife};
  return {min:so.minL,max:so.maxL,rate:so.reife};
}
function preis(l){
  if(l.status!=='flasche') return 0;
  const L=lager(l); if(l.flMonate<L.min) return 0;
  const alter=Math.min(4,1+(l.flMonate-L.min)/12*L.rate);
  return Math.round(STUFEN[l.stufe].preis*eisF(l)*(1+l.qp/100)*alter*S.markt*(l.sekt?1.6:1)*100)/100;
}

    else if(l.status==='flasche'&&l.flMonate>=lager(l).max) v.push(`${lotName(l)} hat seine Haltbarkeit erreicht`);

function monatWeiter(){

  // Für den Bodenschnitt zählt der Stand am Monatsende. S.nass merkt den Regenmonat für den Hinweis im Weinberg.

    }

  // Rebenmarkt: in der Pflanzzeit jeden Monat neu gewürfelt, ohne Vorschau.
  S.rebenF=S.monat<=2?Math.round(rnd(1-REBEN_SCHWANK,1+REBEN_SCHWANK)*100)/100:1;
  S.markt=clamp(S.markt+rnd(-.06,.06),.85,1.15);

  }else{S.mahnung=0; if(S.geld<0) Z.push('Dein Konto ist im Minus. Die Bank nimmt dafür 1 % Zinsen im Monat.')}

  S.bericht={titel:`${MON[S.monat]} ${S.jahr}`,zeilen:Z,wetter:W,ehr,k:{basis:K.basis,loehne:K.loehne,rate:K.tilgung+K.zins,ueberz:uz,steuer}};
  TAB='monat'; save(); render(); window.scrollTo(0,0);
  if(S.pleite) zeigePleite(); else if(S.pruefer) zeigePruefer();
}
// Alles, was Etappe 3 beim Monatswechsel tut: Aufstieg, Gegner, Wettbewerbe, Auktion, Märkte.
function etappe3Monat(Z){

  }

/* ---- Weinkontrolle: unangekündigt, im Schnitt alle drei Jahre, spätestens nach vier. Nach einem Fund fünf Jahre lang jedes Jahr ---- */
function kontrNeu(){const k=S.kontr; if(k.scharf>0){k.scharf--; k.in=12}else k.in=rint(24,48)}
function panschListe(){return S.lots.filter(l=>l.pansch&&l.status!=='trauben')}
function strafeHoehe(){return Math.max(STRAFE_MIN,Math.round(2*panschListe().reduce((a,l)=>a+lotWert(l),0)/100)*100)}
function strafeAns(){return STRAFE_ANS+STRAFE_ANS_WEITER*(panschListe().length-1)}
function kontrolleMonat(Z){
  const k=S.kontr; if(--k.in>0) return;
  if(!panschListe().length){kontrNeu(); Z.push(`🔍 Weinkontrolle: Der Prüfer blättert durch dein Kellerbuch und findet nichts zu beanstanden. +${ruhm(2)} Ansehen.`); return}

  S.pruefer=1; Z.push('🔍 Weinkontrolle: Der Prüfer steht im Keller und will dein Kellerbuch sehen.');

const bestechChance=n=>.5+.35*(n-BESTECH_MIN)/(BESTECH_MAX-BESTECH_MIN);
function zeigePruefer(){

    <div class="btns"><button class="sec" data-a="pruefBestechen" ${max<BESTECH_MIN?'disabled':''}>Bestechen</button><button data-a="pruefJa">Prüfen lassen</button></div>`);

// Der Prüfer findet den gepanschten Wein. extra ist der zusätzliche Abzug nach einer abgelehnten Bestechung.

  const F=panschListe(), st=strafeHoehe(), ab=strafeAns()+(extra||0);

/* ---- Panschen: Most zuckern oder wässern, Fässer verschneiden ---- */
const mani=l=>(l.zucker||0)+(l.wasser||0)>0;
const maniLegal=(l,st)=>st==='tafel'&&(l.zucker||0)<=ZUCKER_ERLAUBT&&(l.wasser||0)<=ZUCKER_ERLAUBT;
const maniText=l=>[l.zucker?`gezuckert (+${l.zucker} %)`:'',l.wasser?`gewässert (+${l.wasser} %)`:''].filter(Boolean).join(' und ');
function qpFuer(l,st){return Math.max(1,Math.round((STUFEN[st].qp+(st==='eis'?EIS_WERT[eisStufe(l.oe)].qp:0)+Math.min(8,Math.floor((l.oe-mindest(st))/3))+Math.round(SORTEN[l.sorte].q/2)+Math.min(4,l.sonne||0)+bodenQP(l.boden))*eignung(l.sorte)))}
// Schmiergeld für den Beamten: ein Anteil vom Wert des Weins, mindestens SCHMIER_MIN.
const schmierVon=w=>Math.max(SCHMIER_MIN,Math.round(w*SCHMIER_ANTEIL/100)*100);
function schmier(l,st){return schmierVon(l.liter*STUFEN[st].preis*(1+qpFuer(l,st)/100))}
const mischbar=l=>l.status==='fass'&&l.stufe&&l.stufe!=='feder';
const farbe=l=>SORTEN[l.sorte].farbe;
// Verschnitt zweier Fassweine: Der Wein mit der höheren Stufe gibt den Namen, Öchsle und Qualitätspunkte werden nach Menge gemittelt.
function mischung(a,b){
  if(STUFEN[b.stufe].rang>STUFEN[a.stufe].rang) [a,b]=[b,a];
  const L=a.liter+b.liter, o={a,b,liter:L,oe:Math.round((a.oe*a.liter+b.oe*b.liter)/L),qp:Math.round((a.qp*a.liter+b.qp*b.liter)/L)};
  o.schmier=schmierVon(L*STUFEN[a.stufe].preis*eisF(a)*(1+o.qp/100)); return o;
}
/* ---- Sabotage ---- */
const sabChance=n=>.3+.45*(n-SAB_MIN)/(SAB_MAX-SAB_MIN);
function sabSperre(){
  return S.rang>=SAB_RANG?`Als ${RAENGE[S.rang].kurz} machst du so etwas nicht mehr.`:S.monat<6?'Die Unterwelt ist nur von Juli bis Dezember zu sprechen.':S.sabJahr===S.jahr?'Für dieses Jahr hast du dein Glück schon versucht.'
    :S.geld<SAB_KONTAKT+SAB_MIN?`Du brauchst mindestens ${eur(SAB_KONTAKT+SAB_MIN)}: ${eur(SAB_KONTAKT)} für den Kontakt und ${eur(SAB_MIN)} Handgeld.`:'';
}
// Sabotage gegen den Spieler: nur vom Zocker, frühestens ab dem fünften Jahr, höchstens alle fünf Jahre. Schaden: ein Fass oder rund 15 % der Reben.
function sabotageGegenDich(Z){
  const g=S.gegner.find(x=>x.typ==='zocker');
  if(!g||S.monat<6||S.jahr-START_JAHR<4||S.jahr-(S.sabDich||0)<5||Math.random()>=.04) return;
  const F=S.lots.filter(l=>l.status==='fass').sort((a,b)=>lotWert(b)-lotWert(a)), B=R().sorten.filter(id=>S.felder[id].reben>=500);
  if(!F.length&&!B.length) return;
  S.sabDich=S.jahr;
  if(F.length&&(Math.random()<.5||!B.length)){
    const l=F[0]; S.lots=S.lots.filter(x=>x!==l);
    Z.push(`💣 Sabotage! Nachts war jemand in deinem Keller: ${num(l.liter)} l ${lotName(l)} sind vergiftet und mussten weg. Man munkelt, ${g.name} stecke dahinter.`);
  }else{
    let weg=0;
    for(const id of B){const f=S.felder[id], tot=Math.round(f.reben*.15/100)*100; f.reben-=tot; f.jung=Math.min(f.jung,f.reben); weg+=tot; if(f.menge>0&&!f.gelesen) f.menge=Math.round(f.menge*.85)}
    Z.push(`💣 Sabotage! Nachts hat jemand in deinem Weinberg gewütet: ${num(weg)} Reben sind zerstört. Man munkelt, ${g.name} stecke dahinter.`);
  }
}

/* ================= Aufgaben-Liste ================= */
function aufgaben(){
  const A=[], m=S.monat, frei=S.ha*HA_REBEN-rebenGesamt();
  if(S.mahnung) A.push({t:`${S.mahnung}. Mahnung: Schulden über dem Kreditrahmen`,rot:1,tab:'stadt',sub:'bank'});
  if(S.auktion&&!S.auktion.ende&&S.rang>=1) A.push({t:`🔨 Auktion diesen Monat: ${S.auktion.ha} Hektar, Gebot steht bei ${eur(S.auktion.gebot)}`,akt:'auktion'});
  if(S.wett&&!S.wett.fertig&&S.rang>=wettRang()) A.push({t:`🏅 ${WETTNAME[S.wett.typ]}: diesen Monat einen Wein einreichen`,akt:'wettbewerb'});
  if(fehlText()) A.push({t:`${fehlText()}, vorher geht es nicht in den nächsten Monat`,rot:1,tab:'stadt',sub:'arbeit'});
  if(m>=5&&m<=10&&leseFaktor()<1&&R().sorten.some(id=>S.felder[id].menge>0&&!S.felder[id].gelesen)) A.push({t:`Ernteleistung reicht nur für ${Math.round(leseFaktor()*100)} % der Reben`,rot:1,tab:'stadt',sub:'arbeit'});
  for(const l of S.lots) if(l.status==='trauben') A.push({t:`${SORTEN[l.sorte].name}-Trauben müssen diesen Monat gekeltert werden`,rot:1,tab:'keller'});
  for(const l of S.lots) if(l.status==='fass'){
    if(l.stufe==='feder') A.push({t:`Federweißer ${SORTEN[l.sorte].name} muss diesen Monat abgefüllt werden`,rot:1,tab:'keller'});
    else if(l.fassMonate>=5) A.push({t:`${lotName(l)}: verdirbt im Fass in ${8-l.fassMonate} Monaten`,rot:1,tab:l.stufe?'keller':'stadt',sub:l.stufe?'':'amt'});
  }
  const anm=S.lots.filter(l=>l.status==='fass'&&!l.stufe&&['feder',...REIHE].some(st=>!pruefeAnmeldung(l,st).length)).length;
  if(anm) A.push({t:`${anm} ${anm===1?'Fass kann':'Fässer können'} im Rathaus angemeldet werden`,tab:'stadt',sub:'amt'});
  const abf=S.lots.filter(l=>l.status==='fass'&&l.stufe&&l.stufe!=='feder');
  for(const l of abf) A.push({t:`${lotName(l)} kann abgefüllt werden`+(S.flaschen<l.liter?` (es fehlen ${num(l.liter-S.flaschen)} Flaschen)`:''),tab:'keller'});
  for(const l of S.lots) if(l.status==='flasche'&&lager(l).max-l.flMonate<=2) A.push({t:`${lotName(l)}: nur noch ${lager(l).max-l.flMonate} Monate haltbar`,rot:1,tab:'stadt',sub:'handel'});
  if(m<=2&&S.verlust) for(const id of R().sorten) if(S.verlust[id]) A.push({t:`Über den Winter sind ${num(S.verlust[id])} ${SORTEN[id].name}-Reben eingegangen. Nachpflanzen`,tab:'gut',sub:'berg'});
  if(m<=2&&frei>0) A.push({t:`Pflanzzeit: Platz für ${num(frei)} Reben`,tab:'gut',sub:'berg'});
  if(m===11){const t=steuerSchau(); if(t.steuer>0){
    A.push({t:`💶 Im Januar rund ${eur(t.steuer)} Steuer auf ${eur(t.gew)} Gewinn. Fassraum oder Flaschen kaufen senkt sie`,tab:'keller',sub:'lager'});
    if(S.duengungen<3&&S.boden<100) A.push({t:`💶 Steuer senken: noch düngen (${S.duengungen} von 3 Mal)`,tab:'gut',sub:'berg'});
    if(S.maschinen.some(x=>x.zustand<100)) A.push({t:'💶 Steuer senken: Maschinen warten',tab:'gut',sub:'maschinen'});
  }}
  if(m>=7&&R().sorten.some(id=>{const f=S.felder[id];return f.menge>0&&!f.gelesen&&(m<11||f.gefroren)})) A.push({t:'Lese möglich',tab:'gut',sub:'berg'});
  const vk=S.lots.filter(l=>preis(l)>0).length;
  if(vk) A.push({t:`${vk} ${vk===1?'Wein ist':'Weine sind'} verkaufsreif`,tab:'stadt',sub:'handel'});
  return A;
}

  <div class="card"><h3>Düngung</h3>

    <div class="mut" style="margin-top:6px">Der Boden verliert jeden Monat ${BODEN_MONAT} Punkte, in einem Regenmonat ${BODEN_REGEN}, und mit jeder Lese 4. Einmal Düngen bringt 30.</div>
    ${S.nass!=null?`<div class="mut rot">🌧️ Der Regen im ${MON[S.nass]} hat den Boden ausgewaschen.</div>`:''}
    <div class="mut" style="margin-top:6px">Reben: Bodenschnitt dieses Jahr ${bodenSchnitt()} %, voraussichtlich ${vs[1]+fp} bis ${vs[2]+fp} % Verlust zum Jahreswechsel${fp?' (mit Frost)':''}.</div></div>`;
  for(const id of R().sorten){
    const f=S.felder[id], so=SORTEN[id];
    h+=`<div class="card"><div class="row"><h3>${dot(id)}${so.name}</h3><span class="mut">${num(f.reben)} Reben</span></div><div class="mut">${eigText(eignung(id))}</div>`;
    if(!f.reben) h+=`<div class="mut">Nicht angebaut. ${eur2(rebenPreis(id))} je Rebe, rund ${String(so.ertrag).replace('.',',')} l je Rebe.</div>`;
    else if(f.gelesen) h+=`<div class="mut">Für dieses Jahr gelesen.</div>`;
    else if(f.teil&&f.menge<=0) h+=`<div class="mut">Ein Teil ist gelesen, der Rest ist verloren.</div>`;
    else if(m<5) h+=`<div class="mut">${phase[m]}${f.jung?` · ${num(f.jung)} junge Reben`:''}</div>`;
    else if(m===5) h+=`<div class="mut">Fruchtansatz. Erwartete Menge: rund ${num(f.menge)} l</div>`;
    else if(f.menge<=0) h+=`<div class="mut">Keine Trauben mehr am Stock.</div>`;
    else{
      h+=`<div class="kv"><span>Öchsle</span><span>${f.oe}°${f.plus>0?` (+${f.plus}° in diesem Monat)`:''}</span></div><div class="bar g"><i style="width:${f.oe/1.5}%"></i></div>
      <div class="kv"><span>Menge am Stock</span><span>${num(f.menge)} l</span></div>
      <div class="kv"><span>Reif</span><span>${f.reif} %</span></div><div class="bar"><i style="width:${f.reif}%"></i></div>
      <div class="kv"><span>davon überreif</span><span>${f.ueber} %</span></div><div class="bar w"><i style="width:${f.ueber}%"></i></div>
      <div class="kv"><span>Edelfäulnis</span><span>${f.edel?'ja':f.edelGeprueft?'bleibt dieses Jahr aus':`nein, kommt meist ab ${R().min.aus}°`}</span></div>
      ${f.gefroren?'<div class="kv"><span>Zustand</span><span>❄️ gefroren</span></div>':''}
      ${f.teil?'<div class="mut">Ein Teil ist schon gelesen, der Rest hängt noch.</div>':''}
      ${m>=7?`<div class="hilfe">${leseHilfe(f)}${m===9?'<br><span class="rot">Achtung: In jedem vierten Jahr kommt im November ein Kälteeinbruch. Dann erfriert alles, was noch hängt.</span>':''}${m===10?'<br><span class="rot">Achtung: Ohne Frost im Dezember verfault alles, was noch hängt.</span>':''}</div>`:'<div class="mut">Lese ab August.</div>'}`;
    }

      ${kannLesen?`<button data-a="lesen" data-id="${id}">Lesen</button>`:''}</div></div>`;
  }
  return h;
}
function vKeller(){

    ${P?`<div class="rot">Im Keller ${P===1?'liegt ein gepanschter Wein':`liegen ${P} gepanschte Weine`}.</div>`:''}${S.kontr.scharf>0?'<div class="rot">Der Prüfer hat dich auf dem Kieker und kommt jedes Jahr.</div>':''}</div>`;

    <div class="btns"><button class="klein" data-a="misch1" ${paare?'':'disabled'}>Fässer mischen</button></div></div>`;
  h+=`<h3>Sabotage</h3><div class="card"><div class="mut">Ein Mittelsmann erledigt bei einem Gegner die schmutzige Arbeit. Von Juli bis Dezember, höchstens einmal im Jahr. ${eur(SAB_KONTAKT)} für den Kontakt, dazu ${eur(SAB_MIN)} bis ${eur(SAB_MAX)} Handgeld. Je mehr Handgeld, desto eher klappt es. Jeder fünfte Versuch fliegt auf, das kostet ${eur(SAB_STRAFE)} und ${SAB_STRAFE_ANS} Ansehen.</div>

  return h;
}

  // Sortieren: nach Wert (teuerster zuerst), Alter (ältester Jahrgang zuerst) oder Dringlichkeit (was am ehesten verdirbt zuerst).
  const rest=l=>l.status==='fass'?8-l.fassMonate:lager(l).max-l.flMonate;
  const SORT={wert:(a,b)=>preis(b)*b.liter-preis(a)*a.liter||lotWert(b)-lotWert(a)||b.jahrgang-a.jahrgang,
    alter:(a,b)=>a.jahrgang-b.jahrgang||(b.fassMonate+b.flMonate)-(a.fassMonate+a.flMonate),
    dringend:(a,b)=>rest(a)-rest(b)||a.jahrgang-b.jahrgang};
  const ls=S.lots.filter(l=>l.status!=='trauben').slice().sort(SORT[BSORT]);
  let h='';
  if(!ls.length) return h+'<div class="card mut">Noch keine Einträge. Hier stehen später alle deine Weine im Fass und in der Flasche.</div>';
  h+=`<div class="chips">${[['wert','Nach Wert'],['alter','Nach Alter'],['dringend','Nach Dringlichkeit']].map(s=>`<button class="chip ${BSORT===s[0]?'an':''}" data-a="bsort" data-id="${s[0]}">${s[1]}</button>`).join('')}</div>`;
  for(const l of ls){
    const fl=l.status==='flasche', L=l.stufe?lager(l):null, p=preis(l);
    h+=`<div class="card"><b>${dot(l.sorte)}${lotName(l)}</b>${l.stufe?'':' <span class="mut">(nicht angemeldet)</span>'}${l.pansch?' <span class="rot">🤫 gepanscht</span>':''}${medHtml(l)}
    <div class="kv"><span>Menge</span><span>${num(l.liter)} l</span></div>
    <div class="kv"><span>Lagerort</span><span>${fl?'Flasche':'Fass'}</span></div>
    <div class="kv"><span>Lagert seit</span><span>${fl?l.flMonate:l.fassMonate} Monaten</span></div>
    <div class="kv"><span>Noch haltbar</span><span>${fl?(L.max===Infinity?'unbegrenzt':(L.max-l.flMonate)+' Monate'):(8-l.fassMonate)+' Monate im Fass'}</span></div>
    ${fl?`<div class="bar g"><i style="width:${L.max===Infinity?Math.min(100,l.flMonate/(L.min*3)*100):l.flMonate/L.max*100}%"></i></div>`:''}
    <div class="kv"><span>Öchsle bei der Lese</span><span>${l.oe}°</span></div>
    ${l.stufe==='eis'?`<div class="kv"><span>Wertstufe</span><span>Öchsle einer ${EIS_WERT[l.eisW||0].name}</span></div>`:''}
    <div class="kv"><span>Qualitätspunkte</span><span>${l.stufe?l.qp:'erst nach Anmeldung'}</span></div>
    <div class="kv"><span>Preis je Flasche</span><span>${p?eur2(p):fl?`reif in ${L.min-l.flMonate} Monaten`:'noch im Fass'}</span></div>
    ${p?`<div class="kv"><span>Gesamtwert</span><span>${eur(p*l.liter)}</span></div>`:''}</div>`;
  }
  return h;
}

// Liest den Anteil p (0 bis 1) eines Feldes. Bei p<1 bleibt der Rest hängen. Der Boden verliert je Feld und Jahr nur einmal 4 Punkte.
function lese(id,la,p){
  const f=S.felder[id], q=feldQ(f,la), l=Math.round(feldLiter(f,la)*p); if(l<=0) return;
  S.lots.push({id:S.nextId++,sorte:id,jahrgang:S.jahr,liter:l,oe:q.oe,leseart:la,edel:f.edel,eis:f.gefroren,status:'trauben',stufe:null,qp:0,fassMonate:0,flMonate:0,sonne:S.sonne,boden:S.boden+4*R().sorten.filter(x=>S.felder[x].gelesen||S.felder[x].teil).length});
  if(!f.teil) S.boden=Math.max(0,S.boden-4);
  if(p>=1){f.gelesen=true;f.menge=0}else{f.teil=true;f.menge=Math.round(f.menge*(1-p))}
  fx('schere'); geh('keller');
}

  // Teil-Lese: Nach der Leseart kommt der Regler für den Anteil des Feldes. Der Rest bleibt hängen und reift weiter.

      info:n=>`<b>${n} % des Feldes</b>${num(voll*n/100)} l Trauben${n<100?`, rund ${num(f.menge*(100-n)/100)} l bleiben am Stock`:''}`,

  /* ---- Hintertür: Panschen ---- */
  zuckern(d){

    mengeSheet({titel:zu?'Most zuckern':'Most wässern',text:zu?'Zucker hebt die Öchsle um den gewählten Anteil.':'Wasser streckt die Menge um den gewählten Anteil, die Öchsle sinken entsprechend.',min:1,max:ZUCKER_MAX-hat,step:1,start:Math.min(5,ZUCKER_MAX-hat),okText:zu?'Zuckern':'Wässern',
      info:n=>{const x=neu(n);return `<b>${n} %</b>danach ${num(x.liter)} l mit ${x.oe}° Öchsle<br><span class="${hat+n>ZUCKER_ERLAUBT?'rot':'mut'}">${hat+n>ZUCKER_ERLAUBT?'Über '+ZUCKER_ERLAUBT+' %: Das ist Panscherei.':'Als Tafelwein noch erlaubt.'}</span>`},
      ok:n=>{const x=neu(n);l.oe=x.oe;l.liter=x.liter;l[k]=hat+n}});
  },
  misch1(){

  },
  misch2(d){
    const a=lot(d.id); if(!a) return;

  },
  misch3(d){
    const a=lot(d.id), b=lot(d.b); if(!a||!b) return; const m=mischung(a,b);
    openSheet(`<h3>Wirklich verschneiden?</h3><p>Aus ${esc(lotName(m.a))} (${num(m.a.liter)} l) und ${esc(lotName(m.b))} (${num(m.b.liter)} l) werden ${num(m.liter)} l ${esc(lotName(m.a))}.</p>
      <div class="kv"><span>Öchsle</span><span>${m.oe}°</span></div><div class="kv"><span>Qualitätspunkte</span><span>${m.qp}</span></div><div class="kv"><span>Schmiergeld für den Beamten</span><span>${eur(m.schmier)}</span></div>
      <p class="rot">Der Wein gilt als gepanscht. Findet ihn der Prüfer, wird er vernichtet und es gibt Strafe.</p>
      <div class="btns"><button class="sec" data-a="close">Lieber nicht</button><button data-a="mischJa" data-id="${a.id}" data-b="${b.id}" ${S.geld<m.schmier?'disabled':''}>Verschneiden</button></div>`);
  },
  mischJa(d){
    const x=lot(d.id), y=lot(d.b); if(!x||!y||!mischbar(x)||!mischbar(y)) return; const m=mischung(x,y), a=m.a;
    if(S.geld<m.schmier) return;
    closeSheet(); fx('stempel'); zahle(m.schmier);
    Object.assign(a,{liter:m.liter,oe:m.oe,qp:m.qp,fassMonate:Math.max(a.fassMonate,m.b.fassMonate),pansch:true});
    S.lots=S.lots.filter(l=>l!==m.b); save();render();
    meldung('Verschnitten',`${lotName(a)}: ${num(a.liter)} l mit ${a.qp} Qualitätspunkten. Bis er verkauft ist, darf ihn kein Prüfer finden.`);
  },
  /* ---- Weinkontrolle ---- */
  pruefJa(){if(!S.pruefer) return; const t=pruefEnde(0); save();render(); meldung('🔍 Erwischt',t,'kontrolle')},
  pruefBestechen(){
    if(!S.pruefer) return;
    const max=Math.floor(Math.min(BESTECH_MAX,S.geld)/1000)*1000; if(max<BESTECH_MIN) return;
    mengeSheet({titel:'Prüfer bestechen',text:`Je dicker der Umschlag, desto eher nimmt er ihn. Lehnt er ab, behältst du dein Geld, aber er prüft erst recht und es kostet ${BESTECH_NEIN_ANS} Ansehen extra.`,min:BESTECH_MIN,max,step:1000,start:Math.min(max,20000),okText:'Umschlag rüberschieben',
      info:n=>`<b>${eur(n)}</b>Er nimmt mit ${Math.round(bestechChance(n)*100)} % an`,
      ok:n=>{
        if(Math.random()<bestechChance(n)){zahle(n); kontrNeu(); S.pruefer=0; meldung('🔍 Glück gehabt','Der Prüfer steckt den Umschlag ein, blättert kurz durchs Kellerbuch und findet nichts.')}

  /* ---- Sabotage ---- */
  sabZiel(){
    if(sabSperre()) return;
    openSheet(`<h3>Wen soll es treffen?</h3>${S.gegner.map(g=>`<button class="wahl" data-a="sabWas" data-id="${g.id}"><b>${esc(g.name)}</b><br><span class="mut">${GEGNER_TYP[g.typ].art}, ${REGIONEN[g.region].name} · ${RAENGE[g.rang].kurz} · ${Math.round(g.ansehen)} Ansehen · ${g.ha} ha</span></button>`).join('')}<div class="btns"><button class="sec" data-a="close">Abbrechen</button></div>`);
  },
  sabWas(d){
    const g=S.gegner[+d.id]; if(!g||sabSperre()) return;
    openSheet(`<h3>Was soll bei ${esc(g.name)} passieren?</h3>${Object.entries(SAB).map(([k,v])=>`<button class="wahl" data-a="sabGeld" data-id="${g.id}" data-k="${k}"><b>${v[0]}</b><br><span class="mut">${v[1]}</span></button>`).join('')}<div class="btns"><button class="sec" data-a="close">Abbrechen</button></div>`);
  },
  sabGeld(d){
    const g=S.gegner[+d.id], k=d.k; if(!g||!SAB[k]||sabSperre()) return;
    const max=Math.floor(Math.min(SAB_MAX,S.geld-SAB_KONTAKT)/1000)*1000;
    mengeSheet({titel:`${SAB[k][0]} bei ${g.name}`,text:`Der Kontakt kostet ${eur(SAB_KONTAKT)}, dazu kommt das Handgeld. Das Geld ist in jedem Fall weg.`,min:SAB_MIN,max,step:1000,start:Math.min(max,20000),okText:'Auftrag geben',
      info:n=>`<b>${eur(n)} Handgeld</b>zusammen ${eur(SAB_KONTAKT+n)} · klappt mit ${Math.round(sabChance(n)*100)} %, fliegt mit ${Math.round(SAB_AUFFLIEGEN*100)} % auf`,
      ok:n=>{
        if(sabSperre()) return;
        S.sabJahr=S.jahr; zahle(SAB_KONTAKT+n);
        const r=Math.random(), p=sabChance(n);
        if(r<p){
          let t='';
          if(k==='gift'){const v=Math.round(g.ha*rnd(3000,5000)/100)*100; g.geld-=v; t=`Der beste Fasswein von ${g.name} ist hin. Schaden rund ${eur(v)}.`}
          if(k==='buch'){g.falsch=rint(2,10); t=`Im Kellerbuch von ${g.name} stehen jetzt gepanschte Weine. Die nächste Kontrolle dort wird teuer.`}
          if(k==='berg'){g.schaden=.25; const v=g.ha*1500; g.geld-=v; t=`Bei ${g.name} ist ein Viertel der Reben zerstört, dazu Flaschen für rund ${eur(v)}. Die nächste Ernte fällt kleiner aus.`}
          meldung('💣 Es hat geklappt',t);
        }else if(r<p+SAB_AUFFLIEGEN){zahle(SAB_STRAFE); ruhm(-SAB_STRAFE_ANS); meldung('💣 Aufgeflogen',`Dein Mann wurde bei ${g.name} erwischt und hat geplaudert. ${eur(SAB_STRAFE)} Strafe und ${SAB_STRAFE_ANS} Ansehen weg.`)}
        else meldung('💣 Fehlschlag',`Der Mittelsmann kommt mit leeren Händen zurück. Bei ${g.name} ist nichts passiert, dein Geld ist trotzdem weg.`);
      }});
  },
  // Tipp ins Bild öffnet den Ort des Motivs.
  bild(d,e){const s=panoTipp(e); if(s&&s!==SUB){SUB=s;render()}},
  keltern(d){
    const l=lot(d.id), frei=S.fassraum-fassBelegt();
    if(frei<=0) return meldung('Kein Fassraum frei','Kauf erst Fassraum dazu, sonst kannst du nicht keltern.');
    if(l.liter>frei) return openSheet(`<h3>Fassraum reicht nicht</h3><p>Frei sind ${num(frei)} l, du hast ${num(l.liter)} l Trauben. Wenn du jetzt kelterst, gehen ${num(l.liter-frei)} l verloren.</p><div class="btns"><button class="sec" data-a="close">Erst Fassraum kaufen</button><button data-a="kelternJa" data-id="${l.id}">Trotzdem keltern</button></div>`);
    AKT.kelternJa(d);
  },
  kelternJa(d){const l=lot(d.id);closeSheet();l.liter=Math.min(l.liter,S.fassraum-fassBelegt());l.status='fass';l.fassMonate=0;save();render()},
  kaufFass(){
    const kap=S.lagerarb*FASS_JE_LAGERARB-S.fassraum, max=Math.min(20000,kap,Math.floor(S.geld/FASS_PREIS/500)*500);

    if(max<500) return meldung('Zu wenig Geld',`500 l Fassraum kosten ${eur(500*FASS_PREIS)}.`);
    mengeSheet({titel:'Fassraum kaufen',text:`${eur2(FASS_PREIS)} je Liter Fassraum. Deine Lagerarbeiter schaffen noch ${num(kap)} l mehr.`,max,step:500,start:Math.min(max,2000),okText:'Kaufen',
      info:n=>`<b>${num(n)} l</b>kostet ${eur(n*FASS_PREIS)}`,ok:n=>{fx('stempel');zahle(n*FASS_PREIS);S.fassraum+=n}});
  },
  kaufFlaschen(){
    const kap=S.lagerarb*FLASCHEN_JE_LAGERARB-S.flaschen, max=Math.min(30000,kap,Math.floor(S.geld/FLASCHE_PREIS/100)*100);
    if(kap<100) return leuteSheet('Zu wenige Lagerarbeiter',`<p>Ein Lagerarbeiter betreut ${num(FLASCHEN_JE_LAGERARB)} leere Flaschen. Deine Leute betreuen ${num(S.lagerarb*FLASCHEN_JE_LAGERARB)}, du hast schon ${num(S.flaschen)}.</p><p class="mut">Für mehr Flaschen stell erst beim Arbeitsamt ein, oder füll erst Wein ab.</p>`);
    if(max<100) return meldung('Zu wenig Geld',`100 Flaschen kosten ${eur(100*FLASCHE_PREIS)}.`);
    mengeSheet({titel:'Leere Flaschen kaufen',text:`${eur2(FLASCHE_PREIS)} je Flasche (1 Liter). Deine Lagerarbeiter schaffen noch ${num(kap)} mehr.`,max,step:100,start:Math.min(max,2000),okText:'Kaufen',
      info:n=>`<b>${num(n)} Flaschen</b>kostet ${eur(n*FLASCHE_PREIS)}`,ok:n=>{fx('stempel');zahle(n*FLASCHE_PREIS);S.flaschen+=n}});
  },
  anmelden(d){
    const l=lot(d.id);
    const M=mani(l);
    const zeilen=[...REIHE].reverse().concat('feder').map(st=>{const g=pruefeAnmeldung(l,st),s=STUFEN[st],ill=M&&!maniLegal(l,st);
      return `<div class="stufe"><div class="row"><b>${g.length?'✗':'✓'} ${s.name}</b>${g.length?'':`<button class="klein ${ill?'sec':''}" data-a="anmeldeJa" data-id="${l.id}" data-st="${st}">${ill?`🤫 Unter der Hand (${eur(s.geb+schmier(l,st))})`:`Anmelden${s.geb?' ('+eur(s.geb)+')':''}`}</button>`}</div>${g.length?`<div class="mut">${g.map(esc).join(' · ')}</div>`:st==='eis'?`<div class="mut">Wertstufe: Öchsle einer ${EIS_WERT[eisStufe(l.oe)].name}${eisStufe(l.oe)?`, Preis +${Math.round((EIS_WERT[eisStufe(l.oe)].f-1)*100)} %`:''}</div>`:''}</div>`}).join('');
    openSheet(`${sbild('amt')}<h3>${esc(lotName(l))} anmelden</h3><p class="mut">${num(l.liter)} l · ${l.oe}° Öchsle · ${LESE[l.leseart]} · Edelfäulnis ${l.edel?'ja':'nein'} · ${l.fassMonate} Monate im Fass</p>${M?`<p class="hilfe" style="margin:0 0 10px">🤫 Dieser Most ist ${maniText(l)}. Erlaubt ist das nur beim Tafelwein bis ${ZUCKER_ERLAUBT} %. Alles andere geht nur unter der Hand gegen Schmiergeld, und der Wein gilt dann als gepanscht.</p>`:''}${zeilen}<div class="btns"><button class="sec" data-a="close">Schließen</button></div>`);
  },
  anmeldeJa(d){
    const l=lot(d.id), st=d.st, s=STUFEN[st];
    if(pruefeAnmeldung(l,st).length) return;
    // Gepanschter Most: nur unter der Hand, mit Schmiergeld und ohne Ansehen.
    const ill=mani(l)&&!maniLegal(l,st), sg=ill?schmier(l,st):0;
    if(ill&&S.geld<s.geb+sg) return meldung('Zu wenig Geld',`Der Beamte will ${eur(sg)} Schmiergeld${s.geb?`, dazu kommt die Gebühr von ${eur(s.geb)}`:''}.`);

    if(st==='eis') l.eisW=eisStufe(l.oe);

    const ans=s.ans&&!ill?ruhm(s.ans):0;closeSheet();save();render();fx('stempel');
    meldung('Angemeldet',`${lotName(l)} steht jetzt mit ${l.qp} Qualitätspunkten im Kellerbuch.`+(ill?` Der Beamte hat ${eur(sg)} eingesteckt. Bis der Wein verkauft ist, darf ihn kein Prüfer finden.`:'')+(ans?` +${ans} Ansehen.`:'')+(st==='feder'?' Federweißer muss noch diesen Monat in die Flasche.':' Jetzt darf er abgefüllt werden.'),'kellerbuch');
  },
  abfuellen(d){
    const l=lot(d.id);
    if(!l.stufe) return;
    if(S.flaschen<l.liter) return meldung('Zu wenige Flaschen',`Abgefüllt wird immer das ganze Fass. Du brauchst ${num(l.liter)} Flaschen und hast ${num(S.flaschen)}. Es fehlen ${num(l.liter-S.flaschen)}.`);

  sekt(d){

      info:n=>`<b>${num(n)} Flaschen</b>kostet ${eur(n*SEKT_KOSTEN)}`,
      ok:n=>{fx('korken');zahle(n*SEKT_KOSTEN);S.lots.push({...l,id:S.nextId++,liter:n,sekt:true,flMonate:0,qp:l.qp+5,med:(l.med||[]).slice(),bund:false});l.liter-=n;if(l.liter<=0)S.lots=S.lots.filter(x=>x!==l);if(S.sektJahr!==S.jahr&&!l.pansch){S.sektJahr=S.jahr;ruhm(3)}}});
  },
  kredit(){
    if(S.kredit) return;
    mengeSheet({titel:'Kredit aufnehmen',text:`Dein Kreditrahmen: ${eur(rahmen())}. Mindestens 5.000 €.`,max:rahmen(),step:1000,start:10000,okText:'Weiter',
      info:n=>`<b>${eur(n)}</b>Die Laufzeit wählst du im nächsten Schritt`,
      ok:n=>{
        if(n<5000) return meldung('Zu wenig','Die Bank vergibt Kredite erst ab 5.000 €.');
        openSheet(`<h3>Laufzeit für ${eur(n)}</h3>${[12,24,36,48].map(m=>`<button class="wahl" data-a="kreditJa" data-n="${n}" data-m="${m}"><b>${m} Monate</b><br><span class="mut">erste Rate ${eur(n/m+n*ZINS/12)}, Zinsen gesamt rund ${eur(n*ZINS/12*(m+1)/2)}</span></button>`).join('')}<div class="btns"><button class="sec" data-a="close">Abbrechen</button></div>`);
      }});
  },
  kreditJa(d){const n=+d.n,m=+d.m;closeSheet();if(S.kredit)return;S.kredit={rest:n,tilgung:Math.ceil(n/m)};S.geld+=n;fx('kasse');save();render()},
  tilgen(){const k=S.kredit;if(!k||S.geld<k.rest)return;S.geld-=k.rest;S.kredit=null;fx('stempel');save();render()},
  helfer(d){

  maschKauf(){
